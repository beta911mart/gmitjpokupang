<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Sensus Lapangan - GMIT JPO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

<!-- TOMBOL KEMBALI MELAYANG -->
    <div id="fabContainer" class="fixed inset-y-0 left-1/2 transform -translate-x-1/2 w-full max-w-md landscape:max-w-3xl md:max-w-md z-[9000] pointer-events-none">
        <button onclick="window.history.back()" class="absolute pointer-events-auto bg-purple-600/90 backdrop-blur-md text-white px-4 py-3 rounded-full shadow-[0_4px_15px_rgba(147,51,234,0.5)] border border-purple-400 font-bold text-xs flex items-center gap-2 cursor-pointer active:scale-95 transition-all duration-300" style="bottom: 80px; right: 20px;">
            <i class="fa-solid fa-arrow-left"></i> Kembali
        </button>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed inset-0 z-50 flex items-center justify-center px-4 pointer-events-none"></div>

    <!-- Container Utama Full Wide -->
    <div class="w-full px-4 sm:px-6 lg:px-8 py-4 min-h-screen flex flex-col space-y-6">
        
        <!-- HEADER -->
        <header class="bg-slate-900/95 p-4 rounded-xl flex justify-between items-center border border-purple-900/30 shadow-md">
            <h1 class="font-bold text-sm tracking-wide text-purple-400">📋 Panel Sensus Lapangan</h1>
            <button onclick="logoutPetugas()" class="text-xs text-rose-400 bg-rose-950/40 border border-rose-900/50 px-3 py-1.5 rounded-lg transition hover:bg-rose-900/50">Keluar</button>
        </header>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 flex flex-col space-y-4 animate-fade-in w-full">
            
            <!-- HALAMAN LOGIN PETUGAS SENSUS -->
            <div id="loginPetugasSection" class="space-y-4 pt-10 max-w-md mx-auto w-full bg-slate-950 p-6 rounded-2xl border border-slate-800 shadow-xl">
                <div class="text-center space-y-1">
                    <h2 class="text-base font-bold text-white">Login Petugas Sensus</h2>
                    <p class="text-xs text-slate-400">Masukkan akun admin/majelis Anda untuk mendata.</p>
                </div>
                <form onsubmit="handleLoginPetugas(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Username Admin</label>
                        <input type="text" id="adminUser" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                        <input type="password" id="adminPass" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-purple-500">
                    </div>
                    <button type="submit" id="btnLoginAdmin" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-semibold text-xs shadow-md transition">Masuk Sensus</button>
                </form>
            </div>

            <!-- HALAMAN UTAMA SENSUS (PENCARIAN & FORM) -->
            <div id="dashboardSensusSection" class="space-y-6 hidden w-full">
                <div class="bg-purple-950/30 border border-purple-900/50 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-[10px] text-purple-300 block">Petugas Bertugas:</span>
                        <strong id="petugasNameLabel" class="text-xs text-white">Admin</strong>
                    </div>
                    <button onclick="resetForm()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-md transition">➕ Tambah Baru</button>
                </div>

                <!-- SEARCH BAR -->
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2 w-full">
                    <label class="block text-xs font-semibold text-slate-400">Cari Jemaat (Nama / No. WhatsApp)</label>
                    <input type="text" id="searchInput" oninput="filterJemaatList()" placeholder="Ketik nama atau no WA..." class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-purple-500">
                    
                    <!-- Dropdown / List Hasil Pencarian -->
                    <div id="searchResults" class="max-h-60 overflow-y-auto space-y-1 bg-slate-900 border border-slate-800 rounded-xl p-2 hidden">
                        <!-- Hasil dimuat dinamis -->
                    </div>
                </div>

                <!-- FORM INPUT / EDIT DATA JEMAAT -->
                <form id="formSensus" onsubmit="submitSensusData(event, 'verify')" class="space-y-4 bg-slate-950 p-6 rounded-2xl border border-slate-800 w-full">
                    <input type="hidden" id="userIdField">
                    
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800">
                        <h3 id="formTitle" class="font-bold text-sm text-purple-400">Form Pendataan Jemaat</h3>
                        <span id="badgeStatus" class="text-[10px] bg-amber-950 text-amber-400 px-2.5 py-1 rounded font-semibold border border-amber-900/50">Status: Belum Diverifikasi</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap</label>
                            <input type="text" id="sNama" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Jenis Kelamin</label>
                            <select id="sGender" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                                <option value="-">Pilih Jenis Kelamin</option>
                                <option value="Laki-laki">Laki-laki</option>
                                <option value="Perempuan">Perempuan</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Tempat Lahir</label>
                            <input type="text" id="sTempatLahir" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Tanggal Lahir</label>
                            <input type="date" id="sTglLahir" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Status Pelayanan</label>
                            <select id="sStatus" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                                <option value="Jemaat">Jemaat</option>
                                <option value="Pendeta">Pendeta</option>
                                <option value="Penatua">Penatua</option>
                                <option value="Diaken">Diaken</option>
                                <option value="Pendeta">Pengajar</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Lingkungan</label>
                            <input type="text" id="sLingkungan" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Rayon</label>
                            <input type="text" id="sRayon" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nomor WhatsApp</label>
                            <input type="tel" id="sWa" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Pekerjaan</label>
                            <input type="text" id="sPekerjaan" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Alamat Domisili</label>
                        <textarea id="sAlamat" rows="2" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Gol. Darah</label>
                            <select id="sGoldar" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                                <option value="-">-</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="AB">AB</option>
                                <option value="O">O</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Minat Pelayanan</label>
                            <select id="sKomisi" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none">
                                <option value="Umum">Jemaat Umum</option>
                                <option value="PW">Perempuan / Wanita (PW)</option>
                                <option value="PKB">Kaum Bapak (PKB)</option>
                                <option value="Pemuda/Remaja">Pemuda & Remaja</option>
                                <option value="Sekolah Minggu">Sekolah Minggu</option>
                            </select>
                        </div>
                    </div>

                    <!-- Tombol Aksi Ganda -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-3">
                        <button type="button" onclick="submitSensusData(event, 'save')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 py-3 rounded-xl font-semibold text-xs transition">Simpan Saja</button>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold text-xs shadow-md transition">Simpan & Verifikasi ☑️</button>
                    </div>
                </form>
            </div>

        </main>
        
        <footer class="p-4 bg-slate-900 border border-slate-800 rounded-xl text-center text-[10px] text-slate-500">
            Modul Sensus Lapangan &bull; GMIT JPO Digital
        </footer>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLTEI5pSm4gjnBQHcqCwFMS7vcIzpWt6sfXtdjpEk1QlnndTlSA6nZYlQwfWFY_oLHzA/exec";
        
        let allUsersCache = [];
        let currentAdmin = null;

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            container.innerHTML = ""; 
            const toast = document.createElement("div");
            const bgColor = type === "success" ? "bg-emerald-600" : "bg-rose-600";
            toast.className = `${bgColor} text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-semibold pointer-events-auto max-w-xs w-full text-center`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'} ${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function handleLoginPetugas(e) {
            e.preventDefault();
            const btn = document.getElementById("btnLoginAdmin");
            const user = document.getElementById("adminUser").value;
            const pass = document.getElementById("adminPass").value;

            btn.disabled = true;
            btn.innerHTML = "Memverifikasi...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "sensusLogin", username: user, password: pass })
                });
                const result = await response.json();

                if (result.status === "success") {
                    currentAdmin = result.admin;
                    localStorage.setItem("petugas_sensus", JSON.stringify(currentAdmin));
                    document.getElementById("petugasNameLabel").innerText = currentAdmin.nama;
                    
                    document.getElementById("loginPetugasSection").classList.add("hidden");
                    document.getElementById("dashboardSensusSection").classList.remove("hidden");
                    loadAllUsersData();
                    showToast("Login Petugas Sensus Berhasil!");
                } else {
                    showToast(result.message, "error");
                    btn.disabled = false;
                    btn.innerHTML = "Masuk Sensus";
                }
            } catch (err) {
                showToast("Koneksi gagal: " + err, "error");
                btn.disabled = false;
                btn.innerHTML = "Masuk Sensus";
            }
        }

        function logoutPetugas() {
            localStorage.removeItem("petugas_sensus");
            document.getElementById("dashboardSensusSection").classList.add("hidden");
            document.getElementById("loginPetugasSection").classList.remove("hidden");
            document.getElementById("adminUser").value = "";
            document.getElementById("adminPass").value = "";
        }

        async function loadAllUsersData() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getAllUsers`);
                const result = await response.json();
                allUsersCache = result.users || [];
            } catch (err) {
                showToast("Gagal memuat database jemaat.", "error");
            }
        }

        function filterJemaatList() {
            const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
            const resultsDiv = document.getElementById("searchResults");

            if (keyword.length < 2) {
                resultsDiv.classList.add("hidden");
                return;
            }

            const matched = allUsersCache.filter(u => 
                u.nama_lengkap.toLowerCase().includes(keyword) || 
                String(u.no_whatsapp).includes(keyword)
            );

            if (matched.length === 0) {
                resultsDiv.innerHTML = `<p class="text-[11px] text-slate-400 text-center py-2">Jemaat tidak ditemukan. Silakan klik Tambah Baru.</p>`;
                resultsDiv.classList.remove("hidden");
                return;
            }

            resultsDiv.innerHTML = matched.map(u => `
                <div onclick='selectJemaatForEdit(${JSON.stringify(u)})' class="p-2.5 bg-slate-900 hover:bg-purple-950/40 rounded-lg cursor-pointer border border-slate-800 flex justify-between items-center transition">
                    <div>
                        <p class="text-xs font-bold text-white">${u.nama_lengkap} ${u.is_verified ? '☑️' : ''}</p>
                        <p class="text-[10px] text-slate-400">WA: ${u.no_whatsapp} &bull; Lingkungan ${u.lingkungan || '-'}</p>
                    </div>
                    <span class="text-[10px] text-purple-400 bg-purple-900/40 px-2 py-1 rounded">Pilih ➔</span>
                </div>
            `).join('');
            resultsDiv.classList.remove("hidden");
        }

        function selectJemaatForEdit(user) {
            document.getElementById("userIdField").value = user.id;
            document.getElementById("sNama").value = user.nama_lengkap || "";
            document.getElementById("sGender").value = user.jenis_kelamin || "-";
            document.getElementById("sTempatLahir").value = user.tempat_lahir || "";
            document.getElementById("sTglLahir").value = user.tanggal_lahir ? user.tanggal_lahir.split('T')[0] : "";
            document.getElementById("sStatus").value = user.status_pelayanan || "Jemaat";
            document.getElementById("sLingkungan").value = user.lingkungan || "";
            document.getElementById("sRayon").value = user.rayon || "";
            document.getElementById("sWa").value = user.no_whatsapp || "";
            document.getElementById("sAlamat").value = user.alamat || "";
            document.getElementById("sPekerjaan").value = user.pekerjaan || "";
            document.getElementById("sGoldar").value = user.golongan_darah || "-";
            document.getElementById("sKomisi").value = user.minat_pelayanan || "Umum";

            document.getElementById("formTitle").innerText = "Edit / Lengkapi Data Jemaat";
            
            const isVerified = user.is_verified === true || user.is_verified === "Verified";
            const badge = document.getElementById("badgeStatus");
            
            if (isVerified) {
                badge.innerText = "Status: Verified ☑️";
                badge.className = "text-[10px] bg-emerald-950 text-emerald-400 px-2.5 py-1 rounded font-semibold border border-emerald-900/50";
            } else {
                badge.innerText = "Status: Belum Verified";
                badge.className = "text-[10px] bg-amber-950 text-amber-400 px-2.5 py-1 rounded font-semibold border border-amber-900/50";
            }
            
            document.getElementById("searchResults").classList.add("hidden");
            document.getElementById("searchInput").value = "";
            showToast("Data jemaat dimuat ke form.");
        }

        function resetForm() {
            document.getElementById("formSensus").reset();
            document.getElementById("userIdField").value = "";
            document.getElementById("formTitle").innerText = "Pendaftaran Sensus Baru";
            document.getElementById("badgeStatus").innerText = "Status: Baru";
        }

        async function submitSensusData(e, mode) {
            e.preventDefault();
            const userId = document.getElementById("userIdField").value;
            const isVerifying = mode === 'verify';

            const payload = {
                action: "sensusSaveData",
                user_id: userId,
                nama_lengkap: document.getElementById("sNama").value,
                jenis_kelamin: document.getElementById("sGender").value,
                tempat_lahir: document.getElementById("sTempatLahir").value,
                tanggal_lahir: document.getElementById("sTglLahir").value,
                status_pelayanan: document.getElementById("sStatus").value,
                lingkungan: document.getElementById("sLingkungan").value,
                rayon: document.getElementById("sRayon").value,
                no_whatsapp: document.getElementById("sWa").value,
                alamat: document.getElementById("sAlamat").value,
                pekerjaan: document.getElementById("sPekerjaan").value,
                golongan_darah: document.getElementById("sGoldar").value,
                minat_pelayanan: document.getElementById("sKomisi").value,
                is_verified: isVerifying,
                verified_by: currentAdmin.nama
            };

            showToast("Menyimpan data sensus...");

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "success") {
                    showToast(result.message);
                    resetForm();
                    loadAllUsersData();
                } else {
                    showToast(result.message, "error");
                }
            } catch (err) {
                showToast("Gagal menyimpan ke server.", "error");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedPetugas = localStorage.getItem("petugas_sensus");
            if (savedPetugas) {
                currentAdmin = JSON.parse(savedPetugas);
                document.getElementById("petugasNameLabel").innerText = currentAdmin.nama;
                document.getElementById("loginPetugasSection").classList.add("hidden");
                document.getElementById("dashboardSensusSection").classList.remove("hidden");
                loadAllUsersData();
            }
        });
    </script>
</body>
</html>
