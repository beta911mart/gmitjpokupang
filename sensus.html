<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Sensus Lapangan - GMIT JPO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

<!-- TOMBOL KEMBALI MELAYANG -->
    <div id="fabContainer" class="fixed inset-y-0 left-1/2 transform -translate-x-1/2 w-full max-w-md landscape:max-w-3xl md:max-w-md z-[9000] pointer-events-none">
        <button id="floatingBackBtn" class="absolute pointer-events-auto bg-purple-600/90 backdrop-blur-md text-white px-4 py-3 rounded-full shadow-[0_4px_15px_rgba(147,51,234,0.3)] border border-purple-400 font-bold text-xs flex items-center gap-2 cursor-pointer active:scale-95 transition-all duration-300" style="bottom: 80px; right: 20px;">
            <i class="fa-solid fa-arrow-left"></i> Kembali
        </button>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed inset-0 z-50 flex items-center justify-center px-4 pointer-events-none"></div>

    <!-- Container Utama Full Wide -->
    <div class="w-full px-4 sm:px-6 lg:px-8 py-4 min-h-screen flex flex-col space-y-6">
        
        <!-- HEADER -->
        <header class="bg-white p-4 rounded-xl flex justify-between items-center border border-slate-200 shadow-sm">
            <h1 class="font-bold text-sm tracking-wide text-purple-700">📋 Panel Sensus Lapangan</h1>
            <button onclick="logoutPetugas()" class="text-xs text-rose-600 bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-lg transition hover:bg-rose-100 font-semibold">Keluar</button>
        </header>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 flex flex-col space-y-4 animate-fade-in w-full">
            
            <!-- HALAMAN LOGIN PETUGAS SENSUS -->
            <div id="loginPetugasSection" class="space-y-4 pt-10 max-w-md mx-auto w-full bg-white p-6 rounded-2xl border border-slate-200 shadow-lg">
                <div class="text-center space-y-1">
                    <h2 class="text-base font-bold text-slate-900">Login Petugas Sensus</h2>
                    <p class="text-xs text-slate-500">Masukkan akun admin/majelis Anda untuk mendata.</p>
                </div>
                <form onsubmit="handleLoginPetugas(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Username Admin</label>
                        <input type="text" id="adminUser" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                        <input type="password" id="adminPass" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    </div>
                    <button type="submit" id="btnLoginAdmin" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-semibold text-xs shadow-md transition">Masuk Sensus</button>
                </form>
            </div>

            <!-- HALAMAN UTAMA SENSUS (PENCARIAN & FORM) -->
            <div id="dashboardSensusSection" class="space-y-6 hidden w-full">
                <div class="bg-purple-50 border border-purple-200 p-4 rounded-xl flex justify-between items-center shadow-sm">
                    <div>
                        <span class="text-[10px] text-purple-600 font-semibold block">Petugas Bertugas:</span>
                        <strong id="petugasNameLabel" class="text-xs text-purple-900">Admin</strong>
                    </div>
                    <button onclick="resetForm()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-sm transition">➕ Tambah Baru</button>
                </div>

                <!-- SEARCH BAR -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2 w-full">
                    <label class="block text-xs font-semibold text-slate-600">Cari Jemaat (Nama / No. WhatsApp)</label>
                    <input type="text" id="searchInput" oninput="filterJemaatList()" placeholder="Ketik nama atau no WA..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-200 transition">
                    
                    <!-- Dropdown / List Hasil Pencarian -->
                    <div id="searchResults" class="max-h-60 overflow-y-auto space-y-1 bg-white border border-slate-200 rounded-xl p-2 hidden shadow-inner">
                        <!-- Hasil dimuat dinamis -->
                    </div>
                </div>

                <!-- FORM INPUT / EDIT DATA JEMAAT -->
                <form id="formSensus" onsubmit="submitSensusData(event, 'verify')" class="space-y-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm w-full">
                    <input type="hidden" id="userIdField">
                    
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
                        <h3 id="formTitle" class="font-bold text-sm text-purple-700">Form Pendataan Jemaat</h3>
                        <span id="badgeStatus" class="text-[10px] bg-amber-100 text-amber-700 px-2.5 py-1 rounded font-bold border border-amber-200">Status: Belum Diverifikasi</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                            <input type="text" id="sNama" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Kelamin</label>
                            <select id="sGender" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                                <option value="-">Pilih Jenis Kelamin</option>
                                <option value="Laki-laki">Laki-laki</option>
                                <option value="Perempuan">Perempuan</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tempat Lahir</label>
                            <input type="text" id="sTempatLahir" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Lahir</label>
                            <input type="date" id="sTglLahir" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Status Jabatan / Pelayanan</label>
                            <select id="sStatus" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                                <option value="Jemaat">Jemaat</option>
                                <option value="Pendeta">Pendeta</option>
                                <option value="Penatua">Penatua</option>
                                <option value="Diaken">Diaken</option>
                                <option value="Pengajar">Pengajar</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Lingkungan</label>
                            <input type="text" id="sLingkungan" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Rayon</label>
                            <input type="text" id="sRayon" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor WhatsApp</label>
                            <input type="tel" id="sWa" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Pekerjaan</label>
                            <input type="text" id="sPekerjaan" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat Domisili</label>
                        <textarea id="sAlamat" rows="2" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Gol. Darah</label>
                            <select id="sGoldar" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                                <option value="-">-</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="AB">AB</option>
                                <option value="O">O</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Minat Pelayanan</label>
                            <select id="sKomisi" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs text-slate-900 outline-none focus:border-purple-500 transition">
                                <option value="Umum">Jemaat Umum</option>
                                <option value="PW">Perempuan / Wanita (PW)</option>
                                <option value="PKB">Kaum Bapak (PKB)</option>
                                <option value="Pemuda/Remaja">Pemuda & Remaja</option>
                                <option value="Sekolah Minggu">Sekolah Minggu</option>
                            </select>
                        </div>
                    </div>

                    <!-- STATUS SAKRAMEN -->
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-cross"></i> Status Sakramen</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <label class="flex items-center gap-3 cursor-pointer bg-white p-3 border border-slate-300 rounded-xl hover:border-purple-400 transition shadow-sm">
                                <input type="checkbox" id="sBaptis" class="w-5 h-5 rounded text-purple-600 focus:ring-purple-500 border-slate-300">
                                <span class="text-xs font-semibold text-slate-800">Sudah Dibaptis</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer bg-white p-3 border border-slate-300 rounded-xl hover:border-purple-400 transition shadow-sm">
                                <input type="checkbox" id="sSidi" class="w-5 h-5 rounded text-purple-600 focus:ring-purple-500 border-slate-300">
                                <span class="text-xs font-semibold text-slate-800">Sudah Sidi</span>
                            </label>
                        </div>
                    </div>

                    <!-- Tombol Aksi Ganda -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-3">
                        <button type="button" onclick="submitSensusData(event, 'save')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 border border-slate-300 py-3 rounded-xl font-bold text-xs transition">Simpan Saja</button>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-xs shadow-md transition">Simpan & Verifikasi ☑️</button>
                    </div>
                </form>
            </div>

        </main>
        
        <footer class="p-4 bg-white border border-slate-200 rounded-xl text-center text-[10px] font-medium text-slate-500 shadow-sm">
            Modul Sensus Lapangan &bull; GMIT JPO Digital
        </footer>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLTEI5pSm4gjnBQHcqCwFMS7vcIzpWt6sfXtdjpEk1QlnndTlSA6nZYlQwfWFY_oLHzA/exec";
        
        let allUsersCache = [];
        let currentAdmin = null;

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            container.innerHTML = ""; 
            const toast = document.createElement("div");
            const bgColor = type === "success" ? "bg-emerald-600" : "bg-rose-600";
            toast.className = `${bgColor} text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold pointer-events-auto max-w-xs w-full text-center border border-white/20`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'} ${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function handleLoginPetugas(e) {
            e.preventDefault();
            const btn = document.getElementById("btnLoginAdmin");
            const user = document.getElementById("adminUser").value;
            const pass = document.getElementById("adminPass").value;

            btn.disabled = true;
            btn.innerHTML = "Memverifikasi...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "sensusLogin", username: user, password: pass })
                });
                const result = await response.json();

                if (result.status === "success") {
                    currentAdmin = result.admin;
                    localStorage.setItem("petugas_sensus", JSON.stringify(currentAdmin));
                    document.getElementById("petugasNameLabel").innerText = currentAdmin.nama;
                    
                    document.getElementById("loginPetugasSection").classList.add("hidden");
                    document.getElementById("dashboardSensusSection").classList.remove("hidden");
                    loadAllUsersData();
                    showToast("Login Petugas Sensus Berhasil!");
                } else {
                    showToast(result.message, "error");
                    btn.disabled = false;
                    btn.innerHTML = "Masuk Sensus";
                }
            } catch (err) {
                showToast("Koneksi gagal: " + err, "error");
                btn.disabled = false;
                btn.innerHTML = "Masuk Sensus";
            }
        }

        function logoutPetugas() {
            localStorage.removeItem("petugas_sensus");
            document.getElementById("dashboardSensusSection").classList.add("hidden");
            document.getElementById("loginPetugasSection").classList.remove("hidden");
            document.getElementById("adminUser").value = "";
            document.getElementById("adminPass").value = "";
        }

        async function loadAllUsersData() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getAllUsers`);
                const result = await response.json();
                allUsersCache = result.users || [];
            } catch (err) {
                showToast("Gagal memuat database jemaat.", "error");
            }
        }

        function filterJemaatList() {
            const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
            const resultsDiv = document.getElementById("searchResults");

            if (keyword.length < 2) {
                resultsDiv.classList.add("hidden");
                return;
            }

            const matched = allUsersCache.filter(u => 
                u.nama_lengkap.toLowerCase().includes(keyword) || 
                String(u.no_whatsapp).includes(keyword)
            );

            if (matched.length === 0) {
                resultsDiv.innerHTML = `<p class="text-[11px] text-slate-500 text-center py-3 font-medium">Jemaat tidak ditemukan. Silakan klik Tambah Baru.</p>`;
                resultsDiv.classList.remove("hidden");
                return;
            }

            resultsDiv.innerHTML = matched.map(u => `
                <div onclick='selectJemaatForEdit(${JSON.stringify(u).replace(/'/g, "&#39;")})' class="p-3 bg-slate-50 hover:bg-purple-50 rounded-lg cursor-pointer border border-slate-200 flex justify-between items-center transition mb-1 shadow-sm">
                    <div>
                        <p class="text-xs font-bold text-slate-900">${u.nama_lengkap} ${u.is_verified ? '☑️' : ''}</p>
                        <p class="text-[10px] text-slate-500 font-medium mt-0.5">WA: ${u.no_whatsapp} &bull; Lingkungan ${u.lingkungan || '-'}</p>
                    </div>
                    <span class="text-[10px] text-purple-700 font-bold bg-purple-100 border border-purple-200 px-2 py-1 rounded">Pilih ➔</span>
                </div>
            `).join('');
            resultsDiv.classList.remove("hidden");
        }

        function selectJemaatForEdit(user) {
            document.getElementById("userIdField").value = user.id;
            document.getElementById("sNama").value = user.nama_lengkap || "";
            document.getElementById("sGender").value = user.jenis_kelamin || "-";
            document.getElementById("sTempatLahir").value = user.tempat_lahir || "";
            document.getElementById("sTglLahir").value = user.tanggal_lahir ? user.tanggal_lahir.split('T')[0] : "";
            
            // Ekstrak status sakramen dari status_pelayanan jika tersimpan di sana
            let rawStatus = user.status_pelayanan || "Jemaat";
            let coreStatus = "Jemaat";
            let isBaptis = false;
            let isSidi = false;

            if (rawStatus.includes("Baptis: Ya")) isBaptis = true;
            if (rawStatus.includes("Sidi: Ya")) isSidi = true;
            
            if (rawStatus.includes("Pendeta")) coreStatus = "Pendeta";
            else if (rawStatus.includes("Penatua")) coreStatus = "Penatua";
            else if (rawStatus.includes("Diaken")) coreStatus = "Diaken";
            else if (rawStatus.includes("Pengajar")) coreStatus = "Pengajar";

            document.getElementById("sStatus").value = coreStatus;
            document.getElementById("sBaptis").checked = isBaptis;
            document.getElementById("sSidi").checked = isSidi;
            
            document.getElementById("sLingkungan").value = user.lingkungan || "";
            document.getElementById("sRayon").value = user.rayon || "";
            document.getElementById("sWa").value = user.no_whatsapp || "";
            document.getElementById("sAlamat").value = user.alamat || "";
            document.getElementById("sPekerjaan").value = user.pekerjaan || "";
            document.getElementById("sGoldar").value = user.golongan_darah || "-";
            document.getElementById("sKomisi").value = user.minat_pelayanan || "Umum";

            document.getElementById("formTitle").innerText = "Edit / Lengkapi Data Jemaat";
            
            const isVerified = user.is_verified === true || user.is_verified === "Verified";
            const badge = document.getElementById("badgeStatus");
            
            if (isVerified) {
                badge.innerText = "Status: Verified ☑️";
                badge.className = "text-[10px] bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded font-bold border border-emerald-300";
            } else {
                badge.innerText = "Status: Belum Verified";
                badge.className = "text-[10px] bg-amber-100 text-amber-800 px-2.5 py-1 rounded font-bold border border-amber-300";
            }
            
            document.getElementById("searchResults").classList.add("hidden");
            document.getElementById("searchInput").value = "";
            showToast("Data jemaat dimuat ke form.");
        }

        function resetForm() {
            document.getElementById("formSensus").reset();
            document.getElementById("userIdField").value = "";
            document.getElementById("formTitle").innerText = "Pendaftaran Sensus Baru";
            
            const badge = document.getElementById("badgeStatus");
            badge.innerText = "Status: Baru";
            badge.className = "text-[10px] bg-blue-100 text-blue-800 px-2.5 py-1 rounded font-bold border border-blue-300";
        }

        async function submitSensusData(e, mode) {
            e.preventDefault();
            const userId = document.getElementById("userIdField").value;
            const isVerifying = mode === 'verify';

            const statusJabatan = document.getElementById("sStatus").value;
            const strBaptis = document.getElementById("sBaptis").checked ? "Ya" : "Belum";
            const strSidi = document.getElementById("sSidi").checked ? "Ya" : "Belum";
            const combinedStatus = `${statusJabatan} (Baptis: ${strBaptis}, Sidi: ${strSidi})`;

            const payload = {
                action: "sensusSaveData",
                user_id: userId,
                nama_lengkap: document.getElementById("sNama").value,
                jenis_kelamin: document.getElementById("sGender").value,
                tempat_lahir: document.getElementById("sTempatLahir").value,
                tanggal_lahir: document.getElementById("sTglLahir").value,
                status_pelayanan: combinedStatus,
                lingkungan: document.getElementById("sLingkungan").value,
                rayon: document.getElementById("sRayon").value,
                no_whatsapp: document.getElementById("sWa").value,
                alamat: document.getElementById("sAlamat").value,
                pekerjaan: document.getElementById("sPekerjaan").value,
                golongan_darah: document.getElementById("sGoldar").value,
                minat_pelayanan: document.getElementById("sKomisi").value,
                is_verified: isVerifying,
                verified_by: currentAdmin.nama
            };

            showToast("Menyimpan data sensus...");

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "success") {
                    showToast(result.message);
                    resetForm();
                    loadAllUsersData();
                } else {
                    showToast(result.message, "error");
                }
            } catch (err) {
                showToast("Gagal menyimpan ke server.", "error");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedPetugas = localStorage.getItem("petugas_sensus");
            if (savedPetugas) {
                currentAdmin = JSON.parse(savedPetugas);
                document.getElementById("petugasNameLabel").innerText = currentAdmin.nama;
                document.getElementById("loginPetugasSection").classList.add("hidden");
                document.getElementById("dashboardSensusSection").classList.remove("hidden");
                loadAllUsersData();
            }
        });

        // --- LOGIKA TOMBOL MELAYANG DRAGGABLE KHUSUS SUB-PAGE ---
        document.addEventListener("DOMContentLoaded", () => {
            const fab = document.getElementById('floatingBackBtn');
            const fabContainer = document.getElementById('fabContainer');
            let isDraggingFab = false, isMoved = false;
            let dragOffsetX = 0, dragOffsetY = 0;

            if (fab && fabContainer) {
                fab.addEventListener('mousedown', startDrag);
                fab.addEventListener('touchstart', startDrag, { passive: false });
                document.addEventListener('mousemove', onDrag);
                document.addEventListener('touchmove', onDrag, { passive: false });
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
                
                // Eksekusi Kembali hanya jika tombol ditekan (bukan digeser)
                fab.addEventListener('click', (e) => {
                    if (isMoved) {
                        e.preventDefault();
                        isMoved = false;
                        return;
                    }
                    window.history.back();
                });
            }

            function startDrag(e) {
                if (e.target === fab || fab.contains(e.target)) {
                    isDraggingFab = true; isMoved = false;
                    const isTouch = e.type.includes('touch');
                    const clientX = isTouch ? e.touches[0].clientX : e.clientX;
                    const clientY = isTouch ? e.touches[0].clientY : e.clientY;
                    const fabRect = fab.getBoundingClientRect();
                    
                    dragOffsetX = clientX - fabRect.left;
                    dragOffsetY = clientY - fabRect.top;
                    
                    const containerRect = fabContainer.getBoundingClientRect();
                    fab.style.transition = 'none';
                    fab.style.right = 'auto'; fab.style.bottom = 'auto';
                    fab.style.left = (fabRect.left - containerRect.left) + 'px';
                    fab.style.top = (fabRect.top - containerRect.top) + 'px';
                }
            }

            function onDrag(e) {
                if (!isDraggingFab) return;
                isMoved = true;
                e.preventDefault(); 
                
                const isTouch = e.type.includes('touch');
                const clientX = isTouch ? e.touches[0].clientX : e.clientX;
                const clientY = isTouch ? e.touches[0].clientY : e.clientY;
                const containerRect = fabContainer.getBoundingClientRect();
                
                let newLeft = (clientX - dragOffsetX) - containerRect.left;
                let newTop = (clientY - dragOffsetY) - containerRect.top;
                
                const maxLeft = containerRect.width - fab.offsetWidth;
                const maxTop = containerRect.height - fab.offsetHeight;
                
                fab.style.left = Math.max(0, Math.min(newLeft, maxLeft)) + 'px';
                fab.style.top = Math.max(0, Math.min(newTop, maxTop)) + 'px';
            }

            function endDrag() {
                isDraggingFab = false;
                if (fab) fab.style.transition = 'all 0.3s ease';
            }
        });
    </script>
</body>
</html>
