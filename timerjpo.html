<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<link rel="manifest" href="manifest.json" />
		<link href="https://fonts.googleapis.com/css2?family=Orbitron&amp;display=swap" rel="stylesheet" />
		<style>
			* { box-sizing: border-box; }
			body {
				font-family: "Inter", sans-serif; margin: 0; padding: 40px; text-align: center;
				background: none; color: #fff; min-height: 100vh; display: flex;
				flex-direction: column; align-items: center;
			}
			h2, h3 { text-align: center; margin-bottom: 20px; }
			.glass {
				background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px);
				border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
				padding: 20px; margin: 20px 0; width: 100%; max-width: 800px;
				box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
			}
			textarea, input {
				width: auto; padding: 10px; margin: 10px 0; border-radius: 80px;
				border: 1px solid rgba(255, 255, 255, 0.5); font-size: 1em;
				background: rgba(255, 255, 255, 0.08); color: #fff;
			}
			select {
				width: auto; padding: 10px; margin: 10px 0; border-radius: 8px;
				border: 1px solid rgba(0, 255, 255, 0.3); font-size: 1em;
				background: rgba(0, 0, 0, 0.4); color: #0ff; appearance: none;
			}
			textarea { height: 200px; resize: vertical; font-family: monospace; }
			button {
				padding: 10px 20px; margin: 10px 5px 0 0; background: rgba(0, 212, 255, 0.2);
				border: 1px solid rgba(0, 212, 255, 0.4); color: #0ff; border-radius: 8px;
				cursor: pointer; font-weight: bold; transition: 0.2s ease;
			}
			button:hover { background: rgba(0, 212, 255, 0.4); }
			.tabs button {
				padding: 10px 20px; margin: 5px; background: #222; color: #ccc;
				border: 1px solid #444; border-radius: 8px; cursor: pointer;
				transition: background 0.3s, color 0.3s;
			}
			.tabs button.active-tab { background: #19d; color: #000; font-weight: bold; border: 1px solid #0f0; }
			.preset-buttons { margin-top: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
			.preset-buttons button { min-width: 80px; font-weight: bold; }
			.tab-content { display: none; padding: 15px; }
			.tab-content.active { display: block; }
			#main-display { font-size: 8em; font-weight: bold; margin: 10px auto 20px; color: #fff; text-align: center; }
			.multi-item { margin: 5px 0; }
			.blink { animation: blink 0.1s step-start 0s infinite; }
			@keyframes blink { 50% { opacity: 0; } }
			.flash-bg { animation: flashbg 3s ease-in-out; }
			#flash-overlay {
				position: fixed; top: 0; left: 0; width: 100%; height: 100%;
				background: white; opacity: 0; pointer-events: none; z-index: 999999;
			}
			#flash-overlay.flash { animation: flashAlarm 3s; }
			@keyframes flashAlarm {
				0% { opacity: 0; } 10% { opacity: 1; } 20% { opacity: 0; }
				30% { opacity: 1; } 40% { opacity: 0; } 50% { opacity: 1; }
				60% { opacity: 0; } 100% { opacity: 0; }
			}
			@keyframes flashbg {
				0%, 100% { background: black; } 10%, 70% { background: #ffd700; }
				20%, 80% { background: #ff6347; } 30%, 90% { background: #40e0d0; }
				40%, 50%, 60% { background: #ffd700; }
			}
			.shake { animation: shake 0.5s ease-in-out; }
			@keyframes shake {
				0%, 100% { transform: translateX(0); }
				20%, 60% { transform: translateX(-10px); }
				40%, 80% { transform: translateX(10px); }
			}
			@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
			.hidden { display: none !important; }
			.side-by-side { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
			.option-pair { display: flex; align-items: center; gap: 10px; }
			.row { display: flex; flex-wrap: wrap; gap: 10px; }
			.col { flex: 1; min-width: 160px; }
			.footer { font-size: 0.8em; color: #888; margin-top: auto; text-align: center; padding: 20px 0; }
			@media (max-width: 768px) {
				input, select, button { width: 100%; max-width: 300px; margin: 5px auto; display: block; }
				.tabs { display: flex; flex-direction: column; }
				.tab-content { display: none; padding: 15px; }
				.tab-content.active { display: block; }
			}
			.menu-panel {
				position: fixed; top: 0; right: -320px; width: 300px; height: 100vh;
				background: rgba(0, 0, 0, 0.9); color: #fff; border-left: 2px solid #0f0;
				padding: 20px; box-shadow: -10px 0 50px rgba(0, 255, 0, 0.2);
				z-index: 998; transition: right 0.3s ease; overflow-y: auto;
			}
			.menu-panel.open { right: 0; }
			.menu-content { display: flex; flex-direction: column; gap: 12px; }
			#menu-toggle {
				position: fixed; top: 50px; right: 50px; z-index: 0;
				background: transparent; color: #0f0; border: none; width: 20px;
				height: 10px; border-radius: 10px; font-size: 2em; cursor: pointer;
				animation: spin 2s linear infinite; text-align: center; line-height: 0px; padding: 0px;
			}
			/* === NEON THEME === */
			.neon-theme { background-color: #000 !important; color: #39ff14; font-family: "Orbitron", sans-serif; }
			.neon-theme input, .neon-theme select {
				background: transparent; color: #39ff14; border: 2px solid #39ff14;
				border-radius: 10px; box-shadow: 0 0 8px #39ff14; padding: 8px; transition: all 0.2s ease-in-out;
			}
			.neon-theme button:hover, .neon-theme input:hover, .neon-theme select:hover {
				background: #aaa; box-shadow: 0 0 16px #39ff14;
			}
			.neon-theme .tabs button.active { background: #39ff14; color: black; box-shadow: 0 0 20px #39ff14; }
			/* === LIGHT THEME === */
			.light-theme { background-color: #d9d9d9 !important; color: #111; font-family: "Segoe UI", sans-serif; }
			.light-theme input, .light-theme select {
				background: #fff; color: #222; border: 2px solid #ccc; border-radius: 8px;
				padding: 8px; transition: all 0.2s ease;
			}
			.light-theme button:hover, .light-theme input:hover, .light-theme select:hover {
				background: #eee; border-color: #888;
			}
			.light-theme .tabs button.active {
				background: #007bff; color: white; border-color: #007bff; box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
			}
			/* === DARK THEME === */
			.dark-theme { background-color: #1e1e1e !important; color: #f0f0f0; font-family: "Segoe UI", sans-serif; }
			.dark-theme input, .dark-theme select {
				background: #222; color: #e0e0e0; border: 2px solid #555; border-radius: 8px;
				padding: 8px; transition: all 0.2s ease;
			}
			.dark-theme button:hover, .dark-theme input:hover, .dark-theme select:hover {
				background: #333; border-color: #888;
			}
			.dark-theme .tabs button.active {
				background: #444; color: white; border-color: #888; box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
			}
			/* === LEMON THEME === */
			.lemon-theme { background-color: #f2ff3b !important; color: #222; font-family: "Comic Sans MS", cursive; }
			.lemon-theme input, .lemon-theme select {
				background: #ffffcc; color: #444; border: 3px solid #ccff33; border-radius: 10px;
				box-shadow: 0 0 5px #ccff33; padding: 8px; transition: all 0.2s ease;
			}
			.lemon-theme button:hover, .lemon-theme input:hover, .lemon-theme select:hover {
				background: #f0f0aa; box-shadow: 0 0 10px #bfff00;
			}
			.lemon-theme .tabs button.active { background: #ccff33; color: #222; box-shadow: 0 0 15px #ccff33; }
			/* === RETRO THEME BUTTONS === */
			.controls button {
				font-family: "Courier New", monospace;
				background: repeating-linear-gradient(45deg, #ffcc00, #ffcc00 10px, #ff9900 10px, #ff9900 20px);
				color: black; border: 3px solid #000; box-shadow: 4px 4px 0 #000;
				padding: 6px 15px; margin: 6px; font-size: 16px; text-transform: uppercase;
				cursor: pointer; transition: all 0.2s ease;
			}
			.controls button:hover { background: #ff6600; box-shadow: 2px 2px 0 #000; transform: translate(1px, 1px); }
			#winner-screen {
				display: none; position: fixed; inset: 0; z-index: 999999;
				background: linear-gradient(135deg, #ffd700, #ffa500, #ffd700);
				color: #000; justify-content: center; align-items: center; flex-direction: column;
				text-align: center; font-family: Arial, sans-serif;
			}
			.winner-banner {
				display: none; margin-top: 20px; text-align: center; font-size: 1.5em; padding: 15px;
				border-radius: 10px; background: linear-gradient(45deg, gold, orange); color: black; animation: pop 0.8s ease;
			}
			@keyframes championPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
			#winner-screen.show { animation: championPop 0.5s ease; }
		</style>
	</head>
	<body>
		<div id="flash-overlay"></div>
		<h2>⭐ TIMER APP PRO: by ℳulℳed™JP◔ ⭐</h2>
		<div id="main-display">00:00.00</div>
		<div class="tabs">
			<button onclick="showTab('countdown')">Countdown</button>
			<button onclick="showTab('stopwatch')" class="pro-tab">Stopwatch</button>

		<div id="countdown" class="tab-content active">
			<div class="controls hidden">
				<input type="number" id="countMin" placeholder="Menit" />
				<input type="number" id="countSec" placeholder="Detik" />
				<button class="retro-button" onclick="startCountdown()">Start</button>
				<button class="retro-button" onclick="pauseCountdown()">Pause</button>
				<button class="retro-button" onclick="resetCountdown()">Reset</button>
				<hr />
				<div class="preset-buttons">
					<button onclick="startPreset(10)">10s</button>
					<button onclick="startPreset(20)">20s</button>
					<button onclick="startPreset(30)">30s</button>
					<button onclick="startPreset(60)">1m</button>
					<button onclick="startPreset(120)">2m</button>
					<button onclick="startPreset(300)">5m</button>
				</div>
			</div>
		</div>
		<div id="stopwatch" class="tab-content active">
			<div class="controls hidden">
				<button class="retro-button" onclick="startStopwatch()">Start</button>
				<button class="retro-button" onclick="pauseStopwatch()">Pause</button>

			<div class="controls hidden">

				<input type="number" id="multiMin" placeholder="Menit" />
				<input type="number" id="multiSec" placeholder="Detik" />
				<button class="retro-button" onclick="addMultiTimer()">+ Add</button>

		<hr />
		<footer style="position: fixed; bottom: 0; width: 100%; text-align: center; padding: 0.5em; background: #222; color: #aaa; font-size: 0.9em;">
			<div id="activation-status" style="margin: 1px; font-weight: bold"></div>
			<div>Copyright ©2026MulMedJPO</div>
			<div>Powered by <a href="https://www.facebook.com/dqnet.warnet/" target="_blank" style="color: #40e0d0">DQnet</a></div>
		</footer>
		<button id="menu-toggle" title="Toggle Menu">🔞</button>
		<div id="menu-panel" class="menu-panel">
			<div class="menu-content">
				<ul style="list-style: none; padding-left: 0; align-items: center; margin: 20px">
					<li>
						<div style="display: flex; flex-direction: column; gap: 8px">
							<button class="option-pair pro-feature" onclick="openPopup()">🖥️ Split Display</button>
							<button class="option-pair pro-feature" onclick="closePopup()">❌ Close Split Display</button>
							<button class="option-pair pro-feature" onclick="openScoreboard()">🏆 Open Scoreboard</button>
							<button class="option-pair pro-feature" onclick="toggleKeyboard()">⌨️ KB Sortcut: ON 💡</button>
							<button class="option-pair pro-feature" onclick="toggleFlashEnabled()">💡 Flash: ON</button>
							<label class="option-pair pro-feature">
								🎨 Theme:
								<select id="themeSelector" onchange="applyTheme(this.value)">
									<option value="light">Light</option>

									<option value="neon">Neon</option>

							<label class="option-pair pro-feature">
							🔉 Volume:
							<input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" />
							</label>
							<label class="option-pair pro-feature">
								🔊 Beep:
								<select id="beepType">
									<option value="1">Sine</option>
									<option value="2">Square</option>
									<option value="3">Triangle</option>
									<option value="4">Siren</option>
									<option value="5">Bicycle Bell</option>
									<option value="6">Church Bell</option>
									<option value="7">Desk Bell</option>
									<option value="8">Train Bell</option>
									<option value="9">Fire Alarm Bell</option>
									<option value="10">Japanese Temple Bell</option>
									<option value="11">Telolet Rendom</option>
								</select>
							</label>
							<button onclick="openAboutPopup()">❔ About &amp; Help</button>
							<button id="reset-btn" onclick="resetActivation()" style="display: none">🔁 Reset Activation</button>
							<button onclick="promptActivationCode()">🔑 Enter Activation Code</button>
							<button id="admin-btn" onclick="openAdminPanel()" style="display: none">🛡️ Admin Panel</button>
						</div>
					</li>
				</ul>
			</div>
		</div>
		<div id="winner-screen">
			<div id="winner-title">🏆 CHAMPION 🏆</div>
			<div id="winner-name">TEAM ALFA</div>
			<div id="winner-score">150 POINTS</div>
		</div>
		<script>
			let countdownInterval, remainingMilliseconds = 0, lastTimestamp;
			let stopwatchInterval, stopwatchTime = 0, stopwatchRunning = false, stopwatchLastTime;
			let multiTimers = [], multiIndex = 0, multiActive = false, popupWindow;
			let multiMode = "sequence", currentManualInterval, activeTimer = null;
			let lastDisplayedTime = "", activated = false, keyboardEnabled = false;
			let scoreboardDataStore = JSON.parse(localStorage.getItem("scoreboardDataStore") || "{}");
			TRIAL_DURATION_DAYS = 1;
			
			// === ONLINE GAS ACTIVATION URL ===
			const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwIAJrOcoBO4HCCwhhiWYIlg2zS93DiBnX5MCl6o8qCY8CWrBcfLJcMnqw1RrM0XW4X/exec";

			async function promptActivationCode() {
			  const used = JSON.parse(localStorage.getItem("usedCodes") || "[]");
			  const code = prompt("Enter activation code:");
			  if (!code) return;

			  try {
			    alert("Memverifikasi kode secara online...");

			    const response = await fetch(GAS_WEB_APP_URL, {
			      method: "POST",
			      mode: "cors",
			      headers: { "Content-Type": "text/plain;charset=utf-8" },
			      body: JSON.stringify({ code: code })
			    });
			    
			    const result = await response.json();

			    if (result.status !== "success") {
			    return alert(result.message || "❌ Invalid code.");
    			}

			    // Using the plaintext code as the hash identifier in the client app
			    const hash = result.hash;
			    if (used.includes(hash)) {
			      return alert("⚠️ Code already used on this browser.");
			    }

			    let expDate = null;
			    if (result.expiredIn) {
			      expDate = new Date();
			      expDate.setDate(expDate.getDate() + parseInt(result.expiredIn));
			    }

			    const activation = {
			      activated: true,
			      codeHash: hash,
			      usedAt: new Date().toISOString(),
			      expires: expDate ? expDate.toISOString() : null,
			      fingerprint: getDeviceKey(),
			    };

			    used.push(hash);
			    localStorage.setItem("usedCodes", JSON.stringify(used));
			    localStorage.setItem("access", JSON.stringify(activation));
			    activatePro();
			    alert("✅ Activation successful!");
			  } catch (error) {
			    console.error(error);
			    alert("❌ Gagal terhubung ke server aktivasi online. Pastikan Deployment GAS sudah di-update ke versi terbaru.");
			  }
			}

			function showTab(tabId) {
			  document.querySelectorAll(".tab-content").forEach((tab) => {
			    tab.classList.remove("active");
			    const controls = tab.querySelector(".controls");
			    if (controls) controls.classList.add("hidden");
			  });
			
			  const selectedTab = document.getElementById(tabId);
			  selectedTab.classList.add("active");
			
			  const access = JSON.parse(localStorage.getItem("access") || "{}");
			  if (access.activated) {
			    const controls = selectedTab.querySelector(".controls");
			    if (controls) controls.classList.remove("hidden");
			  }
			
			  document.querySelectorAll(".tabs button").forEach((btn) => {
			    btn.classList.remove("active-tab");
			  });
			  const clickedButton = [...document.querySelectorAll(".tabs button")].find((btn) =>
			    btn.getAttribute("onclick")?.includes(tabId),
			  );
			  if (clickedButton) clickedButton.classList.add("active-tab");
			}
			
			function updateDisplay(min, sec, millis = 0) {
			  const m = String(min).padStart(2, "0");
			  const s = String(sec).padStart(2, "0");
			  const ms = String(Math.floor(millis / 10)).padStart(2, "0");
			  const timeStr = `${m}:${s}.${ms}`;
			
			  if (timeStr !== lastDisplayedTime) {
			    lastDisplayedTime = timeStr;
			    document.getElementById("main-display").textContent = timeStr;
			
			    if (popupWindow && !popupWindow.closed) {
			      const popupTime = popupWindow.document.getElementById("popup-time");
			      if (popupTime) popupTime.textContent = timeStr;
			    }
			  }
			}
			
			function startCountdown() {
			  stopAllTimers();
			  const min = parseInt(document.getElementById("countMin").value) || 0;
			  const sec = parseInt(document.getElementById("countSec").value) || 0;
			  let time = (min * 60 + sec) * 1000;
			  let last = Date.now();
			  clearInterval(countdownInterval);
			  countdownInterval = setInterval(() => {
			    const now = Date.now();
			    time -= now - last;
			    last = now;
			    if (time <= 0) {
			      clearInterval(countdownInterval);
			      updateDisplay(0, 0);
			      playBeep();
			      flashEffect();
			    } else {
			      const t = Math.floor(time / 1000);
			      updateDisplay(Math.floor(t / 60), t % 60, time % 1000);
			    }
			  }, 80);
			}
			
			function pauseCountdown() { clearInterval(countdownInterval); }
			function resetCountdown() { clearInterval(countdownInterval); updateDisplay(0, 0, 0); }
			
			function startStopwatch() {
			  stopAllTimers();
			  if (stopwatchRunning) return;
			  stopwatchRunning = true;
			  let last = Date.now();
			  stopwatchInterval = setInterval(() => {
			    const now = Date.now();
			    stopwatchTime += now - last;
			    last = now;
			    const t = Math.floor(stopwatchTime / 1000);
			    updateDisplay(Math.floor(t / 60), t % 60, stopwatchTime % 1000);
			  }, 50);
			}
			function pauseStopwatch() { stopwatchRunning = false; clearInterval(stopwatchInterval); }
			function resetStopwatch() { pauseStopwatch(); stopwatchTime = 0; updateDisplay(0, 0, 0); }
			
			function addMultiTimer() {
			  const label = document.getElementById("multiLabel").value || `Timer ${multiTimers.length + 1}`;
			  const min = parseInt(document.getElementById("multiMin").value) || 0;
			  const sec = parseInt(document.getElementById("multiSec").value) || 0;
			  multiTimers.push({ label, duration: (min * 60 + sec) * 1000 });
			  renderMultiList();
			}
			
			function renderMultiList() {
			  const list = document.getElementById("multi-list");
			  list.innerHTML = "";
			  multiTimers.forEach((t, i) => {
			    list.innerHTML += `<div>${i + 1}. ${t.label} - ${Math.floor(t.duration / 60000)}:${String(((t.duration % 60000) / 1000).toFixed(0)).padStart(2, "0")}</div>`;
			  });
			}
			
			function startMultiTimers() {
			  stopAllTimers();
			  if (multiTimers.length === 0) return;
			  multiMode = document.querySelector('input[name="multi-mode"]:checked')?.value || "sequence";
			  multiActive = true;
			  multiIndex = 0;
			  document.getElementById("nextTimerBtn").style.display = "none";
			  if (multiMode === "manual") runManualTimer(multiIndex);
			  else runMultiTimer(multiTimers[multiIndex]);
			}
			
			function runManualTimer(index) {
			  const timer = multiTimers[index];
			  if (!timer) {
			    multiActive = false; multiIndex = 0; updateDisplay(0, 0, 0); return;
			  }
			  let time = timer.duration;
			  let last = Date.now();
			  countdownInterval = setInterval(() => {
			    const now = Date.now();
			    time -= now - last;
			    last = now;
			    if (time <= 0) {
			      clearInterval(countdownInterval);
			      playBeep();
			      flashEffect();
			      document.getElementById("nextTimerBtn").style.display = "inline-block";
			    } else {
			      const s = Math.floor(time / 1000);
			      updateDisplay(Math.floor(s / 60), s % 60, time % 1000);
			    }
			  }, 10);
			}
			
			function runMultiTimer(timer) {
			  let time = timer.duration;
			  let last = Date.now();
			  countdownInterval = setInterval(() => {
			    const now = Date.now();
			    time -= now - last;
			    last = now;
			    if (time <= 0) {
			      clearInterval(countdownInterval);
			      playBeep();

			  if (key === "t") { if (popupWindow && !popupWindow.closed) popupWindow.postMessage({ type: "TOGGLE_VIEW" }, "*"); return; }
			  if (key === "p") { openPopup(); return; }
			  if (key === "x") { closePopup(); return; }
			  const activeTab = document.querySelector(".tab-content.active")?.id;
			  if (key === "c") showTab("countdown");
			  if (key === "s") showTab("stopwatch");
			  if (key === "m") showTab("multi");
			  if (key === "enter") {
			    if (activeTab === "countdown") startCountdown(); else if (activeTab === "stopwatch") startStopwatch(); else startMultiTimers();
			  }
			  if (key === " ") {
			    e.preventDefault();
			    if (activeTab === "countdown") pauseCountdown(); else if (activeTab === "stopwatch") pauseStopwatch();
			  }
			  if (key === "r") {
			    if (activeTab === "countdown") resetCountdown(); else if (activeTab === "stopwatch") resetStopwatch(); else resetMultiTimers();
			  }
			}
			document.addEventListener("keydown", handleKeyboardShortcuts);
			
			function toggleKeyboard() {
			  keyboardEnabled = !keyboardEnabled;
			  const indicator = document.getElementById("keyboard-status");
			  indicator.textContent = `⌨️ Shortcuts: ${keyboardEnabled ? "ON" : "OFF"}`;
			  indicator.style.color = keyboardEnabled ? "blue" : "gray";
			  const btn = document.querySelector('button[onclick="toggleKeyboard()"]');
			  btn.textContent = keyboardEnabled ? "⌨️ KB Sortcut: ON 💡" : "⌨️ KB Sortcut: OFF";
			}
			
			let flashEnabled = true;
			function toggleFlashEnabled() {
			  flashEnabled = !flashEnabled;
			  const btn = document.querySelector('button[onclick="toggleFlashEnabled()"]');
			  btn.textContent = flashEnabled ? "💡 Flash: ON" : "💤 Flash: OFF";
			}
			
			function flashEffect() {
			  if (!flashEnabled) return;
			  const overlay = document.getElementById("flash-overlay");
			  if (overlay) { overlay.classList.remove("flash"); void overlay.offsetWidth; overlay.classList.add("flash"); }
			  if (popupWindow && !popupWindow.closed) {
			    const popupBody = popupWindow.document.body; popupBody.classList.add("flash-bg");
			    setTimeout(() => { popupBody.classList.remove("flash-bg"); }, 3000);
			  }
			}
			
			window.addEventListener("DOMContentLoaded", () => {
			  checkTrialStatus();
			  const theme = localStorage.getItem("theme") || "light";
			  document.getElementById("themeSelector").value = theme;
			  applyTheme(theme);
			});
			
			function startPreset(seconds) {
			  document.getElementById("countMin").value = Math.floor(seconds / 60);
			  document.getElementById("countSec").value = seconds % 60;
			  startCountdown();
			}
			
			function openAboutPopup() {
			  let aboutWindow = window.open("", "AboutHelp", "width=500,height=800");
			  const aboutHTML = `
			<html>
			<head><title>About & Help</title>

			</head>
			<body><h1>About Timer App Pro V3</h1><p>Built by RungguRangga!</p>
			<p>📋 Activate PRO mode to unlock more features. ✅ </p>
			<p>✔️<b>1 day PRO Rp 50.000,-</b> ✅ </p><p>✔️<b>1 week PRO Rp 200.000,-</b> ✅ </p>
			<h1>Keyboard Shortcuts</h1><i>
			<p>(key = 'P') open Popup </p><p>(key = 'F') fullscreen Popup </p><p>(key = 'X') close Popup </p>
			<p>(key = 'T') switchPopup('score/timer') </p><p>(key = 'C') switchTab('countdown') </p>
			<p>(key = 'S') switchTab('stopwatch') </p><p>(key = 'M') switchTab('multi') </p>
			<p>(key = 'R') reset </p><p>(key = 'Enter') start </p><p>(key = 'Space') pause </p></i>

			  aboutWindow.document.open(); aboutWindow.document.write(aboutHTML); aboutWindow.document.close();
			}
		</script>
