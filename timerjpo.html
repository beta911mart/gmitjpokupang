		<script>
			let countdownInterval,
			  remainingMilliseconds = 0,
			  lastTimestamp;
			let stopwatchInterval,
			  stopwatchTime = 0,
			  stopwatchRunning = false,
			  stopwatchLastTime;
			let multiTimers = [],
			  multiIndex = 0,
			  multiActive = false,
			  popupWindow;
			let multiMode = "sequence";
			let currentManualInterval;
			let activeTimer = null;
			let lastDisplayedTime = "";
			let activated = false;
			let keyboardEnabled = false;
			let scoreboardDataStore = JSON.parse(localStorage.getItem("scoreboardDataStore") || "{}");
			
			// === ONLINE GAS ACTIVATION URL ===
			const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwIAJrOcoBO4HCCwhhiWYIlg2zS93DiBnX5MCl6o8qCY8CWrBcfLJcMnqw1RrM0XW4X/exec";

			async function promptActivationCode() {
			  const used = JSON.parse(localStorage.getItem("usedCodes") || "[]");
			  const code = prompt("Enter activation code:");
			  if (!code) return;

			  try {
			    alert("Memverifikasi kode secara online...");
			    const response = await fetch(`${GAS_WEB_APP_URL}?code=${encodeURIComponent(code)}`);
			    const result = await response.json();

			    if (result.status !== "success") {
			      return alert("❌ Invalid code.");
			    }

			    const hash = result.hash;
			    if (used.includes(hash)) {
			      return alert("⚠️ Code already used on this browser.");
			    }

			    let expDate = null;
			    if (result.expiredIn) {
			      expDate = new Date();
			      expDate.setDate(expDate.getDate() + parseInt(result.expiredIn));
			    }

			    const activation = {
			      activated: true,
			      codeHash: hash,
			      usedAt: new Date().toISOString(),
			      expires: expDate ? expDate.toISOString() : null,
			      fingerprint: getDeviceKey(),
			    };

			    used.push(hash);
			    localStorage.setItem("usedCodes", JSON.stringify(used));
			    localStorage.setItem("access", JSON.stringify(activation));
			    activatePro();
			    alert("✅ Activation successful!");
			  } catch (error) {
			    console.error(error);
			    alert("❌ Gagal terhubung ke server aktivasi online.");
			  }
			}

			TRIAL_DURATION_DAYS = 1;
			
			function showTab(tabId) {
			  document.querySelectorAll(".tab-content").forEach((tab) => {
			    tab.classList.remove("active");
			    const controls = tab.querySelector(".controls");
			    if (controls) controls.classList.add("hidden");
			  });
			
			  const selectedTab = document.getElementById(tabId);
			  selectedTab.classList.add("active");
			
			  const access = JSON.parse(localStorage.getItem("access") || "{}");
			  if (access.activated) {
			    const controls = selectedTab.querySelector(".controls");
			    if (controls) controls.classList.remove("hidden");
			  }
			
			  document.querySelectorAll(".tabs button").forEach((btn) => {
			    btn.classList.remove("active-tab");
			  });
			  const clickedButton = [...document.querySelectorAll(".tabs button")].find((btn) =>
			    btn.getAttribute("onclick")?.includes(tabId),
			  );
			  if (clickedButton) clickedButton.classList.add("active-tab");
			}
			
			function updateDisplay(min, sec, millis = 0) {
			  const m = String(min).padStart(2, "0");
			  const s = String(sec).padStart(2, "0");
			  const ms = String(Math.floor(millis / 10)).padStart(2, "0");
			  const timeStr = `${m}:${s}.${ms}`;
			
			  if (timeStr !== lastDisplayedTime) {
			    lastDisplayedTime = timeStr;
			    document.getElementById("main-display").textContent = timeStr;
			
			    if (popupWindow && !popupWindow.closed) {
			      const popupTime = popupWindow.document.getElementById("popup-time");
			      if (popupTime) popupTime.textContent = timeStr;
			    }
			  }
			}
			
			function startCountdown() {
			  stopAllTimers();
			  const min = parseInt(document.getElementById("countMin").value) || 0;
			  const sec = parseInt(document.getElementById("countSec").value) || 0;
			  let time = (min * 60 + sec) * 1000;
			  let last = Date.now();
			  clearInterval(countdownInterval);
			  countdownInterval = setInterval(() => {
			    const now = Date.now();
			    time -= now - last;
			    last = now;
			    if (time <= 0) {
			      clearInterval(countdownInterval);
			      updateDisplay(0, 0);
			      playBeep();
			      flashEffect();
			    } else {
			      const t = Math.floor(time / 1000);
			      updateDisplay(Math.floor(t / 60), t % 60, time % 1000);
			    }
			  }, 80);
			}
			
			function pauseCountdown() {
			  clearInterval(countdownInterval);
			}
			function resetCountdown() {
			  clearInterval(countdownInterval);
			  updateDisplay(0, 0, 0);
			}
			
			function startStopwatch() {
			  stopAllTimers();
			  if (stopwatchRunning) return;
			  stopwatchRunning = true;
			  let last = Date.now();
			  stopwatchInterval = setInterval(() => {
			    const now = Date.now();
			    stopwatchTime += now - last;
			    last = now;
			    const t = Math.floor(stopwatchTime / 1000);
			    updateDisplay(Math.floor(t / 60), t % 60, stopwatchTime % 1000);
			  }, 50);
			}
			function pauseStopwatch() {
			  stopwatchRunning = false;
			  clearInterval(stopwatchInterval);
			}
			function resetStopwatch() {
			  pauseStopwatch();
			  stopwatchTime = 0;
			  updateDisplay(0, 0, 0);
			}
			
			function addMultiTimer() {
			  const label = document.getElementById("multiLabel").value || `Timer ${multiTimers.length + 1}`;
			  const min = parseInt(document.getElementById("multiMin").value) || 0;
			  const sec = parseInt(document.getElementById("multiSec").value) || 0;
			  multiTimers.push({ label, duration: (min * 60 + sec) * 1000 });
			  renderMultiList();
			}
			
			function renderMultiList() {
			  const list = document.getElementById("multi-list");
			  list.innerHTML = "";
			  multiTimers.forEach((t, i) => {
			    list.innerHTML += `<div>${i + 1}. ${t.label} - ${Math.floor(t.duration / 60000)}:${String(((t.duration % 60000) / 1000).toFixed(0)).padStart(2, "0")}</div>`;
			  });
			}
			
			function startMultiTimers() {
			  stopAllTimers();
			  if (multiTimers.length === 0) return;
			
			  multiMode = document.querySelector('input[name="multi-mode"]:checked')?.value || "sequence";
			  multiActive = true;
			  multiIndex = 0;
			
			  document.getElementById("nextTimerBtn").style.display = "none";
			
			  if (multiMode === "manual") {
			    runManualTimer(multiIndex);
			  } else {
			    runMultiTimer(multiTimers[multiIndex]);
			  }
			}
			
			function runManualTimer(index) {
			  const timer = multiTimers[index];
			  if (!timer) {
			    multiActive = false;
			    multiIndex = 0;
			    updateDisplay(0, 0, 0);
			    return;
			  }
			
			  let time = timer.duration;
			  let last = Date.now();
			  countdownInterval = setInterval(() => {
			    const now = Date.now();
			    time -= now - last;
			    last = now;
			    if (time <= 0) {
			      clearInterval(countdownInterval);
			      playBeep();
			      flashEffect();
			      document.getElementById("nextTimerBtn").style.display = "inline-block";
			    } else {
			      const s = Math.floor(time / 1000);
			      updateDisplay(Math.floor(s / 60), s % 60, time % 1000);
			    }
			  }, 10);
			}
			
			function runMultiTimer(timer) {
			  let time = timer.duration;
			  let last = Date.now();
			  countdownInterval = setInterval(() => {
			    const now = Date.now();
			    time -= now - last;
			    last = now;
			    if (time <= 0) {
			      clearInterval(countdownInterval);
			      playBeep();
			      flashEffect();
			      const mode = document.querySelector('input[name="multi-mode"]:checked')?.value || "sequence";
			      if (mode === "sequence") {
			        if (++multiIndex < multiTimers.length) {
			          runMultiTimer(multiTimers[multiIndex]);
			        } else {
			          multiIndex = 0;
			          updateDisplay(0, 0, 0);
			        }
			      } else if (mode === "manual") {
			        if (multiIndex < multiTimers.length - 1) {
			          document.getElementById("nextTimerBtn").style.display = "inline-block";
			        } else {
			          multiIndex = 0;
			          updateDisplay(0, 0, 0);
			        }
			      }
			    } else {
			      const s = Math.floor(time / 1000);
			      updateDisplay(Math.floor(s / 60), s % 60, time % 1000);
			    }
			  }, 10);
			}
			
			function nextMultiTimer() {
			  document.getElementById("nextTimerBtn").style.display = "none";
			  if (++multiIndex < multiTimers.length) {
			    runMultiTimer(multiTimers[multiIndex]);
			  } else {
			    multiIndex = 0;
			    updateDisplay(0, 0, 0);
			  }
			}
			
			function resetMultiTimers() {
			  multiTimers = [];
			  multiIndex = 0;
			  renderMultiList();
			  updateDisplay(0, 0, 0);
			}
			
			function stopAllTimers() {
			  clearInterval(countdownInterval);
			  pauseStopwatch();
			  multiActive = false;
			}
			
			function playBeep(times = 3) {
			  const ctx = new (window.AudioContext || window.webkitAudioContext)();
			  const vol = parseFloat(document.getElementById("volumeSlider")?.value || 1);
			  const type = parseInt(document.getElementById("beepType")?.value || 1);
			
			  const gain = ctx.createGain();
			  gain.gain.value = vol;
			  gain.connect(ctx.destination);
			
			  if (type === 4) {
			    const osc = ctx.createOscillator();
			    osc.type = "sine";
			    const now = ctx.currentTime;
			    const duration = 4;
			    osc.frequency.setValueAtTime(500, now);
			    for (let i = 0; i < duration; i++) {
			      const t = now + i;
			      osc.frequency.linearRampToValueAtTime(1200, t + 0.5);
			      osc.frequency.linearRampToValueAtTime(500, t + 1);
			    }
			    osc.connect(gain);
			    osc.start(now);
			    osc.stop(now + duration);
			  } else if (type === 5) {
			    const now = ctx.currentTime;
			    for (let i = 0; i < times; i++) {
			      const t = now + i * 0.7;
			      const freqs = [1200, 1500, 1800];
			      freqs.forEach((freq, j) => {
			        const osc = ctx.createOscillator();
			        osc.type = "sine";
			        osc.frequency.setValueAtTime(freq, t + j * 0.01);
			        osc.connect(gain);
			        osc.start(t + j * 0.01);
			        osc.stop(t + 0.3);
			      });
			    }
			  } else if (type === 6) {
			    const t = ctx.currentTime;
			    const osc = ctx.createOscillator();
			    const bellGain = ctx.createGain();
			    osc.type = "triangle";
			    osc.frequency.setValueAtTime(400, t);
			    bellGain.gain.setValueAtTime(vol, t);
			    bellGain.gain.exponentialRampToValueAtTime(0.001, t + 2);
			    osc.connect(bellGain);
			    bellGain.connect(ctx.destination);
			    osc.start(t);
			    osc.stop(t + 2);
			  } else if (type === 7) {
			    const t = ctx.currentTime;
			    const freqs = [1000, 1400];
			    freqs.forEach((freq, i) => {
			      const osc = ctx.createOscillator();
			      osc.type = "sine";
			      osc.frequency.setValueAtTime(freq, t + i * 0.005);
			      osc.connect(gain);
			      osc.start(t + i * 0.005);
			      osc.stop(t + 0.25);
			    });
			  } else if (type === 8) {
			    const baseTime = ctx.currentTime;
			    for (let i = 0; i < times; i++) {
			      const t = baseTime + i * 1.2;
			      const osc = ctx.createOscillator();
			      osc.type = "triangle";
			      osc.frequency.setValueAtTime(700, t);
			      osc.connect(gain);
			      osc.start(t);
			      osc.stop(t + 1);
			    }
			  } else if (type === 9) {
			    const t = ctx.currentTime;
			    const duration = 3;
			    const osc = ctx.createOscillator();
			    const tremolo = ctx.createOscillator();
			    const tremoloGain = ctx.createGain();
			    osc.type = "square";
			    osc.frequency.setValueAtTime(1200, t);
			    tremolo.type = "sine";
			    tremolo.frequency.setValueAtTime(15, t);
			    tremoloGain.gain.value = vol * 0.5;
			    tremolo.connect(tremoloGain.gain);
			    tremolo.start(t);
			    tremolo.stop(t + duration);
			    osc.connect(tremoloGain);
			    tremoloGain.connect(ctx.destination);
			    osc.start(t);
			    osc.stop(t + duration);
			  } else if (type === 10) {
			    const t = ctx.currentTime;
			    const freqs = [150, 300, 450];
			    const bellGain = ctx.createGain();
			    bellGain.gain.setValueAtTime(vol, t);
			    bellGain.gain.exponentialRampToValueAtTime(0.001, t + 6);
			    bellGain.connect(ctx.destination);
			    freqs.forEach((freq) => {
			      const osc = ctx.createOscillator();
			      osc.type = "sine";
			      osc.frequency.setValueAtTime(freq, t);
			      osc.connect(bellGain);
			      osc.start(t);
			      osc.stop(t + 6);
			    });
			  } else if (type === 11) {
			    const scale = [523, 587, 659, 698, 784, 880];
			    const notes = Math.floor(Math.random() * 5) + 6;
			    const now = ctx.currentTime;
			    let time = now;
			    for (let i = 0; i < notes; i++) {
			      const freq = scale[Math.floor(Math.random() * scale.length)];
			      const dur = Math.random() * 0.1 + 0.15;
			      const pause = Math.random() * 0.05 + 0.1;
			      const osc = ctx.createOscillator();
			      osc.type = "square";
			      osc.frequency.setValueAtTime(freq, time);
			      osc.connect(gain);
			      osc.start(time);
			      osc.stop(time + dur);
			      time += dur + pause;
			    }
			  } else {
			    const wave = ["sine", "square", "triangle"][type - 1] || "sine";
			    const freq = [440, 880, 660][type - 1] || 440;
			    const dur = [0.2, 0.1, 0.3][type - 1];
			    for (let i = 0; i < times; i++) {
			      const osc = ctx.createOscillator();
			      osc.type = wave;
			      osc.frequency.setValueAtTime(freq, ctx.currentTime);
			      osc.connect(gain);
			      const start = ctx.currentTime + i * 0.5;
			      osc.start(start);
			      osc.stop(start + dur);
			    }
			  }
			}
			
			const menuToggle = document.getElementById("menu-toggle");
			const menuPanel = document.getElementById("menu-panel");
			
			if (menuToggle && menuPanel) {
			  menuToggle.addEventListener("click", () => {
			    menuPanel.classList.toggle("open");
			  });
			  document.addEventListener("click", (e) => {
			    if (!menuPanel.contains(e.target) && !menuToggle.contains(e.target)) {
			      menuPanel.classList.remove("open");
			    }
			  });
			}
			
			window.addEventListener("message", (e) => {
			  if (e.data?.type === "SAVE_SCOREBOARD") {
			    saveScoreboardData(e.data.data);
			  } else if (e.data?.type === "REQUEST_LOAD_SCOREBOARD") {
			    const data = loadScoreboardData();
			    e.source.postMessage({ type: "LOAD_SCOREBOARD_RESPONSE", data }, "*");
			  }
			});
			
			function openPopup() {
			  if (popupWindow && !popupWindow.closed) {
			    popupWindow.focus();
			    return;
			  }
			  popupWindow = window.open("", "", "width=800,height=500,left=1920,top=100");
			  const popupHTML = `<html><head><title>Timer + Scoreboard</title></head><body><div id="popup-time">00:00.00</div></body></html>`;
			  popupWindow.document.open();
			  popupWindow.document.write(popupHTML);
			  popupWindow.document.close();
			  popupWindow.onbeforeunload = () => { popupWindow = null; };
			}
			
			function closePopup() {
			  if (popupWindow && !popupWindow.closed) {
			    popupWindow.close();
			    popupWindow = null;
			  }
			}
			
			function applyTheme(theme) {
			  const themes = ["neon-theme", "light-theme", "dark-theme", "lemon-theme"];
			  document.body.classList.remove(...themes);
			  document.body.classList.add(`${theme}-theme`);
			  localStorage.setItem("theme", theme);
			}
			
			function getDeviceKey() {
			  return btoa(navigator.userAgent + navigator.language + screen.width + screen.height);
			}
			
			function resetActivation() {
			  localStorage.removeItem("access");
			  location.reload();
			}
			
			function activatePro() {
			  activated = true;
			  keyboardEnabled = true;
			  document.querySelectorAll(".pro-tab, .pro-feature").forEach((e) => e.classList.remove("hidden"));
			  const lockedMsg = document.getElementById("locked-message");
			  if (lockedMsg) lockedMsg.style.display = "none";
			  const status = document.getElementById("activation-status");
			  if (status) {
			    status.textContent = "✅ Activated – Pro Unlocked!";
			    status.style.color = "green";
			  }
			}
			
			function checkTrialStatus() {
			  const data = JSON.parse(localStorage.getItem("access") || "{}");
			  const proElements = document.querySelectorAll(".pro-tab, .pro-feature");
			  const status = document.getElementById("activation-status");
			  if (!status) return;
			
			  if (data.fingerprint && data.fingerprint !== getDeviceKey()) {
			    localStorage.removeItem("access");
			    status.textContent = "⛔ Activation invalid on this browser.";
			    status.style.color = "red";
			    proElements.forEach((e) => e.classList.add("hidden"));
			    return;
			  }
			
			  if (data.activated) {
			    activated = true;
			    keyboardEnabled = true;
			    if (data.expires) {
			      const now = new Date();
			      const expiresAt = new Date(data.expires);
			      const msLeft = expiresAt - now;
			
			      if (msLeft <= 0) {
			        localStorage.removeItem("access");
			        status.textContent = "⛔ Activation expired – Please activate again.";
			        status.style.color = "red";
			        proElements.forEach((e) => e.classList.add("hidden"));
			        return;
			      }
			
			      const hours = Math.floor(msLeft / (1000 * 60 * 60));
			      const minutes = Math.floor((msLeft % (1000 * 60 * 60)) / (1000 * 60));
			      activatePro();
			      status.textContent = `✅ Activated – Berakhir: ${hours} Jam ${minutes} Menit`;
			      status.style.color = "green";
			    } else {
			      activatePro();
			      status.textContent = "✅ Activated – Lifetime access!";
			      status.style.color = "green";
			    }
			    return;
			  }
			
			  proElements.forEach((e) => e.classList.add("hidden"));
			  const trialStart = localStorage.getItem("trialStart");
			  const now = new Date();
			
			  if (!trialStart) {
			    localStorage.setItem("trialStart", now.toISOString());
			    status.textContent = "🎁 Trial started – Activate to unlock Pro features.";
			    status.style.color = "orange";
			    return;
			  }
			
			  const hours = TRIAL_DURATION_DAYS * 24 - (now - new Date(trialStart)) / 3600000;
			  if (hours <= 0) {
			    status.textContent = "⛔ Trial expired – Activation required.";
			    status.style.color = "red";
			  } else {
			    status.textContent = `🎁 Trial active – ${Math.floor(hours)}h left. Activate for full features!`;
			    status.style.color = "orange";
			  }
			}
			
			function renderCodeStatusList() {
			  // Dinonaktifkan karena menggunakan verifikasi online via GAS
			}
			
			let resetTimeout;
			document.addEventListener("keydown", (e) => {
			  if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "a") {
			    const adminBtn = document.getElementById("admin-btn");
			    const resetBtn = document.getElementById("reset-btn");
			    if (adminBtn) adminBtn.style.display = "inline-block";
			    if (resetBtn) resetBtn.style.display = "inline-block";
			    alert("🔐 Admin mode unlocked");
			
			    clearTimeout(resetTimeout);
			    resetTimeout = setTimeout(() => {
			      if (resetBtn) resetBtn.style.display = "none";
			    }, 5000);
			  }
			});
			
			function showWinner() {
			  const banner = document.getElementById('winner-banner');
			  if (banner) banner.style.display = 'block';
			}
			
			function openAdminPanel() {
			  const pass = prompt("Enter Admin Password:");
			  if (pass !== "MulMed2026") {
			    alert("Incorrect password.");
			    return;
			  }
			  alert("Admin panel diakses. Verifikasi online aktif via Google Sheets.");
			}
			
			function openScoreboard() {
			  window.open("", "", "width=800,height=500");
			}
			
			let latestScoreboardData = null;
			window.addEventListener("message", (e) => {
			  if (e.data?.type === "LIVE_SCOREBOARD_UPDATE") {
			    latestScoreboardData = e.data.data;
			  }
			  if (e.data?.type === "REQUEST_LIVE_SCOREBOARD") {
			    e.source.postMessage({ type: "LIVE_SCOREBOARD_RESPONSE", data: latestScoreboardData }, "*");
			  }
			});
			
			function handleKeyboardShortcuts(e) {
			  if (!activated || !keyboardEnabled) return;
			  const key = e.key.toLowerCase();
			  if (key === "p") { openPopup(); return; }
			  if (key === "x") { closePopup(); return; }
			  const activeTab = document.querySelector(".tab-content.active")?.id;
			  if (key === "c") showTab("countdown");
			  if (key === "s") showTab("stopwatch");
			  if (key === "m") showTab("multi");
			}
			
			document.addEventListener("keydown", handleKeyboardShortcuts);
			
			function toggleKeyboard() {
			  keyboardEnabled = !keyboardEnabled;
			  const indicator = document.getElementById("keyboard-status");
			  if (indicator) {
			    indicator.textContent = `⌨️ Shortcuts: ${keyboardEnabled ? "ON" : "OFF"}`;
			    indicator.style.color = keyboardEnabled ? "blue" : "gray";
			  }
			}
			
			let flashEnabled = true;
			function toggleFlashEnabled() {
			  flashEnabled = !flashEnabled;
			}
			
			function flashEffect() {
			  if (!flashEnabled) return;
			  const overlay = document.getElementById("flash-overlay");
			  if (overlay) {
			    overlay.classList.remove("flash");
			    void overlay.offsetWidth;
			    overlay.classList.add("flash");
			  }
			}
			
			window.addEventListener("DOMContentLoaded", () => {
			  checkTrialStatus();
			  const theme = localStorage.getItem("theme") || "light";
			  const themeSelector = document.getElementById("themeSelector");
			  if (themeSelector) themeSelector.value = theme;
			  applyTheme(theme);
			});
			
			function startPreset(seconds) {
			  document.getElementById("countMin").value = Math.floor(seconds / 60);
			  document.getElementById("countSec").value = seconds % 60;
			  startCountdown();
			}
			
			function openAboutPopup() {
			  window.open("", "AboutHelp", "width=500,height=800");
			}
		</script>
