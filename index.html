<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMIT JPO Digital</title>
    
    <!-- Memanggil file manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- Tema warna browser HP -->
    <meta name="theme-color" content="#9333ea">
    <!-- Khusus untuk iPhone / iOS -->
    <link rel="apple-touch-icon" href="download.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 untuk Kartu Informasi Akun yang Elegan -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* ==========================================================
           1. ANIMASI HALUS & CANTIK (KUSTOM)
           ========================================================== */
        @keyframes slideInFromTop {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes smoothFadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* Kelas utilitas animasi untuk dipanggil di HTML & JS */
        .animate-slide-in { animation: slideInFromTop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: smoothFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Animasi responsif tombol/kartu saat disentuh/hover */
        .animate-card-hover { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-card-hover:active { transform: scale(0.94); }

        /* ==========================================================
           2. GAYA KHUSUS MODE LANSIA / SENIOR MODE
           ========================================================== */
        body.senior-mode {
            background-color: #fef3c7 !important; /* Amber 50 (Krem hangat) */
            color: #1e293b !important; /* Slate 800 (Gelap pekat) */
            font-size: 1.15rem !important; /* Memperbesar seluruh teks dasar */
        }
        body.senior-mode .max-w-md,
        body.senior-mode .landscape\:max-w-3xl {
            background-color: #ffffff !important;
            border-color: #fcd34d !important;
            color: #0f172a !important;
        }
        body.senior-mode .bg-slate-900, 
        body.senior-mode .bg-slate-950 {
            background-color: #f8fafc !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.senior-mode p, body.senior-mode span, body.senior-mode label, body.senior-mode a {
            color: #1e293b !important;
            font-size: 0.95rem !important;
        }
        body.senior-mode h1, body.senior-mode h2, body.senior-mode h3, body.senior-mode h4 {
            color: #0f172a !important;
            font-weight: 800 !important;
        }
        body.senior-mode input, body.senior-mode select, body.senior-mode textarea {
            background-color: #ffffff !important;
            border: 2px solid #94a3b8 !important;
            color: #0f172a !important;
            font-size: 1rem !important;
            padding: 12px !important;
        }
        body.senior-mode button {
            font-size: 1rem !important;
            font-weight: bold !important;
            padding-top: 12px !important;
            padding-bottom: 12px !important;
        }
    </style>
</head>
<body id="appBody" class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0 overflow-x-hidden">

    <!-- ==========================================================
         OVERLAYS & NOTIFICATIONS (MODALS, TOAST, DLL)
         ========================================================== -->
    <!-- PUSH NOTIFIKASI POPUP (URGENT/WARNING) -->
    <div id="pushNotifOverlay" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-slate-900 border-2 border-amber-500 rounded-2xl shadow-[0_0_30px_rgba(245,158,11,0.3)] p-6 max-w-xs w-full animate-slide-in relative">
            <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-amber-500 text-slate-900 text-3xl rounded-full w-12 h-12 flex items-center justify-center shadow-lg border-4 border-slate-900">
                ⚠️
            </div>
            <h3 class="font-bold text-amber-400 text-center mt-5 mb-3 uppercase tracking-wider text-sm">Syalom</h3>
            <div id="pushNotifMessage" class="text-xs text-slate-200 text-center mb-6 leading-relaxed whitespace-pre-line"></div>
            <button onclick="closePushNotif()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl text-sm transition shadow-md cursor-pointer">
                Mengerti & Tutup
            </button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION DI TENGAH LAYAR -->
    <div id="toastContainer" class="fixed inset-0 z-50 flex items-center justify-center px-4 pointer-events-none"></div>

    <!-- SIDEBAR NAVIGASI SAMPING (MENU ☰) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm transition-opacity" onclick="toggleSidebar(false)"></div>
    <div id="sidebarMenu" class="fixed top-0 left-0 bottom-0 w-72 bg-slate-950 border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col p-5 shadow-2xl">
        <div class="flex justify-between items-center pb-4 border-b border-slate-800">
            <h3 class="font-bold text-sm text-purple-400">Pengaturan & Tema</h3>
            <button onclick="toggleSidebar(false)" class="text-slate-400 hover:text-white text-lg">✕</button>
        </div>
        
        <div class="py-4 space-y-4 flex-1 overflow-y-auto">
            <div>
                <p class="text-xs font-semibold text-slate-400 mb-2">Pilih Tema Aplikasi:</p>
                <div class="grid grid-cols-1 gap-2">
                    <button onclick="setTheme('slate')" class="text-left px-3 py-2 rounded-xl text-xs bg-slate-900 border border-slate-800 hover:border-purple-500 transition">🌙 Slate Dark (Default)</button>
                    <button onclick="setTheme('emerald')" class="text-left px-3 py-2 rounded-xl text-xs bg-emerald-950/40 border border-emerald-900/50 hover:border-emerald-500 transition">🌿 Emerald Nature</button>
                    <button onclick="setTheme('purple')" class="text-left px-3 py-2 rounded-xl text-xs bg-purple-950/40 border border-purple-900/50 hover:border-purple-500 transition">🍇 Royal Purple</button>
                    <button onclick="setTheme('sunset')" class="text-left px-3 py-2 rounded-xl text-xs bg-orange-950/40 border border-orange-900/50 hover:border-orange-500 transition">🌅 Warm Sunset</button>
                    <button onclick="setTheme('light')" class="text-left px-3 py-2 rounded-xl text-xs bg-slate-100 text-slate-900 border border-slate-300 hover:border-slate-500 transition">☀️ Light Clean</button>
                    
                    <!-- TOMBOL MODE LANSIA -->
                    <button onclick="toggleSeniorMode()" id="seniorModeBtn" class="text-left px-3 py-2 rounded-xl text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:border-amber-400 transition flex items-center justify-between">
                        <span>👓 Mode Lansia / Senior</span>
                        <span>Aktifkan</span>
                    </button>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <p class="text-xs font-semibold text-slate-400 mb-2">Akses Cepat:</p>
                <button onclick="installPWA()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 px-3 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 shadow-md">
                    📲 Tambahkan ke Beranda
                </button>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-800 text-[10px] text-slate-500 text-center">
            GMIT JPO Digital v2.5 &bull; Pniel Oebobo
        </div>
    </div>

    <!-- ==========================================================
         LAYOUT UTAMA (HEADER, MAIN, FOOTER)
         Dilengkapi class 'landscape:max-w-3xl' untuk dukungan rotasi layar
         ========================================================== -->
    <div id="app" class="w-full max-w-md landscape:max-w-3xl md:max-w-md mx-auto bg-slate-950 min-h-screen flex flex-col shadow-2xl relative transition-all duration-300">
        
        <!-- HEADER (FIXED) -->
        <header class="fixed top-0 left-1/2 transform -translate-x-1/2 w-full max-w-md landscape:max-w-3xl md:max-w-md z-40 bg-slate-950/95 backdrop-blur-md text-white p-4 flex justify-between items-center border-b border-purple-900/30 shadow-md transition-all duration-300">
            <button onclick="toggleSidebar(true)" class="text-xl p-1 hover:bg-slate-900 rounded-lg transition">☰</button>
            <h1 id="headerTitle" class="font-bold text-sm tracking-wide truncate px-2 text-center">GMIT Jemaat PNIEL Oebobo ⛪</h1>
            <div id="syncIndicator" class="flex items-center gap-1 text-xs" title="Status Sinkronisasi Online">
                <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[10px] text-slate-400 hidden sm:inline" id="syncText">Online</span>
            </div>
        </header>

        <!-- KONTEN UTAMA (SCROLLABLE ANTARA HEADER & FOOTER) -->
        <!-- animate-fade-in akan di-trigger ulang via JavaScript saat pindah menu -->
        <main class="flex-1 p-4 pt-20 pb-20 overflow-y-auto animate-fade-in w-full">
            <!-- Konten dimuat dinamis di sini -->
        </main>

        <!-- NAVIGATION BAR BAWAH (FIXED) -->
        <nav id="bottomNav" class="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md landscape:max-w-3xl md:max-w-md z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 flex justify-around p-3 text-xs font-medium text-slate-400 shadow-lg transition-all duration-300">
            <button onclick="switchTab('home')" class="hover:text-purple-400 focus:text-purple-400 flex flex-col items-center gap-1 transition">🏠 Beranda</button>
            <button onclick="switchTab('doa')" class="hover:text-purple-400 focus:text-purple-400 flex flex-col items-center gap-1 transition">🙏 Kotak Doa</button>
            <button onclick="switchTab('profil')" class="hover:text-purple-400 focus:text-purple-400 inline-flex items-center gap-1 transition">
                <span>👤</span> <span id="accountNavText">Akun</span>
            </button>
        </nav>
    </div>

    <!-- MODAL FULLSCREEN UNTUK LIRIK KIDUNG JEMAAT -->
    <div id="hymnModal" class="fixed inset-0 bg-black/95 z-[99999] hidden flex flex-col p-4 animate-fade-in">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800 pt-2">
            <div>
                <span id="modalHymnNo" class="text-xs font-bold text-purple-400"></span>
                <h3 id="modalHymnTitle" class="text-sm font-bold text-white truncate max-w-[280px]"></h3>
            </div>
            <button onclick="closeHymnModal()" class="bg-rose-600 hover:bg-rose-700 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shadow-md transition">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto py-4">
            <p id="modalHymnContent" class="text-[13px] sm:text-sm text-slate-200 whitespace-pre-line leading-relaxed font-sans px-1 pb-10"></p>
        </div>
        <div class="pt-3 border-t border-slate-800 text-center pb-2">
            <button onclick="closeHymnModal()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-semibold text-xs shadow-md">Tutup Lirik</button>
        </div>
    </div>

    <!-- ==========================================================
         SCRIPT & LOGIKA APLIKASI
         ========================================================== -->
    <script>
        // URL Backend Web App Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLTEI5pSm4gjnBQHcqCwFMS7vcIzpWt6sfXtdjpEk1QlnndTlSA6nZYlQwfWFY_oLHzA/exec";

        // --- SISTEM PEMICU ANIMASI TRANSISI HALAMAN ---
        function triggerPageTransition() {
            const main = document.querySelector("main");
            if (!main) return;
            // Hapus kelas, paksa reflow browser, lalu tambahkan ulang untuk memicu animasi
            main.classList.remove("animate-fade-in");
            void main.offsetWidth; 
            main.classList.add("animate-fade-in");
        }

        // --- HELPERS UNTUK HISTORI NAVIGASI (TOMBOL BACK HP) ---
        function pushNavState(funcName, args = []) {
            history.pushState({ func: funcName, args: args }, "", "");
        }
        function replaceNavState(funcName, args = []) {
            history.replaceState({ func: funcName, args: args }, "", "");
        }

        window.addEventListener('popstate', function (event) {
            // 1. Cek apakah ada Modal yang sedang terbuka (misal lirik KJ, galeri)
            const hymnModal = document.getElementById("hymnModal");
            if (hymnModal && !hymnModal.classList.contains("hidden")) {
                closeHymnModal(true); return;
            }

            const lightboxModal = document.getElementById("lightboxModal");
            if (lightboxModal && !lightboxModal.classList.contains("hidden")) {
                closeLightbox(null, true); return;
            }

            const pushNotifOverlay = document.getElementById("pushNotifOverlay");
            if (pushNotifOverlay && !pushNotifOverlay.classList.contains("hidden")) {
                closePushNotif(); return;
            }

            // 2. Tangani mundur antar halaman (routing)
            if (event.state && event.state.func) {
                const funcName = event.state.func;
                const args = event.state.args || [];
                if (typeof window[funcName] === 'function') {
                    if (['switchTab', 'openExtendedProfileForm', 'openHymnModal', 'openLightbox'].includes(funcName)) {
                        window[funcName](args[0], true);
                    } else {
                        window[funcName](true);
                    }
                }
            } else {
                switchTab('home', true);
            }
        });

        // --- PENDAFTARAN SERVICE WORKER (WAJIB UNTUK PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((registration) => { console.log('SW terdaftar:', registration.scope); })
                    .catch((error) => { console.log('SW error:', error); });
            });
        }
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // --- TOAST ALERTS ---
        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            container.innerHTML = ""; 
            
            const toast = document.createElement("div");
            const bgColor = type === "success" ? "bg-emerald-600 shadow-emerald-900/50" : "bg-rose-600 shadow-rose-900/50";
            
            toast.className = `${bgColor} text-white px-5 py-3.5 rounded-2xl shadow-2xl text-xs font-semibold pointer-events-auto animate-slide-in flex items-center gap-2 max-w-xs w-full text-center border border-white/10`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span class="flex-1">${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "scale(0.9)";
                toast.style.transition = "all 0.3s ease";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- FITUR PUSH NOTIFIKASI ---
        async function checkPushNotification() {
            if (sessionStorage.getItem('notif_seen') === 'true') return;

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getNotification`);
                const result = await response.json();
                
                if (result.status === 'success' && result.data.is_active) {
                    const msg = result.data.message;
                    const msgContainer = document.getElementById('pushNotifMessage');
                    
                    if (msg.startsWith('http://') || msg.startsWith('https://') || msg.match(/\.(jpeg|jpg|png|webp)$/i)) {
                        msgContainer.innerHTML = `<img src="${msg}" class="w-full h-auto rounded-xl shadow-md border border-slate-700 mx-auto" style="max-height: 350px; object-fit: contain;">`;
                    } else {
                        msgContainer.innerText = msg;
                    }

                    document.getElementById('pushNotifOverlay').classList.remove('hidden');
                    sessionStorage.setItem('notif_seen', 'true');
                }
            } catch (err) {
                console.log("Gagal memuat notifikasi", err);
            }
        }
        function closePushNotif() {
            const overlay = document.getElementById('pushNotifOverlay');
            if (overlay) overlay.classList.add('hidden');
        }

        // --- CEK NOTIFIKASI PERSONAL JEMAAT ---
        async function checkUserPersonalNotifications() {
            const savedUser = localStorage.getItem("user_gereja");
            if (!savedUser) return;
            const user = JSON.parse(savedUser);
            if (sessionStorage.getItem('personal_notif_checked') === 'true') return;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getUserNotifications", user_id: user.id })
                });
                const result = await response.json();

                if (result.status === "success" && result.notifications && result.notifications.length > 0) {
                    result.notifications.forEach((notif, index) => {
                        setTimeout(() => { showToast(`🔔 ${notif.text}`, "success"); }, index * 1500);
                    });
                    sessionStorage.setItem('personal_notif_checked', 'true');
                }
            } catch (err) { console.log("Gagal memuat notifikasi personal", err); }
        }

        // --- MONITORING STATUS ONLINE/OFFLINE ---
        function updateNetworkStatus() {
            const dot = document.getElementById("syncDot");
            const text = document.getElementById("syncText");
            if (navigator.onLine) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                if(text) { text.innerText = "Online"; text.className = "text-[10px] text-emerald-400 hidden sm:inline"; }
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                if(text) { text.innerText = "Offline"; text.className = "text-[10px] text-rose-400 hidden sm:inline"; }
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // --- SIDEBAR & TEMA ---
        function toggleSidebar(show) {
            const sidebar = document.getElementById("sidebarMenu");
            const overlay = document.getElementById("sidebarOverlay");
            if (show) {
                sidebar.classList.remove("-translate-x-full");
                overlay.classList.remove("hidden");
            } else {
                sidebar.classList.add("-translate-x-full");
                overlay.classList.add("hidden");
            }
        }

        function setTheme(theme) {
            const app = document.getElementById("app");
            const body = document.getElementById("appBody");
            
            // Simpan kelas responsif landscape agar tidak terhapus saat ganti tema
            const baseAppClass = "w-full max-w-md landscape:max-w-3xl md:max-w-md mx-auto min-h-screen flex flex-col shadow-2xl relative transition-all duration-300";
            
            if (theme === 'emerald') {
                app.className = `${baseAppClass} bg-emerald-950 text-slate-100`;
                body.className = "bg-emerald-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0 overflow-x-hidden";
            } else if (theme === 'purple') {
                app.className = `${baseAppClass} bg-purple-950 text-slate-100`;
                body.className = "bg-purple-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0 overflow-x-hidden";
            } else if (theme === 'sunset') {
                app.className = `${baseAppClass} bg-stone-950 text-amber-50`;
                body.className = "bg-stone-950 text-amber-50 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0 overflow-x-hidden";
            } else if (theme === 'light') {
                app.className = `${baseAppClass} bg-slate-50 text-slate-900`;
                body.className = "bg-slate-200 text-slate-900 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0 overflow-x-hidden";
            } else {
                app.className = `${baseAppClass} bg-slate-950 text-slate-100`;
                body.className = "bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0 overflow-x-hidden";
            }
            toggleSidebar(false);
            showToast("Tema berhasil diterapkan!");
        }

        async function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                toggleSidebar(false);
            } else {
                showToast("Gunakan menu 'Tambahkan ke Beranda' / 'Add to Home Screen' di pengaturan browser Anda.");
                toggleSidebar(false);
            }
        }

        // --- SISTEM AUTENTIKASI (LOGIN/REGISTER) ---
        function checkAuthBeforeAction(actionCallback) {
            const savedUser = localStorage.getItem("user_gereja");
            if (savedUser) {
                window.currentUser = JSON.parse(savedUser);
                actionCallback();
            } else {
                showToast("Silakan login atau daftar terlebih dahulu.", "error");
                renderAuthPageForAction(actionCallback);
            }
        }

        function renderAuthPageForAction(callbackOnSuccess, isBack = false) {
            window.pendingAuthAction = callbackOnSuccess;
            const main = document.querySelector("main");
            document.getElementById("headerTitle").innerText = "Autentikasi Jemaat 🔐";
            triggerPageTransition();
            
            main.innerHTML = `
                <div class="space-y-6 pt-2">
                    <button onclick="switchTab('home')" class="text-xs text-purple-400 font-semibold mb-2">← Kembali ke Beranda</button>
                    <div class="text-center">
                        <h2 class="text-lg font-bold text-purple-400">Verifikasi Akun Diperlukan</h2>
                        <p class="text-xs text-slate-400 mt-1">Masuk atau daftar untuk terhubung ke sistem jemaat.</p>
                    </div>

                    <div class="flex border-b border-slate-800">
                        <button id="tabLoginBtn" onclick="toggleAuthTab('login')" class="flex-1 pb-2 font-semibold text-purple-400 border-b-2 border-purple-400 text-xs">Masuk</button>
                        <button id="tabRegBtn" onclick="toggleAuthTab('register')" class="flex-1 pb-2 text-slate-500 text-xs">Daftar Baru</button>
                    </div>

                    <!-- FORM LOGIN -->
                    <form id="formLogin" onsubmit="handleLoginForAction(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Username Unik atau Nama Lengkap</label>
                            <input type="text" id="loginNama" required placeholder="Cth: budi.wa899 atau Budi Santoso" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Password / 4 Digit No. WhatsApp</label>
                            <input type="password" maxlength="4" id="loginPin" required placeholder="Cth: 7899" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none focus:border-purple-500">
                        </div>
                        <button type="submit" id="btnLoginSubmit" class="w-full bg-purple-600 text-white py-3 rounded-xl font-semibold text-sm shadow-md hover:bg-purple-700 transition">Masuk</button>
                    </form>

                    <!-- FORM REGISTRASI -->
                    <form id="formRegister" onsubmit="handleRegisterForAction(event)" class="space-y-4 hidden">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap</label>
                            <input type="text" id="regNama" required placeholder="Contoh: Budi Santoso" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nomor WhatsApp</label>
                            <input type="tel" id="regWa" required placeholder="Contoh: 081234567899" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">

                btn.innerHTML = "Masuk & Lanjutkan";

        async function fetchBibleVerse() {

            const bookObj = BIBLE_BOOKS.find(b => b.code === bookCode);
            const resultArea = document.getElementById("bibleResult");
            
            resultArea.innerHTML = `<p class="text-center text-purple-400 py-10 animate-pulse">Memuat ${bookObj.name} Pasal ${chapter}...</p>`;
            
            try {
                const response = await fetch(`https://api-alkitab.herokuapp.com/v2/passage/${bookCode}/${chapter}?ver=tb`);
                if (!response.ok) throw new Error("Gagal mengambil data dari server");
                const result = await response.json();
                
                if (result && result.data && result.data.verses && result.data.verses.length > 0) {
                    let htmlContent = `<h5 class="font-bold text-purple-400 mb-3 text-sm border-b border-slate-800 pb-1">${bookObj.name} Pasal ${chapter}</h5>`;
                    result.data.verses.forEach(v => {
                        htmlContent += `<p class="text-[11px] leading-relaxed mb-1.5"><strong class="text-purple-300">${v.verse}.</strong> ${v.text}</p>`;

                let rawData = result.users || result.data || [];
                
                if (rawData.length === 0) {
                    container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-slate-200 text-center text-xs text-slate-500">Belum ada data jemaat.</div>`;
                    return;
                }

                let dataList = [];
                
                // Cek apakah data berupa array of arrays (baris spreadsheet) atau array of objects
                if (Array.isArray(rawData[0])) {
                    // Jika berupa baris spreadsheet, baris pertama biasanya Header
                    let headers = rawData[0].map(h => String(h).trim().toLowerCase());
                    
                    // Cari indeks kolom secara otomatis berdasarkan nama header-nya
                    let idxVerified = headers.findIndex(h => h.includes('verif') || h.includes('status'));
                    let idxGender = headers.findIndex(h => h.includes('gender') || h.includes('kelamin'));
                    let idxLing = headers.findIndex(h => h.includes('lingkungan') || h.includes('ling'));
                    let idxRayon = headers.findIndex(h => h.includes('rayon'));
                    let idxMinat = headers.findIndex(h => h.includes('minat') || h.includes('komisi') || h.includes('pelayanan'));

                    for (let i = 1; i < rawData.length; i++) {
                        let row = rawData[i];
                        dataList.push({
                            is_verified: idxVerified !== -1 ? String(row[idxVerified]) : "",
                            jenis_kelamin: idxGender !== -1 ? String(row[idxGender]) : "",
                            lingkungan: idxLing !== -1 ? String(row[idxLing]) : "",
                            rayon: idxRayon !== -1 ? String(row[idxRayon]) : "",
                            minat_pelayanan: idxMinat !== -1 ? String(row[idxMinat]) : ""
                        });
                    }
                } else {
                    // Jika sudah berupa array of objects
                    dataList = rawData.map(item => ({
                        is_verified: item.is_verified || item[13] || "",
                        jenis_kelamin: item.jenis_kelamin || item[16] || "",
                        lingkungan: item.lingkungan || item[5] || "",
                        rayon: item.rayon || item[6] || "",
                        minat_pelayanan: item.minat_pelayanan || item[12] || ""
                    }));
                }

                const totalJemaat = dataList.length;
                
                // 1. Hitung Verifikasi
                let verifiedCount = dataList.filter(item => {
                    let v = String(item.is_verified || "").trim().toLowerCase();
                    return v === "verified" || v === "true" || v === "terverifikasi";
                }).length;
                
                let pendingCount = totalJemaat - verifiedCount;
                let verifiedPercent = totalJemaat > 0 ? Math.round((verifiedCount / totalJemaat) * 100) : 0;

                // 2. Hitung Demografi Jenis Kelamin
                let genderMap = { "Laki-laki": 0, "Perempuan": 0, "Belum Diisi": 0 };
                dataList.forEach(item => {
                    let g = String(item.jenis_kelamin || "").trim().toLowerCase();
                    if (g.startsWith("l") || g.includes("pria") || g.includes("laki")) {
                        genderMap["Laki-laki"]++;
                    } else if (g.startsWith("p") || g.includes("wanita") || g.includes("perempuan")) {
                        genderMap["Perempuan"]++;
                    } else {
                        genderMap["Belum Diisi"]++;
                    }
                });

                // 3. Hitung Sebaran Lingkungan (1 sampai 16 + Belum Ditentukan)
                let lingkunganMap = {};
                for (let i = 1; i <= 16; i++) {
                    lingkunganMap["Lingkungan " + i] = 0;
                }
                lingkunganMap["Belum Ditentukan"] = 0;

                dataList.forEach(item => {
                    let lingStr = String(item.lingkungan || "").trim();
                    if (/^\d+$/.test(lingStr)) {
                        lingStr = "Lingkungan " + lingStr;
                    }
                    
                    let lingKey = "Belum Ditentukan";
                    if (lingStr && lingStr !== "-") {
                        let match = lingStr.match(/(?:lingkungan\s*)?(\d+)/i);
                        if (match && parseInt(match[1]) >= 1 && parseInt(match[1]) <= 16) {
                            lingKey = "Lingkungan " + parseInt(match[1]);
                        } else {
                            lingKey = lingStr;
                        }
                    }
                    
                    if (lingkunganMap[lingKey] !== undefined) {
                        lingkunganMap[lingKey]++;
                    } else {
                        lingkunganMap[lingKey] = 1;
                    }
                });

                // 4. Hitung Minat Pelayanan
                let minatMap = {};
                dataList.forEach(item => {
                    let minatRaw = String(item.minat_pelayanan || "").trim();
                    if (!minatRaw || minatRaw === "-") {
                        minatMap["Belum Memilih"] = (minatMap["Belum Memilih"] || 0) + 1;
                    } else {
                        minatRaw.split(",").forEach(m => {
                            let cleanM = m.trim();
                            if (cleanM) {
                                minatMap[cleanM] = (minatMap[cleanM] || 0) + 1;
                            }
                        });
                    }
                });

                // Helper untuk membuat bar grafik visual HTML standar
                function renderBar(label, count, total, colorClass = "bg-purple-600") {
                    let percent = total > 0 ? Math.round((count / total) * 100) : 0;
                    return `
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs">
                                <span class="font-medium text-slate-700">${label}</span>
                                <span class="font-bold text-slate-900">${count} <span class="text-[10px] text-slate-400 font-normal">(${percent}%)</span></span>
                            </div>
                            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                <div class="${colorClass} h-2.5 rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                            </div>
                        </div>
                    `;
                }

                // Palet Warna untuk Sebaran Lingkungan
                const warnaLingkungan = [
                    "bg-red-500", "bg-orange-500", "bg-amber-500", "bg-yellow-500",
                    "bg-lime-500", "bg-green-500", "bg-emerald-500", "bg-teal-500",
                    "bg-cyan-500", "bg-sky-500", "bg-blue-500", "bg-indigo-500",
                    "bg-violet-500", "bg-purple-500", "bg-fuchsia-500", "bg-pink-500",
                    "bg-slate-400"
                ];

                let entriesLingkungan = Object.entries(lingkunganMap);
                let multiBarHtml = `
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-semibold text-slate-700">
                            <span>Distribusi XVI Lingkungan</span>
                            <span>Total: ${totalJemaat} Jiwa</span>
                        </div>
                        <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden flex shadow-inner">
                `;

                entriesLingkungan.forEach(([ling, count], index) => {
                    let percent = totalJemaat > 0 ? (count / totalJemaat) * 100 : 0;
                    if (percent > 0) {
                        let colorClass = warnaLingkungan[index % warnaLingkungan.length];
                        multiBarHtml += `<div class="${colorClass} h-full transition-all duration-500" style="width: ${percent}%" title="${ling}: ${count} (${Math.round(percent)}%)"></div>`;
                    }
                });

                multiBarHtml += `</div>`;
                multiBarHtml += `<div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 pt-2 text-[10px]">`;
                entriesLingkungan.forEach(([ling, count], index) => {
                    let percent = totalJemaat > 0 ? Math.round((count / totalJemaat) * 100) : 0;
                    let colorClass = warnaLingkungan[index % warnaLingkungan.length];
                    multiBarHtml += `
                        <div class="flex items-center gap-1.5 bg-slate-50 p-1 rounded border border-slate-100">
                            <span class="w-2.5 h-2.5 rounded-full ${colorClass} shrink-0"></span>
                            <span class="truncate text-slate-600 font-medium">${ling}: <b class="text-slate-900">${count}</b> (${percent}%)</span>
                        </div>
                    `;
                });
                multiBarHtml += `</div></div>`;

                // Render UI Utama ke dalam container
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm animate-card-hover">
                            <p class="text-[11px] text-slate-500 font-medium">Total Jemaat</p>
                            <h3 class="text-2xl font-black text-slate-900 mt-1">${totalJemaat}</h3>
                            <p class="text-[10px] text-purple-600 mt-1 font-semibold">Terdaftar di Database</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm animate-card-hover">
                            <p class="text-[11px] text-slate-500 font-medium">Status Verifikasi</p>
                            <h3 class="text-2xl font-black text-emerald-600 mt-1">${verifiedPercent}%</h3>
                            <p class="text-[10px] text-slate-400 mt-1">${verifiedCount} Terverifikasi, ${pendingCount} Pending</p>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h3 class="font-bold text-xs text-slate-900 border-b pb-2">👥 Demografi Jenis Kelamin</h3>
                        <div class="space-y-3">
                            ${renderBar("Laki-laki", genderMap["Laki-laki"], totalJemaat, "bg-blue-500")}
                            ${renderBar("Perempuan", genderMap["Perempuan"], totalJemaat, "bg-pink-500")}
                            ${genderMap["Belum Diisi"] > 0 ? renderBar("Belum Diisi", genderMap["Belum Diisi"], totalJemaat, "bg-slate-400") : ''}
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h3 class="font-bold text-xs text-slate-900 border-b pb-2">📍 Sebaran Per Lingkungan (XVI Lingkungan)</h3>
                        ${multiBarHtml}
                    </div>

                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h3 class="font-bold text-xs text-slate-900 border-b pb-2">✨ Minat Pelayanan Jemaat</h3>
                        <div class="space-y-3">
                            ${Object.entries(minatMap).map(([minat, count]) => renderBar(minat, count, totalJemaat, "bg-amber-500")).join('')}
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-slate-200 text-center text-xs text-rose-500">Terjadi kesalahan koneksi server: ${err.message}</div>`;
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;

                img.onload = function() {
                    const MAX_WIDTH = 200;
                    const MAX_HEIGHT = 200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    const imgPreview = document.getElementById('previewFoto');
                    imgPreview.src = compressedBase64;
                    imgPreview.classList.remove('hidden');
                    imgPreview.nextElementSibling.classList.add('hidden');

                    document.getElementById('fotoBase64').value = compressedBase64;
                };
            };
            reader.readAsDataURL(file);
        }

        async function handleSaveExtendedProfile(e) {
            e.preventDefault();
            const btn = e.target.querySelector("button[type='submit']");
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "Menyimpan Data...";

            const updatedData = {
                action: "updateExtendedProfile",
                user_id: window.currentUser.id,
                jenis_kelamin: document.getElementById("extGender").value,
                alamat: document.getElementById("extAlamat").value,
                pekerjaan: document.getElementById("extPekerjaan").value,
                golongan_darah: document.getElementById("extGoldar").value,
                minat_pelayanan: document.getElementById("extKomisi").value,
                foto_profil: document.getElementById("fotoBase64").value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(updatedData)
                });
                const result = await response.json();

                if (result.status === "success") {
                    window.currentUser.jenis_kelamin = updatedData.jenis_kelamin;
                    window.currentUser.alamat = updatedData.alamat;
                    window.currentUser.pekerjaan = updatedData.pekerjaan;
                    window.currentUser.golongan_darah = updatedData.golongan_darah;
                    window.currentUser.minat_pelayanan = updatedData.minat_pelayanan;
                    window.currentUser.foto_profil = updatedData.foto_profil;
                    
                    localStorage.setItem("user_gereja", JSON.stringify(window.currentUser));

                    showToast("Data diri berhasil disimpan!");
                    setTimeout(() => switchTab('profil'), 800);
                } else {
                    showToast(result.message, "error");
                    btn.disabled = false;
                    btn.innerText = originalText;
                }
            } catch (err) {
                showToast("Kesalahan koneksi.", "error");
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        async function handleSendPrayer(e) {
            e.preventDefault();
            const btn = document.getElementById("btnPrayerSubmit");
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const data = {
                action: "addPrayer",
                user_id: window.currentUser.id,
                nama_pengirim: document.getElementById("prayerSenderOption").value === 'name' ? window.currentUser.nama_lengkap : "Hamba Tuhan / Anonim",
                kategori_doa: document.getElementById("prayerCategory").value,

                status_privasi: document.getElementById("prayerPrivacy").value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                showToast(result.message);
                if (result.status === "success") switchTab('home');
            } catch (err) {
                showToast("Gagal mengirim doa.", "error");
                btn.disabled = false;
                btn.innerText = "Kirim Doa";
            }
        }

            document.getElementById("headerTitle").innerText = "Persembahan / Donasi";
            triggerPageTransition();
            main.innerHTML = `
                <div class="space-y-4">
                    <button onclick="switchTab('home')" class="text-xs text-purple-400 font-semibold mb-2">← Kembali ke Beranda</button>
                    <button onclick="openFormDonation()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-semibold shadow-md transition">➕ Konfirmasi / Catat Donasi Baru</button>
                    <div id="donationContainer" class="space-y-3"><p class="text-xs text-slate-400 text-center py-6 animate-pulse">Memuat data donasi...</p></div>
                </div>
            `;
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getDonations`);
                const result = await response.json();
                const container = document.getElementById("donationContainer");
                const list = result.donations || [];
                
                if (list.length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Belum ada riwayat donasi.</p>`;
                    return;
                }
                
                container.innerHTML = list.map(d => {
                    const r = d.reactions || {};
                    return `
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col justify-between shadow-sm animate-card-hover">
                            <div class="flex items-center justify-between mb-2">
                                <div>
                                    <h4 class="text-xs font-bold text-white">${d.nama_donatur}</h4>
                                    <p class="text-[11px] text-slate-400">${d.keterangan}</p>
                                </div>
                                <span class="text-xs font-bold text-emerald-400">Rp ${Number(d.nominal).toLocaleString('id-ID')}</span>
                            </div>
                            <div class="flex gap-1.5 border-t border-slate-800/60 pt-2 mt-1">
                                <button onclick="handleReactionAndRefresh('donasi', '${d.id}', '👍')" class="text-[11px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg transition flex items-center">👍 ${r["👍"] ? `<span class="text-[9px] text-amber-400 ml-1 font-bold">${r["👍"]}</span>` : ''}</button>
                                <button onclick="handleReactionAndRefresh('donasi', '${d.id}', '🙏🏻')" class="text-[11px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg transition flex items-center">🙏🏻 ${r["🙏🏻"] ? `<span class="text-[9px] text-amber-400 ml-1 font-bold">${r["🙏🏻"]}</span>` : ''}</button>
                                <button onclick="handleReactionAndRefresh('donasi', '${d.id}', '❤️')" class="text-[11px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg transition flex items-center">❤️ ${r["❤️"] ? `<span class="text-[9px] text-amber-400 ml-1 font-bold">${r["❤️"]}</span>` : ''}</button>
                                <button onclick="handleReactionAndRefresh('donasi', '${d.id}', '🤞')" class="text-[11px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg transition flex items-center">🤞 ${r["🤞"] ? `<span class="text-[9px] text-amber-400 ml-1 font-bold">${r["🤞"]}</span>` : ''}</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById("donationContainer").innerHTML = `<p class="text-xs text-rose-400 text-center">Gagal memuat donasi.</p>`;
            }
        }

        function openFormDonation(isBack = false) {
            if (!isBack) pushNavState('openFormDonation');
            const main = document.querySelector("main");
            const user = window.currentUser || {};
            document.getElementById("headerTitle").innerText = "Form Kirim Donasi";
            triggerPageTransition();
            main.innerHTML = `
                <div class="space-y-4">
                    <button onclick="openDonationList()" class="text-xs text-purple-400 font-semibold mb-2">← Kembali ke Daftar Donasi</button>
                    <form onsubmit="handleSendDonation(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Opsi Tampilkan Nama</label>
                            <select id="donNameOption" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                                <option value="full">Tampilkan Nama Lengkap (${user.nama_lengkap})</option>
                                <option value="initial">Inisial Saja (Cth: B***)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Peruntukan</label>
                            <input type="text" id="donKet" required placeholder="Cth: Pembangunan Gedung" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nominal (Rp)</label>
                            <input type="number" id="donNominal" required placeholder="Cth: 100000" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                        </div>
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-semibold text-sm shadow-md transition">Kirim Konfirmasi</button>
                    </form>
                </div>
            `;
        }

        async function handleSendDonation(e) {
            e.preventDefault();
            const btn = e.target.querySelector("button[type='submit']");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const user = window.currentUser;
            const nameOption = document.getElementById("donNameOption").value;
            let finalName = nameOption === 'initial' ? user.nama_lengkap.charAt(0) + '***' : user.nama_lengkap;

            const data = {
                action: "addDonation",
                user_id: user.id,
                nama_donatur: finalName,
                jenis_donasi: "Transfer",
                keterangan: document.getElementById("donKet").value,
                nominal: document.getElementById("donNominal").value,
                tanggal: new Date()
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                showToast(result.message);
                if (result.status === "success") {
                    openDonationList();
                } else {
                    btn.disabled = false;
                    btn.innerText = "Kirim Konfirmasi";
                }
            } catch (err) {
                showToast("Gagal mengirim donasi.", "error");
                btn.disabled = false;
                btn.innerText = "Kirim Konfirmasi";
            }
        }
        
        function toggleSeniorMode() {
            const body = document.body;
            const isSenior = body.classList.toggle('senior-mode');
            
            if (isSenior) {
                localStorage.setItem('gmit_senior_mode', 'true');
                showToast("Mode Lansia Diaktifkan (Huruf & Tampilan Diperbesar)");
                document.getElementById('seniorModeBtn').innerText = "🌙 Mode Normal";
                document.getElementById('seniorModeBtn').className = "text-xs bg-purple-600 text-white px-2.5 py-1.5 rounded-xl font-semibold flex items-center gap-1 transition shadow-md";
            } else {
                localStorage.setItem('gmit_senior_mode', 'false');
                showToast("Kembali ke Mode Normal");
                document.getElementById('seniorModeBtn').innerText = "👓 Mode Lansia";
                document.getElementById('seniorModeBtn').className = "text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-1.5 rounded-xl font-semibold flex items-center gap-1 transition";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedSeniorMode = localStorage.getItem('gmit_senior_mode');
            if (savedSeniorMode === 'true') {
                document.body.classList.add('senior-mode');
                const btn = document.getElementById('seniorModeBtn');
                if(btn) {
                    btn.innerText = "🌙 Mode Normal";
                    btn.className = "text-xs bg-purple-600 text-white px-2.5 py-1.5 rounded-xl font-semibold flex items-center gap-1 transition shadow-md";
                }
            }
        });
        
        async function handleReactionAndRefresh(tipe, idTarget, emoji) {
            const user = window.currentUser || { id: "Anonim" };
            
            // 1. Update UI Instan
            const eventBtn = event.currentTarget;
            if (eventBtn) {
                let badgeSpan = eventBtn.querySelector('span');
                if (badgeSpan) {
                    let currentVal = parseInt(badgeSpan.innerText) || 0;
                    if(isNaN(currentVal)) currentVal = 0; 
                    
                    if(tipe === 'galeri' && emoji === '❤️') {
                        badgeSpan.className = "text-[10px] font-bold text-rose-500 ml-1";
                    } else {
                        badgeSpan.className = "text-[9px] text-amber-400 ml-1 font-bold";
                    }
                    badgeSpan.innerText = currentVal + 1;
                }
            }

            // 2. Update lokal cache Galeri
            if (tipe === 'galeri' && window.allGalleryData) {
                const photo = window.allGalleryData.find(p => p.id == idTarget);
                if (photo) {
                    if (!photo.reactions) photo.reactions = {};
                    photo.reactions[emoji] = (photo.reactions[emoji] || 0) + 1;
                }
            }

            showToast(`Memberikan reaksi ${emoji}`);
            
            // 3. Kirim ke Server
            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "addReaction",
                        tipe: tipe,
                        target_id: idTarget,
                        user_id: user.id,
                        emoji: emoji
                    })
                });
            } catch (err) {
                console.log("Gagal mencatat reaksi", err);
                showToast("Gagal mencatat reaksi ke server", "error");
            }
        }

        async function handleReplyPrayer(prayerId) {
            const replyText = prompt("Masukkan balasan pastoral Anda untuk doa ini:");
            if (replyText && replyText.trim() !== "") {
                showToast("Balasan sedang diproses...", "success");
                
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "replyPrayer",
                            prayer_id: prayerId,
                            reply_text: replyText.trim()
                        })
                    });
                    const result = await response.json();
                    
                    showToast(result.message);
                    if (result.status === "success") {
                        openPublicPrayerWall();
                    }
                } catch (err) {
                    showToast("Gagal mengirim balasan.", "error");
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateNetworkStatus();
            // Saat aplikasi pertama kali dimuat, replace state awal
            switchTab('home', false, true); 
            checkPushNotification();
            updateAuthNavText();
        });

        function updateAuthNavText() {
            const navText = document.getElementById("accountNavText");
            if (!navText) return;
            
            const savedUser = localStorage.getItem("user_gereja");
            if (savedUser) {
                navText.innerText = "Akun";
            } else {
                navText.innerText = "Login";
            }
        }
        
        async function checkLiveStatusForMenu() {
            const channelId = "UCZ3-3qhAyR8mDb6VTeJOXtA";
            try {
                const rssUrl = `https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.youtube.com%2Ffeeds%2Fvideos.xml%3Fchannel_id%3D${channelId}`;
                const response = await fetch(rssUrl);
                const data = await response.json();
                
                if (data.status === 'ok' && data.items.length > 0) {
                    const latestVideo = data.items[0];
                    let videoId = "";
                    
                    if (latestVideo.link.includes('v=')) {
                        videoId = latestVideo.link.split('v=')[1].split('&')[0];
                    }
                    
                    if (videoId) {
                        let pubDate = new Date(latestVideo.pubDate);
                        let now = new Date();
                        let hoursDifference = (now - pubDate) / (1000 * 60 * 60);
                        
                        // Jika video diupload / disiarkan kurang dari 4 jam lalu
                        if (hoursDifference <= 4) {
                            const card = document.getElementById('livestream-card');
                            const badge = document.getElementById('livestream-badge');
                            
                            if (card && badge) {
                                card.classList.remove('border-orange-200/40', 'hover:border-orange-400');
                                card.classList.add('border-rose-600', 'shadow-lg', 'shadow-rose-600/30', 'hover:border-rose-500');
                                badge.classList.remove('hidden');
                            }
                        }
                    }
                }
            } catch (error) {
                console.log("Gagal mengecek status live YouTube:", error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            checkLiveStatusForMenu();
        });
function redirectToRolePanel() {
    // Ambil data sesi pengguna/admin yang sedang aktif
    const userSession = JSON.parse(sessionStorage.getItem("user_gereja") || sessionStorage.getItem("admin_gereja") || "{}");
    
    // Ambil nilai role (bisa dari adminRole atau role)
    const role = String(userSession.adminRole || userSession.role || "").trim();
    
    // Arahkan berdasarkan role masing-masing
    if (role === "Sekretariat") {
        window.location.href = "sekretariat.html";
    } else if (role === "Petugas Sensus") {
        window.location.href = "sensus.html";
    } else if (role === "Admin Operator" || role === "Super Admin" || role === "") {
        window.location.href = "admin.html";
    } else {
        // Fallback default jika role tidak dikenali
        window.location.href = "admin.html";
    }
}
    </script>
