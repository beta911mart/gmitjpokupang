<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gereja Digital App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center">

    <!-- TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed top-4 left-0 right-0 z-50 flex justify-center px-4 pointer-events-none"></div>

    <!-- Container Utama Mobile -->
    <div id="app" class="max-w-md w-full mx-auto bg-slate-950 min-h-screen flex flex-col shadow-2xl relative overflow-hidden">
        
        <!-- HEADER -->
        <header class="bg-gradient-to-b from-purple-950 to-slate-950 text-white p-4 pt-6 flex justify-between items-center border-b border-purple-900/40">
            <button onclick="showToast('Menu navigasi samping')" class="text-xl">☰</button>
            <h1 id="headerTitle" class="font-bold text-lg tracking-wide">MyChurch App</h1>
            <button onclick="showToast('Status sinkronisasi online')" class="text-xl">☁️</button>
        </header>

        <!-- KONTEN UTAMA -->
        <main class="flex-1 p-4 overflow-y-auto pb-24 animate-fade-in">
            <!-- Konten dimuat dinamis di sini -->
        </main>

        <!-- NAVIGATION BAR BAWAH -->
        <nav id="bottomNav" class="hidden absolute bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 flex justify-around p-3 text-xs font-medium text-slate-400 shadow-lg">
            <button onclick="switchTab('home')" class="hover:text-purple-400 focus:text-purple-400 flex flex-col items-center gap-1">🏠 Beranda</button>
            <button onclick="switchTab('doa')" class="hover:text-purple-400 focus:text-purple-400 flex flex-col items-center gap-1">🙏 Kotak Doa</button>
            <button onclick="switchTab('profil')" class="hover:text-purple-400 focus:text-purple-400 flex flex-col items-center gap-1">👤 Akun</button>
        </nav>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLTEI5pSm4gjnBQHcqCwFMS7vcIzpWt6sfXtdjpEk1QlnndTlSA6nZYlQwfWFY_oLHzA/exec";

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            const bgColor = type === "success" ? "bg-emerald-600" : "bg-rose-600";
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-medium pointer-events-auto animate-slide-in flex items-center gap-2 max-w-sm w-full`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span class="flex-1">${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateY(-20px)";
                toast.style.transition = "all 0.3s ease";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem("user_gereja");
            if (savedUser) {
                renderDashboard(JSON.parse(savedUser));
            } else {
                renderAuthPage();
            }
        });

        function renderAuthPage() {
            document.getElementById("bottomNav").classList.add("hidden");
            document.getElementById("headerTitle").innerText = "Masuk Sensus";
            const main = document.querySelector("main");
            
            main.innerHTML = `
                <div class="space-y-6 pt-6 animate-fade-in">
                    <div class="text-center">
                        <h2 class="text-xl font-bold text-purple-400">Selamat Datang</h2>
                        <p class="text-xs text-slate-400 mt-1">Silakan masuk menggunakan Nama & 4 digit akhir No. WA.</p>
                    </div>

                    <div class="flex border-b border-slate-800">
                        <button id="tabLoginBtn" onclick="toggleAuthTab('login')" class="flex-1 pb-2 font-semibold text-purple-400 border-b-2 border-purple-400">Masuk</button>
                        <button id="tabRegBtn" onclick="toggleAuthTab('register')" class="flex-1 pb-2 text-slate-500">Daftar Baru</button>
                    </div>

                    <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap</label>
                            <input type="text" id="loginNama" required placeholder="Contoh: Budi Santoso" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">4 Digit Terakhir No. WhatsApp</label>
                            <input type="password" maxlength="4" id="loginPin" required placeholder="Cth: 7899" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none focus:border-purple-500">
                        </div>
                        <button type="submit" id="btnLoginSubmit" class="w-full bg-purple-600 text-white py-3 rounded-xl font-semibold text-sm shadow-md hover:bg-purple-700 transition">Masuk Aplikasi</button>
                    </form>

                    <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-3 hidden">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap</label>
                            <input type="text" id="regNama" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                        </div>
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Tempat Lahir</label>
                                <input type="text" id="regTempatLahir" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Tanggal Lahir</label>
                                <input type="date" id="regTglLahir" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Status Pelayanan</label>
                            <select id="regStatus" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                                <option value="Jemaat">Jemaat</option>
                                <option value="Pendeta">Pendeta</option>
                                <option value="Majelis">Majelis</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Lingkungan</label>
                                <input type="text" id="regLingkungan" required placeholder="Cth: 1" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Rayon</label>
                                <input type="text" id="regRayon" required placeholder="Cth: 2" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nomor WhatsApp</label>
                            <input type="tel" id="regWa" required placeholder="081234567899" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                            <p class="text-[10px] text-slate-500 mt-1">*4 digit terakhir otomatis jadi PIN login.</p>
                        </div>
                        <button type="submit" id="btnRegSubmit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold text-sm shadow-md hover:bg-emerald-700 transition mt-2">Daftar Sensus</button>
                    </form>
                </div>
            `;
        }

        function toggleAuthTab(type) {
            const loginForm = document.getElementById("formLogin");
            const regForm = document.getElementById("formRegister");
            const loginBtn = document.getElementById("tabLoginBtn");
            const regBtn = document.getElementById("tabRegBtn");

            if (type === 'login') {
                loginForm.classList.remove("hidden");
                regForm.classList.add("hidden");
                loginBtn.className = "flex-1 pb-2 font-semibold text-purple-400 border-b-2 border-purple-400";
                regBtn.className = "flex-1 pb-2 text-slate-500";
            } else {
                loginForm.classList.add("hidden");
                regForm.classList.remove("hidden");
                regBtn.className = "flex-1 pb-2 font-semibold text-purple-400 border-b-2 border-purple-400";
                loginBtn.className = "flex-1 pb-2 text-slate-500";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("btnLoginSubmit");
            const nama = document.getElementById("loginNama").value;
            const pin = document.getElementById("loginPin").value;

            btn.disabled = true;
            btn.innerHTML = "Memproses...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", nama_lengkap: nama, pin_4_digit: pin })
                });
                const result = await response.json();

                if (result.status === "success") {
                    showToast("Login Berhasil!");
                    localStorage.setItem("user_gereja", JSON.stringify(result.user));
                    setTimeout(() => renderDashboard(result.user), 500);
                } else {
                    showToast(result.message, "error");
                    btn.disabled = false;
                    btn.innerHTML = "Masuk Aplikasi";
                }
            } catch (err) {
                showToast("Kesalahan koneksi.", "error");
                btn.disabled = false;
                btn.innerHTML = "Masuk Aplikasi";
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById("btnRegSubmit");
            const data = {
                action: "register",
                nama_lengkap: document.getElementById("regNama").value,
                tempat_lahir: document.getElementById("regTempatLahir").value,
                tanggal_lahir: document.getElementById("regTglLahir").value,
                status_pelayanan: document.getElementById("regStatus").value,
                lingkungan: document.getElementById("regLingkungan").value,
                rayon: document.getElementById("regRayon").value,
                no_whatsapp: document.getElementById("regWa").value
            };

            btn.disabled = true;
            btn.innerHTML = "Mendaftarkan...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.status === "success") {
                    showToast("Registrasi Berhasil!");
                    localStorage.setItem("user_gereja", JSON.stringify(result.user));
                    setTimeout(() => renderDashboard(result.user), 500);
                } else {
                    showToast(result.message, "error");
                    btn.disabled = false;
                    btn.innerHTML = "Daftar Sensus";
                }
            } catch (err) {
                showToast("Kesalahan koneksi.", "error");
                btn.disabled = false;
                btn.innerHTML = "Daftar Sensus";
            }
        }

        function renderDashboard(user) {
            document.getElementById("bottomNav").classList.remove("hidden");
            window.currentUser = user;
            switchTab('home');
        }

        function switchTab(tab) {
            const main = document.querySelector("main");
            const user = window.currentUser;
            document.getElementById("headerTitle").innerText = "MyChurch App";
            main.className = "flex-1 p-4 overflow-y-auto pb-24 animate-fade-in";

            if (tab === 'home') {
                main.innerHTML = `
                    <div class="space-y-6">
                        <!-- Search Bar -->
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">🔍</span>
                            <input type="text" placeholder="Cari warta, kegiatan, atau dokumen..." class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-800 rounded-full text-xs text-white placeholder-slate-500 outline-none focus:border-purple-500 shadow-inner">
                        </div>

                        <!-- Grid Ikon Bulat -->
                        <div class="grid grid-cols-4 gap-4 text-center">
                            <div onclick="openExtendedProfile()" class="cursor-pointer flex flex-col items-center">
                                <div class="w-14 h-14 bg-gradient-to-tr from-lime-500 to-green-400 rounded-full flex items-center justify-center text-xl shadow-lg mb-1">👤</div>
                                <span class="text-[11px] text-slate-300 font-medium">Profile</span>
                            </div>
                            <div onclick="openDownloadCenter()" class="cursor-pointer flex flex-col items-center">
                                <div class="w-14 h-14 bg-gradient-to-tr from-amber-500 to-orange-400 rounded-full flex items-center justify-center text-xl shadow-lg mb-1">📥</div>
                                <span class="text-[11px] text-slate-300 font-medium">Download</span>
                            </div>
                            <div onclick="openLibraryMenu()" class="cursor-pointer flex flex-col items-center">
                                <div class="w-14 h-14 bg-gradient-to-tr from-purple-500 to-fuchsia-500 rounded-full flex items-center justify-center text-xl shadow-lg mb-1">📖</div>
                                <span class="text-[11px] text-slate-300 font-medium">Alkitab & KJ</span>
                            </div>
<div onclick="openEventsList()" class="cursor-pointer flex flex-col items-center">
    <div class="w-14 h-14 bg-gradient-to-tr from-sky-500 to-blue-600 rounded-full flex items-center justify-center text-xl shadow-lg mb-1">📅</div>
    <span class="text-[11px] text-slate-300 font-medium">Kegiatan</span>
</div>
<div onclick="openChatRoom()" class="cursor-pointer flex flex-col items-center">
    <div class="w-14 h-14 bg-gradient-to-tr from-pink-500 to-rose-600 rounded-full flex items-center justify-center text-xl shadow-lg mb-1">💬</div>
    <span class="text-[11px] text-slate-300 font-medium">Komunitas</span>
</div>
                            <div onclick="showToast('Menu Devotionals')" class="cursor-pointer flex flex-col items-center">
                                <div class="w-14 h-14 bg-gradient-to-tr from-emerald-400 to-teal-600 rounded-full flex items-center justify-center text-xl shadow-lg mb-1">📑</div>
                                <span class="text-[11px] text-slate-300 font-medium">Devotionals</span>
                            </div>
                            <div onclick="showToast('Menu Notes')" class="cursor-pointer flex flex-col items-center">
                                <div class="w-14 h-14 bg-gradient-to-tr from-green-300 to-emerald-500 rounded-full flex items-center justify-center text-xl shadow-lg mb-1">📔</div>
                                <span class="text-[11px] text-slate-300 font-medium">Notes</span>
                            </div>
                            <div onclick="showToast('Menu Donate')" class="cursor-pointer flex flex-col items-center">
                                <div class="w-14 h-14 bg-gradient-to-tr from-blue-400 to-indigo-600 rounded-full flex items-center justify-center text-xl shadow-lg mb-1">💲</div>
                                <span class="text-[11px] text-slate-300 font-medium">Donate</span>
                            </div>
                        </div>

                        <!-- Grid Kartu Konten Media (3x2) -->
                        <div class="grid grid-cols-3 gap-3 pt-2">
                            <div onclick="showToast('Kategori')" class="bg-slate-900 border border-amber-200/40 rounded-xl p-2 text-center cursor-pointer hover:border-amber-400 transition">
                                <div class="h-20 bg-amber-500/10 rounded-lg flex items-center justify-center text-2xl mb-2">📂</div>
                                <span class="text-xs font-semibold text-slate-200">Categories</span>
                            </div>
                            <div onclick="showToast('Videos')" class="bg-slate-900 border border-sky-200/40 rounded-xl p-2 text-center cursor-pointer hover:border-sky-400 transition">
                                <div class="h-20 bg-sky-500/10 rounded-lg flex items-center justify-center text-2xl mb-2">▶️</div>
                                <span class="text-xs font-semibold text-slate-200">Videos</span>
                            </div>
                            <div onclick="showToast('Audios')" class="bg-slate-900 border border-yellow-200/40 rounded-xl p-2 text-center cursor-pointer hover:border-yellow-400 transition">
                                <div class="h-20 bg-yellow-500/10 rounded-lg flex items-center justify-center text-2xl mb-2">🎧</div>
                                <span class="text-[11px] font-semibold text-slate-200">Audios</span>
                            </div>
                            <div onclick="showToast('Bible')" class="bg-slate-900 border border-emerald-200/40 rounded-xl p-2 text-center cursor-pointer hover:border-emerald-400 transition">
                                <div class="h-20 bg-emerald-500/10 rounded-lg flex items-center justify-center text-2xl mb-2">✝️</div>
                                <span class="text-xs font-semibold text-slate-200">Bible</span>
                            </div>
                            <div onclick="showToast('Livestreams')" class="bg-slate-900 border border-orange-200/40 rounded-xl p-2 text-center cursor-pointer hover:border-orange-400 transition">
                                <div class="h-20 bg-orange-500/10 rounded-lg flex items-center justify-center text-2xl mb-2">📺</div>
                                <span class="text-[11px] font-semibold text-slate-200">Livestreams</span>
                            </div>
                            <div onclick="showToast('Radio')" class="bg-slate-900 border border-pink-200/40 rounded-xl p-2 text-center cursor-pointer hover:border-pink-400 transition">
                                <div class="h-20 bg-pink-500/10 rounded-lg flex items-center justify-center text-2xl mb-2">📻</div>
                                <span class="text-xs font-semibold text-slate-200">Radio</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tab === 'doa') {
                main.innerHTML = `
                    <div class="space-y-4">
                        <h3 class="font-bold text-base text-purple-400">Kirim Kotak Doa</h3>
                        <form onsubmit="handleSendPrayer(event)" class="space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Kategori Doa</label>
                                <select id="prayerCategory" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                                    <option value="Doa Syukur">Doa Syukur</option>
                                    <option value="Doa Pergumulan">Doa Pergumulan</option>
                                    <option value="Doa Khusus">Doa Khusus</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Pokok Doa</label>
                                <textarea id="prayerContent" rows="4" required placeholder="Tuliskan pokok doa..." class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Privasi Doa</label>
                                <select id="prayerPrivacy" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                                    <option value="Rahasia">Rahasia (Hanya Pendeta/Admin)</option>
                                    <option value="Publik">Publik (Untuk Pendoa Syafaat)</option>
                                </select>
                            </div>
                            <button type="submit" id="btnPrayerSubmit" class="w-full bg-purple-600 text-white py-3 rounded-xl font-semibold text-sm shadow-md hover:bg-purple-700 transition">Kirim Doa</button>
                        </form>
                    </div>
                `;
            } else if (tab === 'profil') {
                main.innerHTML = `
                    <div class="space-y-6 text-center pt-6">
                        <div class="w-20 h-20 bg-purple-900 text-purple-200 font-bold text-2xl flex items-center justify-center rounded-full mx-auto shadow-inner">
                            ${user.nama_lengkap.charAt(0)}
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-white">${user.nama_lengkap}</h3>
                            <p class="text-xs text-slate-400">Lingkungan ${user.lingkungan} - Rayon ${user.rayon}</p>
                        </div>
                        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-left space-y-2">
                            <p class="text-xs font-semibold text-purple-400">Status Sensus:</p>
                            <p class="text-xs text-slate-300">Jabatan: ${user.status_pelayanan || 'Jemaat'}</p>
                            <button onclick="openExtendedProfile()" class="w-full mt-2 bg-slate-800 text-purple-300 py-2 rounded-xl text-xs font-semibold hover:bg-slate-700 transition">Lengkapi Data Diri Lanjutan ➔</button>
                        </div>
                          <!-- Di dalam fungsi renderDashboard(user) bagian tab 'profil': -->
                        <div class="pt-2 space-y-2">
                            <button onclick="logout()" class="w-full bg-rose-950/50 text-rose-400 border border-rose-900/50 py-3 rounded-xl font-semibold text-sm hover:bg-rose-900/50 transition">Keluar (Logout)</button>
    
                            <!-- Tautan Tersembunyi/Akses Cepat khusus pengurus -->
                            <a href="admin.html" class="block text-center text-[11px] text-slate-500 hover:text-purple-400 pt-2 transition">
                                🔒 Masuk ke Panel Pengurus Gereja
                            </a>
                        </div>
                    </div>
                `;
            }
        }

        // --- HALAMAN PUSAT DOWNLOAD (GOOGLE DRIVE) ---
        function openDownloadCenter() {
            const main = document.querySelector("main");
            document.getElementById("headerTitle").innerText = "Pusat Download PDF";
            main.className = "flex-1 p-4 overflow-y-auto pb-24 animate-fade-in";

            main.innerHTML = `
                <div class="space-y-4">
                    <button onclick="switchTab('home')" class="text-xs text-purple-400 font-semibold mb-2">← Kembali ke Beranda</button>
                    <div class="bg-purple-950/40 border border-purple-900/40 p-3 rounded-xl">
                        <p class="text-xs text-purple-200">Unduh warta mingguan, lembar liturgi, dan dokumen penting gereja berformat PDF.</p>
                    </div>

                    <div class="space-y-3">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-sm">
                            <div>
                                <h4 class="text-xs font-bold text-white">Warta Jemaat Minggu Ini</h4>
                                <p class="text-[10px] text-slate-400 mt-0.5">Format PDF &bull; Ukuran 1.2 MB</p>
                            </div>
                            <a href="#" target="_blank" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-xl text-xs font-semibold transition">Download</a>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- HALAMAN FORM DATA DIRI LANJUTAN ---
        function openExtendedProfile() {
            const main = document.querySelector("main");
            document.getElementById("headerTitle").innerText = "Lengkapi Data Diri";
            main.className = "flex-1 p-4 overflow-y-auto pb-24 animate-fade-in";

            main.innerHTML = `
                <div class="space-y-4">
                    <button onclick="switchTab('home')" class="text-xs text-purple-400 font-semibold mb-2">← Kembali ke Beranda</button>
                    <div class="bg-purple-950/40 border border-purple-900/40 p-3 rounded-xl">
                        <p class="text-xs text-purple-200">Silakan lengkapi informasi tambahan di bawah ini untuk pendataan sensus gereja yang lebih akurat.</p>
                    </div>
                    <form onsubmit="handleSaveExtendedProfile(event)" class="space-y-3">

        async function handleSendPrayer(e) {
            e.preventDefault();
            const btn = document.getElementById("btnPrayerSubmit");
            const data = {
                action: "addPrayer",
                user_id: window.currentUser.id,
                kategori_doa: document.getElementById("prayerCategory").value,
                isi_doa: document.getElementById("prayerContent").value,
                status_privasi: document.getElementById("prayerPrivacy").value
            };

            btn.disabled = true;
            btn.innerHTML = "Mengirim...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                showToast(result.message);
                if (result.status === "success") {
                    switchTab('home');
                } else {
                    btn.disabled = false;
                    btn.innerHTML = "Kirim Doa";
                }
            } catch (err) {
                showToast("Gagal mengirim doa.", "error");
                btn.disabled = false;
                btn.innerHTML = "Kirim Doa";
            }
        }

// --- FUNGSI MENGAMBIL DATA DARI API ALKITAB DENGAN FALLBACK AMAN ---
async function fetchBibleVerse() {
    const book = document.getElementById("bibleBook").value;
    const chapter = document.getElementById("bibleChapter").value;
    const resultArea = document.getElementById("bibleResult");
    
    resultArea.innerHTML = `<p class="text-center text-purple-400 py-6 animate-pulse">Memuat ayat Alkitab...</p>`;
    
    try {
        // Menggunakan API Alkitab alternatif yang lebih stabil
        const response = await fetch(`https://api.etablis.org/bible/v1/id/books/${book}/chapters/${chapter}`);
        const result = await response.json();
        
        if (result && result.verses) {
            let htmlContent = `<h5 class="font-bold text-purple-400 mb-2">${book} Pasal ${chapter}</h5>`;
            result.verses.forEach(v => {
                htmlContent += `<p class="text-[11px] leading-relaxed mb-1"><strong class="text-purple-300">${v.verse}.</strong> ${v.text}</p>`;
            });
            resultArea.innerHTML = htmlContent;
            return;
        }
        throw new Error("Format data tidak sesuai");
        
    } catch (err) {
        // --- FALLBACK CERDAS (Teks cadangan otomatis jika API utama offline) ---
        let sampleText = "";
        if (book === "GEN" && chapter == 1) {
            sampleText = `
                <p class="text-[11px] leading-relaxed mb-1"><strong class="text-purple-300">1.</strong> Pada mulanya Allah menciptakan langit dan bumi.</p>
                <p class="text-[11px] leading-relaxed mb-1"><strong class="text-purple-300">2.</strong> Bumi belum berbentuk dan kosong, gelap gulita menutupi samudera raya, dan Roh Allah melayang-layang di atas permukaan air.</p>
                <p class="text-[11px] leading-relaxed mb-1"><strong class="text-purple-300">3.</strong> Berfirmanlah Allah: "Jadilah terang." Lalu terang itu jadi.</p>
            `;
        } else if (book === "PSA" && chapter == 23) {
            sampleText = `
                <p class="text-[11px] leading-relaxed mb-1"><strong class="text-purple-300">1.</strong> TUHAN adalah gembalaku, takkan kekurangan aku.</p>
                <p class="text-[11px] leading-relaxed mb-1"><strong class="text-purple-300">2.</strong> Ia membaringkan aku di padang rumput yang hijau, Ia membimbing aku ke air yang tenang.</p>
            `;
        } else if (book === "JHN" && chapter == 3) {
            sampleText = `
                <p class="text-[11px] leading-relaxed mb-1"><strong class="text-purple-300">16.</strong> Karena begitu besar kasih Allah akan dunia ini, sehingga Ia telah mengaruniakan Anak-Nya yang tunggal, supaya setiap orang yang percaya kepada-Nya tidak binasa, melainkan beroleh hidup yang kekal.</p>
            `;
        } else {
            sampleText = `<p class="text-slate-300">Teks untuk ${book} pasal ${chapter} sedang dimuat dalam mode offline. Silakan coba beberapa saat lagi.</p>`;
        }

        resultArea.innerHTML = `
            <div class="space-y-2">
                <div class="bg-purple-950/40 p-2 rounded-lg mb-2">
                    <p class="text-[10px] text-purple-300">ℹ️ Menampilkan mode baca stabil (Offline/Fallback Mode)</p>
                </div>
                <h5 class="font-bold text-purple-400 mb-2">Kitab ${book} Pasal ${chapter}</h5>
                ${sampleText}
            </div>
        `;
    }
}

        async function openHymnsList() {
            const main = document.querySelector("main");
            document.getElementById("headerTitle").innerText = "Kidung Jemaat";
            
            main.innerHTML = `
                <div class="space-y-4">
                    <button onclick="openLibraryMenu()" class="text-xs text-purple-400 font-semibold mb-2">← Kembali ke Pustaka</button>
                    
                    <div class="relative">
                        <input type="text" id="hymnSearchInput" oninput="filterHymns()" placeholder="Cari nomor atau judul lagu..." class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white outline-none focus:border-purple-500">
                    </div>

                    <div id="hymnsContainer" class="space-y-2">
                        <p class="text-xs text-slate-400 text-center py-6">Memuat daftar kidung...</p>
                    </div>
                </div>
            `;

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getHymns`);
                const result = await response.json();
                
                window.allHymns = result.hymns || [];
                renderHymnsList(window.allHymns);
            } catch (err) {
                document.getElementById("hymnsContainer").innerHTML = `<p class="text-xs text-rose-400 text-center">Gagal memuat data kidung.</p>`;
            }
        }

        function renderHymnsList(hymns) {
            const container = document.getElementById("hymnsContainer");
            if (hymns.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Lagu tidak ditemukan.</p>`;
                return;
            }

            container.innerHTML = hymns.map(h => `
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-bold text-purple-400">KJ No. ${h.nomor}</span>
                        <span class="text-[10px] text-slate-500">Kidung Jemaat</span>
                    </div>
                    <h5 class="text-xs font-semibold text-white mb-1">${h.judul}</h5>
                    <p class="text-[11px] text-slate-400 whitespace-pre-line bg-slate-950 p-3 rounded-lg mt-2">${h.lirik}</p>
                </div>
            `).join('');
        }

        function filterHymns() {
            const keyword = document.getElementById("hymnSearchInput").value.toLowerCase();
            const filtered = window.allHymns.filter(h => 
                String(h.nomor).toLowerCase().includes(keyword) || h.judul.toLowerCase().includes(keyword)
            );
            renderHymnsList(filtered);
        }

    `;

    try {
        const response = await fetch(`${SCRIPT_URL}?action=getEvents`);
        const result = await response.json();
        
        const container = document.getElementById("eventsContainer");

        if (events.length === 0) {
            container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Belum ada agenda kegiatan yang diunggah.</p>`;

        container.innerHTML = events.map(ev => `

                    <span class="bg-purple-900/60 text-purple-300 text-[10px] px-2 py-0.5 rounded-md">${ev.waktu || 'Sesuai Jadwal'}</span>
                </div>
                <div class="text-[11px] text-slate-400 space-y-1">
                    <p>📅 ${ev.tanggal} &bull; 📍 ${ev.lokasi}</p>
                    ${ev.keterangan ? `<p class="text-slate-300 italic pt-1 border-t border-slate-800">${ev.keterangan}</p>` : ''}
                </div>
            </div>
        `).join('');

    } catch (err) {
        document.getElementById("eventsContainer").innerHTML = `<p class="text-xs text-rose-400 text-center">Gagal memuat data kegiatan.</p>`;
    }
}
