<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMIT JPO Digital</title>
    <!-- Memanggil file manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- Tema warna browser HP -->
    <meta name="theme-color" content="#9333ea">
    <!-- Khusus untuk iPhone / iOS (Safari kadang mengabaikan manifest) -->
    <link rel="apple-touch-icon" href="download.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        /* --- GAYA KHUSUS MODE LANSIA --- */
        body.senior-mode {
            background-color: #fef3c7 !important; /* Amber 50 (Krem hangat yang tidak silau) */
            color: #1e293b !important; /* Slate 800 (Gelap pekat agar mudah dibaca) */
            font-size: 1.15rem !important; /* Memperbesar seluruh teks dasar */
        }

        /* Mengubah kontainer utama menjadi terang */
        body.senior-mode .max-w-md {
            background-color: #ffffff !important;
            border-color: #fcd34d !important;
            color: #0f172a !important;
        }

        /* Mengubah kartu-kartu (card) menjadi warna terang dengan border jelas */
        body.senior-mode .bg-slate-900, 
        body.senior-mode .bg-slate-950 {
            background-color: #f8fafc !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }

        /* Memperbesar teks di dalam kartu */
        body.senior-mode p, 
        body.senior-mode span, 
        body.senior-mode label, 
        body.senior-mode a {
            color: #1e293b !important;
            font-size: 0.95rem !important;
        }

        /* Judul dibuat lebih tebal dan hitam */
        body.senior-mode h1, body.senior-mode h2, body.senior-mode h3, body.senior-mode h4 {
            color: #0f172a !important;
            font-weight: 800 !important;
        }

        /* Input dan Form dibuat sangat jelas dengan garis tepi tebal */
        body.senior-mode input, 
        body.senior-mode select, 
        body.senior-mode textarea {
            background-color: #ffffff !important;
            border: 2px solid #94a3b8 !important;
            color: #0f172a !important;
            font-size: 1rem !important;
            padding: 12px !important;
        }

        /* Tombol-tombol dibuat berukuran besar dan kontras tinggi */
        body.senior-mode button {
            font-size: 1rem !important;
            font-weight: bold !important;
            padding-top: 12px !important;
            padding-bottom: 12px !important;
        }
    </style>
    </head>
<body id="appBody" class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0">

    <!-- PUSH NOTIFICATION POPUP (URGENT/WARNING) -->
    <div id="pushNotifOverlay" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-slate-900 border-2 border-amber-500 rounded-2xl shadow-[0_0_30px_rgba(245,158,11,0.3)] p-6 max-w-xs w-full animate-slide-in relative">
            <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 bg-amber-500 text-slate-900 text-3xl rounded-full w-12 h-12 flex items-center justify-center shadow-lg border-4 border-slate-900">
                ⚠️
            </div>
            <h3 class="font-bold text-amber-400 text-center mt-5 mb-3 uppercase tracking-wider text-sm">Syalom</h3>
            <p id="pushNotifMessage" class="text-xs text-slate-200 text-center mb-6 leading-relaxed whitespace-pre-line"></p>
            <button onclick="closePushNotif()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl text-sm transition shadow-md">
                Mengerti & Tutup
            </button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION DI TENGAH LAYAR -->
    <div id="toastContainer" class="fixed inset-0 z-50 flex items-center justify-center px-4 pointer-events-none"></div>

    <!-- SIDEBAR NAVIGASI SAMPING (MENU ☰) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm transition-opacity" onclick="toggleSidebar(false)"></div>
    <div id="sidebarMenu" class="fixed top-0 left-0 bottom-0 w-72 bg-slate-950 border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col p-5 shadow-2xl">
        <div class="flex justify-between items-center pb-4 border-b border-slate-800">
            <h3 class="font-bold text-sm text-purple-400">Pengaturan & Tema</h3>
            <button onclick="toggleSidebar(false)" class="text-slate-400 hover:text-white text-lg">✕</button>
        </div>
        
<div class="py-4 space-y-4 flex-1 overflow-y-auto">
            <div>
                <p class="text-xs font-semibold text-slate-400 mb-2">Pilih Tema Aplikasi:</p>
                <div class="grid grid-cols-1 gap-2">
                    <button onclick="setTheme('slate')" class="text-left px-3 py-2 rounded-xl text-xs bg-slate-900 border border-slate-800 hover:border-purple-500 transition">🌙 Slate Dark (Default)</button>
                    <button onclick="setTheme('emerald')" class="text-left px-3 py-2 rounded-xl text-xs bg-emerald-950/40 border border-emerald-900/50 hover:border-emerald-500 transition">🌿 Emerald Nature</button>
                    <button onclick="setTheme('purple')" class="text-left px-3 py-2 rounded-xl text-xs bg-purple-950/40 border border-purple-900/50 hover:border-purple-500 transition">🍇 Royal Purple</button>
                    <button onclick="setTheme('sunset')" class="text-left px-3 py-2 rounded-xl text-xs bg-orange-950/40 border border-orange-900/50 hover:border-orange-500 transition">🌅 Warm Sunset</button>
                    <button onclick="setTheme('light')" class="text-left px-3 py-2 rounded-xl text-xs bg-slate-100 text-slate-900 border border-slate-300 hover:border-slate-500 transition">☀️ Light Clean</button>
                    
                    <!-- TOMBOL MODE LANSIA DIPINDAHKAN KE SINI -->
                    <button onclick="toggleSeniorMode()" id="seniorModeBtn" class="text-left px-3 py-2 rounded-xl text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:border-amber-400 transition flex items-center justify-between">
                        <span>👓 Mode Lansia / Senior</span>
                        <span>Aktifkan</span>
                    </button>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <p class="text-xs font-semibold text-slate-400 mb-2">Akses Cepat:</p>
                <button onclick="installPWA()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 px-3 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2 shadow-md">
                    📲 Tambahkan ke Beranda
                </button>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-800 text-[10px] text-slate-500 text-center">
            GMIT JPO Digital v2.5 &bull; Pniel Oebobo
        </div>
    </div>

    <!-- Container Utama Mobile (Fixed Header & Footer Layout) -->
    <div id="app" class="max-w-md w-full mx-auto bg-slate-950 min-h-screen flex flex-col shadow-2xl relative">
        
        <!-- HEADER (FIXED) -->
        <header class="fixed top-0 left-0 right-0 max-w-md mx-auto z-40 bg-slate-950/95 backdrop-blur-md text-white p-4 flex justify-between items-center border-b border-purple-900/30 shadow-md">
            <button onclick="toggleSidebar(true)" class="text-xl p-1 hover:bg-slate-900 rounded-lg transition">☰</button>
            <h1 id="headerTitle" class="font-bold text-sm tracking-wide truncate px-2 text-center">GMIT Jemaat PNIEL Oebobo ⛪</h1>
            <div id="syncIndicator" class="flex items-center gap-1 text-xs" title="Status Sinkronisasi Online">
                <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[10px] text-slate-400 hidden sm:inline" id="syncText">Online</span>
            </div>
        </header>

        <!-- KONTEN UTAMA (SCROLLABLE ANTARA HEADER & FOOTER) -->
        <main class="flex-1 p-4 pt-20 pb-20 overflow-y-auto animate-fade-in">
            <!-- Konten dimuat dinamis di sini -->
        </main>
<!-- NAVIGATION BAR BAWAH (FIXED) -->
        <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 flex justify-around p-3 text-xs font-medium text-slate-400 shadow-lg">
            <button onclick="switchTab('home')" class="hover:text-purple-400 focus:text-purple-400 flex flex-col items-center gap-1 transition">🏠 Beranda</button>
            <button onclick="switchTab('doa')" class="hover:text-purple-400 focus:text-purple-400 flex flex-col items-center gap-1 transition">🙏 Kotak Doa</button>
            <!-- Perhatikan tambahan class "inline-flex items-center gap-1" di bawah ini -->
            <button onclick="switchTab('profil')" class="hover:text-purple-400 focus:text-purple-400 inline-flex items-center gap-1 transition">
                <span>👤</span> <span id="accountNavText">Akun</span>
            </button>
        </nav>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLTEI5pSm4gjnBQHcqCwFMS7vcIzpWt6sfXtdjpEk1QlnndTlSA6nZYlQwfWFY_oLHzA/exec";

        // --- PENDAFTARAN SERVICE WORKER (WAJIB UNTUK PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((registration) => {
                        console.log('Service Worker berhasil didaftarkan:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Service Worker gagal didaftarkan:', error);
                    });
            });
        }
        
        // Variabel untuk menyimpan prompt instalasi bawaan browser
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            // Mencegah Chrome menampilkan prompt instalasi otomatis secara tiba-tiba
            e.preventDefault();
            // Simpan event ke variabel agar bisa dipanggil saat tombol diklik
            deferredPrompt = e;
        });

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            container.innerHTML = ""; 
            
            const toast = document.createElement("div");
            const bgColor = type === "success" ? "bg-emerald-600 shadow-emerald-900/50" : "bg-rose-600 shadow-rose-900/50";
            
            toast.className = `${bgColor} text-white px-5 py-3.5 rounded-2xl shadow-2xl text-xs font-semibold pointer-events-auto animate-slide-in flex items-center gap-2 max-w-xs w-full text-center border border-white/10`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span class="flex-1">${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "scale(0.9)";
                toast.style.transition = "all 0.3s ease";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- FITUR PUSH NOTIFIKASI ---
        async function checkPushNotification() {
            if (sessionStorage.getItem('notif_seen') === 'true') return;

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getNotification`);
                const result = await response.json();
                
                if (result.status === 'success' && result.data.is_active) {
                    document.getElementById('pushNotifMessage').innerText = result.data.message;
                    document.getElementById('pushNotifOverlay').classList.remove('hidden');
                    sessionStorage.setItem('notif_seen', 'true');
                }
            } catch (err) {
                console.log("Gagal memuat notifikasi", err);
            }
        }

        function closePushNotif() {
            document.getElementById('pushNotifOverlay').classList.add('hidden');
        }

        // --- MONITORING STATUS ONLINE/OFFLINE ---
        function updateNetworkStatus() {
            const dot = document.getElementById("syncDot");
            const text = document.getElementById("syncText");
            if (navigator.onLine) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                if(text) { text.innerText = "Online"; text.className = "text-[10px] text-emerald-400 hidden sm:inline"; }
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                if(text) { text.innerText = "Offline"; text.className = "text-[10px] text-rose-400 hidden sm:inline"; }
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // --- SIDEBAR & TEMA ---
        function toggleSidebar(show) {
            const sidebar = document.getElementById("sidebarMenu");
            const overlay = document.getElementById("sidebarOverlay");
            if (show) {
                sidebar.classList.remove("-translate-x-full");
                overlay.classList.remove("hidden");
            } else {
                sidebar.classList.add("-translate-x-full");
                overlay.classList.add("hidden");
            }
        }

        function setTheme(theme) {
            const app = document.getElementById("app");
            const body = document.getElementById("appBody");
            
            if (theme === 'emerald') {
                app.className = "max-w-md w-full mx-auto bg-emerald-950 min-h-screen flex flex-col shadow-2xl relative text-slate-100";
                body.className = "bg-emerald-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0";
            } else if (theme === 'purple') {
                app.className = "max-w-md w-full mx-auto bg-purple-950 min-h-screen flex flex-col shadow-2xl relative text-slate-100";
                body.className = "bg-purple-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0";
            } else if (theme === 'sunset') {
                app.className = "max-w-md w-full mx-auto bg-stone-950 min-h-screen flex flex-col shadow-2xl relative text-amber-50";
                body.className = "bg-stone-950 text-amber-50 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0";
            } else if (theme === 'light') {
                app.className = "max-w-md w-full mx-auto bg-slate-50 min-h-screen flex flex-col shadow-2xl relative text-slate-900";
                body.className = "bg-slate-200 text-slate-900 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0";
            } else {
                app.className = "max-w-md w-full mx-auto bg-slate-950 min-h-screen flex flex-col shadow-2xl relative text-slate-100";
                body.className = "bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center m-0 p-0";
            }
            toggleSidebar(false);
            showToast("Tema berhasil diterapkan!");
        }

        async function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                toggleSidebar(false);
            } else {
                showToast("Gunakan menu 'Tambahkan ke Beranda' / 'Add to Home Screen' di pengaturan browser Anda.");
                toggleSidebar(false);
            }
        }

        // --- AUTH UNTUK POST ACTION ---
        function checkAuthBeforeAction(actionCallback) {
            const savedUser = localStorage.getItem("user_gereja");
            if (savedUser) {
                window.currentUser = JSON.parse(savedUser);
                actionCallback();
            } else {
                showToast("Silakan login atau daftar terlebih dahulu.", "error");
                renderAuthPageForAction(actionCallback);
            }
        }

        function renderAuthPageForAction(callbackOnSuccess) {
            window.pendingAuthAction = callbackOnSuccess;

            const main = document.querySelector("main");
            document.getElementById("headerTitle").innerText = "Autentikasi Jemaat 🔐";
            
            main.innerHTML = `
                <div class="space-y-6 pt-2 animate-fade-in">
                    <button onclick="switchTab('home')" class="text-xs text-purple-400 font-semibold mb-2">← Kembali ke Beranda</button>
                    <div class="text-center">
                        <h2 class="text-lg font-bold text-purple-400">Verifikasi Akun Diperlukan</h2>
                        <p class="text-xs text-slate-400 mt-1">Fitur ini memerlukan login atau registrasi agar data terhubung ke database gereja.</p>
                    </div>

                    <div class="flex border-b border-slate-800">
                        <button id="tabLoginBtn" onclick="toggleAuthTab('login')" class="flex-1 pb-2 font-semibold text-purple-400 border-b-2 border-purple-400 text-xs">Masuk</button>
                        <button id="tabRegBtn" onclick="toggleAuthTab('register')" class="flex-1 pb-2 text-slate-500 text-xs">Daftar Baru</button>
                    </div>

                    <form id="formLogin" onsubmit="handleLoginForAction(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap</label>
                            <input type="text" id="loginNama" required placeholder="Contoh: Budi Santoso" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">4 Digit Terakhir No. WhatsApp</label>
                            <input type="password" maxlength="4" id="loginPin" required placeholder="Cth: 7899" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none focus:border-purple-500">
                        </div>
                        <button type="submit" id="btnLoginSubmit" class="w-full bg-purple-600 text-white py-3 rounded-xl font-semibold text-sm shadow-md hover:bg-purple-700 transition">Masuk & Lanjutkan</button>
                    </form>

                    <form id="formRegister" onsubmit="handleRegisterForAction(event)" class="space-y-3 hidden">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap</label>
                            <input type="text" id="regNama" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                        </div>
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Tempat Lahir</label>
                                <input type="text" id="regTempatLahir" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Tanggal Lahir</label>
                                <input type="date" id="regTglLahir" required class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Status Pelayanan</label>
                            <select id="regStatus" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                                <option value="Jemaat">Jemaat</option>
                                <option value="Pendeta">Pendeta</option>
                                <option value="Majelis">Majelis</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Lingkungan</label>
                                <input type="text" id="regLingkungan" required placeholder="Cth: 1" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Rayon</label>
                                <input type="text" id="regRayon" required placeholder="Cth: 2" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nomor WhatsApp</label>
                            <input type="tel" id="regWa" required placeholder="081234567899" class="w-full p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                        </div>
                        <button type="submit" id="btnRegSubmit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold text-sm shadow-md hover:bg-emerald-700 transition mt-2">Daftar & Lanjutkan</button>
                    </form>
                </div>
            `;
        }

        function toggleAuthTab(type) {
            const loginForm = document.getElementById("formLogin");
            const regForm = document.getElementById("formRegister");
            const loginBtn = document.getElementById("tabLoginBtn");
            const regBtn = document.getElementById("tabRegBtn");

            if (type === 'login') {
                loginForm.classList.remove("hidden");
                regForm.classList.add("hidden");
                loginBtn.className = "flex-1 pb-2 font-semibold text-purple-400 border-b-2 border-purple-400 text-xs";
                regBtn.className = "flex-1 pb-2 text-slate-500 text-xs";
            } else {
                loginForm.classList.add("hidden");
                regForm.classList.remove("hidden");
                regBtn.className = "flex-1 pb-2 font-semibold text-purple-400 border-b-2 border-purple-400 text-xs";
                loginBtn.className = "flex-1 pb-2 text-slate-500 text-xs";
            }
        }

        async function handleLoginForAction(e) {
            e.preventDefault();
            const btn = document.getElementById("btnLoginSubmit");
            const nama = document.getElementById("loginNama").value;
            const pin = document.getElementById("loginPin").value;

            btn.disabled = true;
            btn.innerHTML = "Memproses...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", nama_lengkap: nama, pin_4_digit: pin })
                });
                const result = await response.json();

                if (result.status === "success") {
                    showToast("Login Berhasil!");
                    localStorage.setItem("user_gereja", JSON.stringify(result.user));
                    updateAuthNavText(); // <-- Ubah teks jadi Akun saat berhasil masuk
                    window.currentUser = result.user;
                    
                    if (typeof window.pendingAuthAction === 'function') {
                        window.pendingAuthAction();
                        window.pendingAuthAction = null;
                    } else {
                        switchTab('home');
                    }
                } else {
                    showToast(result.message, "error");
                    btn.disabled = false;
                    btn.innerHTML = "Masuk & Lanjutkan";
                }
            } catch (err) {
                showToast("Kesalahan koneksi.", "error");
                btn.disabled = false;
                btn.innerHTML = "Masuk & Lanjutkan";
            }
        }

        async function handleRegisterForAction(e) {
            e.preventDefault();
            const btn = document.getElementById("btnRegSubmit");
            const data = {
                action: "register",
                nama_lengkap: document.getElementById("regNama").value,
                tempat_lahir: document.getElementById("regTempatLahir").value,
                tanggal_lahir: document.getElementById("regTglLahir").value,
                status_pelayanan: document.getElementById("regStatus").value,
                lingkungan: document.getElementById("regLingkungan").value,
                rayon: document.getElementById("regRayon").value,
                no_whatsapp: document.getElementById("regWa").value
            };

            btn.disabled = true;
            btn.innerHTML = "Mendaftarkan...";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.status === "success") {
                    showToast("Registrasi Berhasil!");
                    localStorage.setItem("user_gereja", JSON.stringify(result.user));
                    window.currentUser = result.user;

                    if (typeof window.pendingAuthAction === 'function') {
                        window.pendingAuthAction();
                        window.pendingAuthAction = null;
                    } else {

        async function fetchBibleVerse() {
            const bookCode = document.getElementById("bibleBook").value;
            const chapter = document.getElementById("bibleChapter").value;
            const bookObj = BIBLE_BOOKS.find(b => b.code === bookCode);
            const resultArea = document.getElementById("bibleResult");
            
            resultArea.innerHTML = `<p class="text-center text-purple-400 py-10 animate-pulse">Memuat ${bookObj.name} Pasal ${chapter}...</p>`;
            
            try {
                const response = await fetch(`https://api.etablis.org/bible/v1/id/books/${bookCode}/chapters/${chapter}`);
                const result = await response.json();
                
                if (result && result.verses) {
                    let htmlContent = `<h5 class="font-bold text-purple-400 mb-3 text-sm border-b border-slate-800 pb-1">${bookObj.name} Pasal ${chapter}</h5>`;
                    result.verses.forEach(v => {
                        htmlContent += `<p class="text-[11px] leading-relaxed mb-1.5"><strong class="text-purple-300">${v.verse}.</strong> ${v.text}</p>`;
                    });
                    resultArea.innerHTML = htmlContent;
                    return;
                }
                throw new Error("Format data tidak sesuai");
                
            } catch (err) {
                resultArea.innerHTML = `
                    <div class="space-y-2">
                        <div class="bg-purple-950/40 p-2 rounded-lg mb-2">

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;

                img.onload = function() {
                    const MAX_WIDTH = 200;
                    const MAX_HEIGHT = 200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    const imgPreview = document.getElementById('previewFoto');
                    imgPreview.src = compressedBase64;
                    imgPreview.classList.remove('hidden');
                    imgPreview.nextElementSibling.classList.add('hidden');

                    document.getElementById('fotoBase64').value = compressedBase64;
                };
            };
            reader.readAsDataURL(file);
        }

        async function handleSaveExtendedProfile(e) {
            e.preventDefault();
            const btn = e.target.querySelector("button[type='submit']");
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "Menyimpan Data...";

            const updatedData = {
                action: "updateExtendedProfile",
                user_id: window.currentUser.id,
                alamat: document.getElementById("extAlamat").value,
                pekerjaan: document.getElementById("extPekerjaan").value,
                golongan_darah: document.getElementById("extGoldar").value,
                minat_pelayanan: document.getElementById("extKomisi").value,
                foto_profil: document.getElementById("fotoBase64").value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(updatedData)
                });
                const result = await response.json();

                if (result.status === "success") {
                    window.currentUser.alamat = updatedData.alamat;
                    window.currentUser.pekerjaan = updatedData.pekerjaan;
                    window.currentUser.golongan_darah = updatedData.golongan_darah;
                    window.currentUser.minat_pelayanan = updatedData.minat_pelayanan;
                    window.currentUser.foto_profil = updatedData.foto_profil;
                    
                    localStorage.setItem("user_gereja", JSON.stringify(window.currentUser));

                    showToast("Data diri berhasil disimpan!");
                    setTimeout(() => switchTab('profil'), 800);
                } else {
                    showToast(result.message, "error");
                    btn.disabled = false;
                    btn.innerText = originalText;
                }
            } catch (err) {
                showToast("Kesalahan koneksi.", "error");
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        async function handleSendPrayer(e) {
            e.preventDefault();
            const btn = document.getElementById("btnPrayerSubmit");
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const data = {
                action: "addPrayer",
                user_id: window.currentUser.id,
                nama_pengirim: document.getElementById("prayerSenderOption").value === 'name' ? window.currentUser.nama_lengkap : "Hamba Tuhan / Anonim",
                kategori_doa: document.getElementById("prayerCategory").value,
                isi_doa: document.getElementById("prayerContent").value,
                status_privasi: document.getElementById("prayerPrivacy").value
            };

            try {
                const response = await fetch(SCRIPT_URL, {

                const result = await response.json();
                showToast(result.message);

                btn.disabled = false;

                                <button onclick="handleReactionAndRefresh('donasi', '${d.id}', '❤️')" class="text-[11px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg transition flex items-center">❤️ ${r["❤️"] ? `<span class="text-[9px] text-amber-400 ml-1 font-bold">${r["❤️"]}</span>` : ''}</button>
                                <button onclick="handleReactionAndRefresh('prayer', '${p.id}', '🤞')" class="text-[11px] bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg transition flex items-center">🤞 ${r["🤞"] ? `<span class="text-[9px] text-amber-400 ml-1 font-bold">${r["🤞"]}</span>` : ''}</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById("donationContainer").innerHTML = `<p class="text-xs text-rose-400 text-center">Gagal memuat donasi.</p>`;
            }
        }

        function openFormDonation() {
            const main = document.querySelector("main");
            const user = window.currentUser || {};
            document.getElementById("headerTitle").innerText = "Form Kirim Donasi";
            main.innerHTML = `
                <div class="space-y-4">
                    <button onclick="openDonationList()" class="text-xs text-purple-400 font-semibold mb-2">← Kembali ke Daftar Donasi</button>
                    <form onsubmit="handleSendDonation(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Opsi Tampilkan Nama</label>
                            <select id="donNameOption" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                                <option value="full">Tampilkan Nama Lengkap (${user.nama_lengkap})</option>
                                <option value="initial">Inisial Saja (Cth: B***)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Peruntukan</label>
                            <input type="text" id="donKet" required placeholder="Cth: Pembangunan Gedung" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Nominal (Rp)</label>
                            <input type="number" id="donNominal" required placeholder="Cth: 100000" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white outline-none">
                        </div>
                        <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-xl font-semibold text-sm shadow-md">Kirim Konfirmasi</button>
                    </form>
                </div>
            `;
        }

        async function handleSendDonation(e) {
            e.preventDefault();
            const btn = e.target.querySelector("button[type='submit']");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const user = window.currentUser;
            const nameOption = document.getElementById("donNameOption").value;
            let finalName = nameOption === 'initial' ? user.nama_lengkap.charAt(0) + '***' : user.nama_lengkap;

            const data = {
                action: "addDonation",
                user_id: user.id,
                nama_donatur: finalName,
                jenis_donasi: "Transfer",
                keterangan: document.getElementById("donKet").value,
                nominal: document.getElementById("donNominal").value,
                tanggal: new Date()
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                showToast(result.message);
                if (result.status === "success") {
                    openDonationList();
                } else {
                    btn.disabled = false;
                    btn.innerText = "Kirim Konfirmasi";
                }
            } catch (err) {
                showToast("Gagal mengirim donasi.", "error");
                btn.disabled = false;
                btn.innerText = "Kirim Konfirmasi";
            }
        }
        // --- FITUR MODE KHUSUS LANSIA / SENIOR ---
        function toggleSeniorMode() {
            const body = document.body;
            const isSenior = body.classList.toggle('senior-mode');
            
            if (isSenior) {
                localStorage.setItem('gmit_senior_mode', 'true');
                showToast("Mode Lansia Diaktifkan (Huruf & Tampilan Diperbesar)");
                document.getElementById('seniorModeBtn').innerText = "🌙 Mode Normal";
                document.getElementById('seniorModeBtn').className = "text-xs bg-purple-600 text-white px-2.5 py-1.5 rounded-xl font-semibold flex items-center gap-1 transition shadow-md";
            } else {
                localStorage.setItem('gmit_senior_mode', 'false');
                showToast("Kembali ke Mode Normal");
                document.getElementById('seniorModeBtn').innerText = "👓 Mode Lansia";
                document.getElementById('seniorModeBtn').className = "text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-1.5 rounded-xl font-semibold flex items-center gap-1 transition";
            }
        }

        // Jalankan saat aplikasi pertama kali dibuka untuk mengecek preferensi tersimpan
        window.addEventListener('DOMContentLoaded', () => {
            const savedSeniorMode = localStorage.getItem('gmit_senior_mode');
            if (savedSeniorMode === 'true') {
                document.body.classList.add('senior-mode');
                const btn = document.getElementById('seniorModeBtn');
                if(btn) {
                    btn.innerText = "🌙 Mode Normal";
                    btn.className = "text-xs bg-purple-600 text-white px-2.5 py-1.5 rounded-xl font-semibold flex items-center gap-1 transition shadow-md";
                }
            }
        });
        
// --- FITUR INTERAKSI JEMAAT (REAKSI INSTAN TANPA FULL REFRESH) ---
        async function handleReactionAndRefresh(tipe, idTarget, emoji) {
            const user = window.currentUser || { id: "Anonim" };
            
            // 1. Cari elemen tombol atau badge angka yang diklik berdasarkan target dan emoji
            // Kita gunakan event target untuk mendeteksi tombol spesifik yang baru saja ditekan
            const eventBtn = event.currentTarget;
            if (eventBtn) {
                // Cari elemen span angka di dalam tombol tersebut
                let badgeSpan = eventBtn.querySelector('span');
                if (badgeSpan) {
                    // Jika span angka sudah ada, langsung tambahkan nilai angkanya secara instan
                    let currentVal = parseInt(badgeSpan.innerText) || 0;
                    badgeSpan.innerText = currentVal + 1;
                } else {
                    // Jika sebelumnya angka belum ada (kosong), buat elemen span baru secara instan
                    const newSpan = document.createElement('span');
                    newSpan.className = "text-[9px] text-amber-400 ml-1 font-bold";
                    newSpan.innerText = "1";
                    eventBtn.appendChild(newSpan);
                }
            }

            showToast(`Memberikan reaksi ${emoji}`);
            
            try {
                // 2. Kirim data ke Google Sheet di latar belakang secara diam-diam
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "addReaction",
                        tipe: tipe,
                        target_id: idTarget,
                        user_id: user.id,
                        emoji: emoji
                    })
                });
                
                // Tidak perlu memanggil openPublicPrayerWall() atau openDonationList() lagi, 
                // sehingga layar tidak akan berkedip / muat ulang sama sekali!
            } catch (err) {
                console.log("Gagal mencatat reaksi", err);
                showToast("Gagal mencatat reaksi", "error");
            }
        }

        async function handleReplyPrayer(prayerId) {
            const replyText = prompt("Masukkan balasan pastoral Anda untuk doa ini:");
            if (replyText && replyText.trim() !== "") {
                showToast("Balasan sedang diproses...", "success");
                
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "replyPrayer",
                            prayer_id: prayerId,
                            reply_text: replyText.trim()
                        })
                    });
                    const result = await response.json();
                    
                    showToast(result.message);
                    if (result.status === "success") {
                        // Refresh halaman doa agar balasan langsung muncul
                        openPublicPrayerWall();
                    }
                } catch (err) {
                    showToast("Gagal mengirim balasan.", "error");
                }
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            updateNetworkStatus();
            switchTab('home');
            checkPushNotification();
            updateAuthNavText(); // <-- Panggil di sini
        });
        function updateAuthNavText() {
            const navText = document.getElementById("accountNavText");
            if (!navText) return;
            
            const savedUser = localStorage.getItem("user_gereja");
            if (savedUser) {
                navText.innerText = "Akun";
            } else {
                navText.innerText = "Login";
            }
        }
    </script>
</body>
