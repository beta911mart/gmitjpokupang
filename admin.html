<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - JPO Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

    <!-- Kontainer utama diperlebar menjadi w-full dengan padding fleksibel -->
    <div id="adminApp" class="w-full px-4 md:px-6 py-4 min-h-screen flex flex-col">
        
        <header class="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center shadow-md mb-6">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg text-xs transition" title="Kembali ke Aplikasi Jemaat">← Jemaat</a>
                <div>
                    <h1 class="font-bold text-sm">Panel Admin & Tim Multimedia</h1>
                    <p id="adminInfo" class="text-[10px] text-slate-400">Silakan login</p>
                </div>
            </div>
            <button id="logoutBtn" onclick="adminLogout()" class="hidden bg-rose-600 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-rose-700 transition">Keluar</button>
        </header>

        <main class="flex-1 flex flex-col">
            <!-- Konten dinamis dimuat di sini -->
        </main>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLTEI5pSm4gjnBQHcqCwFMS7vcIzpWt6sfXtdjpEk1QlnndTlSA6nZYlQwfWFY_oLHzA/exec";
        const IMGBB_API_KEY = "1a837d888693ad38769e982062e82d88";

        function getSafeAdminId() {
            try {
                let raw = sessionStorage.getItem("admin_gereja");
                if (raw) {
                    let parsed = JSON.parse(raw);
                    if (parsed && parsed.id) return parsed.id;
                }
            } catch (e) {}
            return "SUPER_ADMIN";
        }

        function getProxiedImageUrl(rawUrl, width = 600) {
            if (!rawUrl) return "";
            // Ubah domain img.ibb.co menjadi img.ibb.co.com jika diperlukan atau gunakan wsrv.nl proxy
            let fixedUrl = rawUrl.replace("://i.ibb.co/", "://i.ibb.co.com/");
            return `https://wsrv.nl/?url=${encodeURIComponent(fixedUrl)}&w=${width}&fit=cover`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const savedAdmin = sessionStorage.getItem("admin_gereja");
            if (savedAdmin) {
                try {
                    renderAdminDashboard(JSON.parse(savedAdmin));
                } catch(e) {
                    renderAdminLogin();
                }
            } else {
                renderAdminLogin();
            }
        });

        function renderAdminLogin() {
            const main = document.querySelector("main");
            main.innerHTML = `
                <div class="max-w-md w-full mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-10">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 text-center">Login Khusus Pengurus</h2>
                    <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Username Admin</label>
                            <input type="text" id="adminUser" required class="w-full p-3 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-900">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                            <input type="password" id="adminPass" required class="w-full p-3 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-900">
                        </div>
                        <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-lg font-semibold text-sm hover:bg-slate-800 transition">Masuk Panel</button>
                    </form>
                </div>
            `;
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById("adminUser").value;
            const password = document.getElementById("adminPass").value;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "adminLogin", username, password })
                });
                const result = await response.json();

                if (result.status === "success") {
                    sessionStorage.setItem("admin_gereja", JSON.stringify(result.admin));
                    renderAdminDashboard(result.admin);
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Kesalahan koneksi: " + err);
            }
        }

        function renderAdminDashboard(admin) {
            const adminNama = admin && admin.nama ? admin.nama : "Admin";
            const adminRole = admin && admin.role ? admin.role : "Operator";
            document.getElementById("adminInfo").innerText = `Login: ${adminNama} (${adminRole})`;
            document.getElementById("logoutBtn").classList.remove("hidden");
            
            const isSuper = adminRole === "Super Admin";

            const main = document.querySelector("main");
            main.innerHTML = `
                <div class="space-y-6 w-full">
                    <div class="grid grid-cols-2 md:grid-cols-5 lg:grid-cols-9 gap-3">
                        <button onclick="loadSensusData()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">👥 Data Jemaat</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Daftar sensus & verifikasi.</p>
                        </button>
                        <button onclick="loadPrayerData()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">🙏 Moderasi Doa</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Approval kotak doa.</p>
                        </button>
                        <button onclick="loadDonationAdmin()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">🎁 Kelola Donasi</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Verifikasi persembahan.</p>
                        </button>
                        <button onclick="loadEventForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📅 Kelola Kegiatan</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Tambah jadwal acara.</p>
                        </button>
                        <button onclick="loadUploadGaleriForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">🖼️ Unggah Galeri</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Upload foto via imgBB.</p>
                        </button>
                        <button onclick="loadNotificationAdmin()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📢 Push Notif</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Kelola popup peringatan.</p>
                        </button>
                        <button onclick="loadMassBroadcastForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📡 Mass Broadcast</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Kirim notif massal/terarah.</p>
                        </button>
                        <button onclick="showRenunganForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📖 Input Renungan</h3>
                             <p class="text-[11px] text-slate-500 mt-1">Tambah ayat & renungan.</p>
                        </button>
                        <button onclick="openManualReportMenu()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📤 Laporan Manual</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Export Excel ke email.</p>
                        </button>
                        ${isSuper ? `
                        <button onclick="loadAdminManagement()" class="bg-purple-50 border border-purple-200 p-4 rounded-xl shadow-sm text-left hover:border-purple-400 transition">
                            <h3 class="font-bold text-xs text-purple-900">⚙️ Kelola Admin</h3>
                            <p class="text-[11px] text-purple-600 mt-1">Tambah/hapus operator.</p>
                        </button>` : ''}
                    </div>

                    <!-- Area konten dinamis diatur w-full penuh -->
                    <div id="adminContentArea" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm min-h-[350px] w-full">
                        <p class="text-center text-slate-400 text-sm py-10">Silakan pilih menu di atas untuk mengelola data gereja.</p>
                    </div>
                </div>
            `;
            loadSensusData();
        }

        function loadUploadGaleriForm() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `
                <div class="space-y-6 w-full">
                    <!-- BAGIAN 1: DAFTAR GALERI FOTO TERSEDIA -->
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl w-full space-y-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-sm text-slate-100">📋 Daftar Galeri Foto Tersimpan</h3>
                                <p class="text-xs text-slate-400">Lihat, pratinjau (popup), atau hapus foto galeri.</p>
                            </div>
                            <button onclick="loadUploadGaleriForm()" class="text-xs text-purple-400 font-bold hover:underline">🔄 Muat Ulang</button>
                        </div>
                        
                        <div id="galleryAdminLoading" class="text-xs text-slate-400 py-6 text-center">Memuat daftar galeri foto...</div>
                        <div id="galleryAdminGrid" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3 hidden max-h-[350px] overflow-y-auto pr-1"></div>
                    </div>

                    <!-- BAGIAN 2: FORM UNGGAH FOTO BARU -->
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl w-full">
                        <h3 class="font-bold text-sm text-slate-100 mb-1">🖼️ Unggah Foto Baru ke Galeri Jemaat</h3>
                        <p class="text-xs text-slate-400 mb-4">Foto akan diunggah otomatis ke imgBB, lalu dicatat ke sheet Galeri.</p>
                        
                        <form id="formUploadGaleri" onsubmit="handleUploadGaleri(event)" class="space-y-4 w-full">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Judul Foto</label>
                                <input type="text" id="galeriJudul" required placeholder="Cth: Ibadah Perayaan Natal Rayon 2" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 outline-none focus:border-purple-500">
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-300 mb-1">Kategori</label>
                                    <select id="galeriKategori" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 outline-none focus:border-purple-500">
                                        <option value="Lansia">Lansia</option>
                                        <option value="PKB">PKB (Kaum Bapak)</option>
                                        <option value="PW">PW (Kaum Wanita)</option>
                                        <option value="Pemuda">Pemuda</option>
                                        <option value="Remaja">Remaja</option>
                                        <option value="Anak">Anak / SM</option>
                                        <option value="Others">Others</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-300 mb-1">Momen</label>
                                    <select id="galeriMoment" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 outline-none focus:border-purple-500">
                                        <option value="Natal">Natal</option>
                                        <option value="Tahun Baru">Tahun Baru</option>
                                        <option value="Paskah">Paskah</option>
                                        <option value="Ultah Gereja">Ultah Gereja</option>
                                        <option value="Others">Others</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Tanggal Foto</label>
                                <input type="date" id="galeriTanggal" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 outline-none focus:border-purple-500">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Pilih Berkas Gambar</label>
                                <input type="file" id="galeriFile" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer">
                            </div>

                            <button type="submit" id="btnSubmitGaleri" class="w-full bg-purple-600 hover:bg-purple-700 text-white text-sm font-bold py-3 rounded-xl transition shadow-lg shadow-purple-600/30">
                                Unggah Foto & Simpan ke Galeri 🚀
                            </button>
                        </form>
                    </div>
                </div>

                <!-- MODAL POPUP PREVIEW FOTO ADMIN -->
                <div id="adminGalleryModal" class="fixed inset-0 bg-black/90 z-[9999] hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeAdminGalleryModal(event)">
                    <div class="relative bg-slate-900 border border-slate-700 p-4 rounded-2xl max-w-lg w-full flex flex-col items-center shadow-2xl" onclick="event.stopPropagation()">
                        <button onclick="closeAdminGalleryModal()" class="absolute top-3 right-3 bg-rose-600 hover:bg-rose-700 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition">✕</button>
                        <h4 id="modalAdminPhotoTitle" class="font-bold text-sm text-white mb-2 pr-8 text-center truncate w-full"></h4>
                        <div class="max-h-[60vh] w-full overflow-hidden flex items-center justify-center bg-black/50 rounded-xl mb-3 border border-slate-800">
                            <img id="modalAdminPhotoImg" src="" class="max-h-[60vh] w-auto object-contain">
                        </div>
                        <div class="flex justify-between items-center w-full text-[11px] text-slate-400 px-1">
                            <span id="modalAdminPhotoMeta"></span>
                            <button id="modalAdminDeleteBtn" onclick="" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg font-bold transition shadow-md">🗑️ Hapus Foto Ini</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("galeriTanggal").valueAsDate = new Date();
            fetchGalleryListForAdmin();
        }

        async function fetchGalleryListForAdmin() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getGallery`);
                const result = await res.json();
                const photos = result.gallery || [];
                window.adminGalleryCache = photos;

                document.getElementById("galleryAdminLoading").classList.add("hidden");
                const grid = document.getElementById("galleryAdminGrid");
                grid.classList.remove("hidden");

                if (photos.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-xs text-slate-400 text-center py-4">Belum ada foto tersimpan di galeri.</p>`;
                    return;
                }

                grid.innerHTML = photos.map((p, index) => {
                    const proxiedUrl = getProxiedImageUrl(p.url, 300);
                    return `
                        <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl flex flex-col justify-between group hover:border-purple-500 transition">
                            <div onclick="openAdminGalleryModal(${index})" class="aspect-square bg-slate-900 rounded-lg overflow-hidden cursor-pointer relative">
                                <img src="${proxiedUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold">🔍 Pratinjau</div>
                            </div>
                            <p class="text-[10px] text-slate-300 font-medium truncate mt-1.5 text-center px-1">${p.judul}</p>
                            <div class="mt-2 pt-1.5 border-t border-slate-800 flex justify-center gap-1">
                                <button onclick="openAdminGalleryModal(${index})" class="bg-slate-800 hover:bg-slate-700 text-purple-300 px-2 py-1 rounded text-[10px] transition">Lihat</button>
                                <button onclick="deleteGalleryPhoto('${p.id}', '${encodeURIComponent(p.judul)}')" class="bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-900 px-2 py-1 rounded text-[10px] transition">Hapus</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById("galleryAdminLoading").innerText = "Gagal memuat daftar galeri foto.";
            }
        }

        function openAdminGalleryModal(index) {
            const photo = (window.adminGalleryCache || [])[index];
            if (!photo) return;

            document.getElementById("modalAdminPhotoTitle").innerText = photo.judul || "Tanpa Judul";
            document.getElementById("modalAdminPhotoImg").src = getProxiedImageUrl(photo.url, 1000);
            document.getElementById("modalAdminPhotoMeta").innerText = `Kategori: ${photo.kategorial || '-'} • Momen: ${photo.moment || '-'} • ${photo.tanggal || '-'}`;
            document.getElementById("modalAdminDeleteBtn").setAttribute("onclick", `deleteGalleryPhoto('${photo.id}', '${encodeURIComponent(photo.judul)}')`);
            document.getElementById("adminGalleryModal").classList.remove("hidden");
        }

        function closeAdminGalleryModal(event) {
            if (!event || event.target.id === "adminGalleryModal" || event.target.tagName === "BUTTON") {
                document.getElementById("adminGalleryModal").classList.add("hidden");
            }
        }

        async function deleteGalleryPhoto(photoId, photoTitleEncoded) {
            const title = decodeURIComponent(photoTitleEncoded);
            if (!confirm(`Yakin ingin menghapus foto "${title}" dari galeri?`)) return;

            const admin = JSON.parse(sessionStorage.getItem("admin_gereja") || "{}");
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "deleteGalleryPhoto",
                        photo_id: photoId,
                        admin_id: admin.id || "ADMIN",
                        admin_nama: admin.nama || "Admin",
                        catatan_log: `Menghapus foto galeri: ${title}`
                    })
                });
                const result = await res.json();
                alert(result.message || "Foto berhasil dihapus.");
                closeAdminGalleryModal();
                fetchGalleryListForAdmin();
            } catch (err) {
                alert("Gagal menghapus foto: " + err);
            }
        }

        async function handleUploadGaleri(e) {
            e.preventDefault();
            const btn = document.getElementById("btnSubmitGaleri");
            const fileInput = document.getElementById("galeriFile");
            const file = fileInput.files[0];

            if (!file) {
                alert("Silakan pilih file gambar terlebih dahulu!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Mengunggah gambar ke imgBB...";

            try {
                const formData = new FormData();
                formData.append("image", file);

                const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const imgbbJson = await imgbbRes.json();

                if (!imgbbJson.success) {
                    throw new Error(imgbbJson.error?.message || "Gagal mengunggah ke server imgBB.");
                }

                // Normalisasi URL imgBB ke domain img.ibb.co.com agar tidak terblokir provider lokal
                let rawImageUrl = imgbbJson.data.url;
                let imageUrl = rawImageUrl.replace("://i.ibb.co/", "://i.ibb.co.com/");

                btn.innerText = "Menyimpan data ke Sheet Galeri...";

                const adminId = getSafeAdminId();
                const payload = {
                    action: "addGalleryPhoto",
                    admin_id: adminId,
                    judul_foto: document.getElementById("galeriJudul").value.trim(),
                    url_gambar: imageUrl,
                    kategoti: document.getElementById("galeriKategori").value,
                    moment: document.getElementById("galeriMoment").value,
                    tanggal: document.getElementById("galeriTanggal").value
                };

                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                alert(result.message || "Foto berhasil diunggah dan disimpan ke galeri!");
                document.getElementById("formUploadGaleri").reset();
                document.getElementById("galeriTanggal").valueAsDate = new Date();
                fetchGalleryListForAdmin();

            } catch (err) {
                alert("Terjadi kesalahan: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Unggah Foto & Simpan ke Galeri 🚀";
            }
        }

        async function loadSensusData() {
            const area = document.getElementById("adminContentArea");
            if (!area) return;
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data jemaat...</p>`;
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getAllUsers`);
                const result = await response.json();
                const users = result.users || [];
                if (users.length === 0) {
                    area.innerHTML = `<p class="text-center text-slate-500 text-sm py-10">Belum ada data jemaat terdaftar.</p>`;
                    return;
                }
                area.innerHTML = `
                    <div class="space-y-4 w-full">
                        <h3 class="font-bold text-sm">Daftar Sensus Jemaat (${users.length} Jiwa)</h3>
                        <div class="overflow-x-auto w-full">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-600">
                                        <th class="p-2.5">Nama</th>
                                        <th class="p-2.5">Ling / Rayon</th>
                                        <th class="p-2.5">No. WhatsApp</th>
                                        <th class="p-2.5 text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${users.map(u => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-2.5 font-bold">${u.nama_lengkap}</td>
                                            <td class="p-2.5">Ling. ${u.lingkungan || '-'}</td>
                                            <td class="p-2.5">${u.no_whatsapp || '-'}</td>
                                            <td class="p-2.5 text-center">${u.is_verified ? 'Terverifikasi' : 'Pending'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch(e) {
                area.innerHTML = `<p class="text-center text-rose-500 text-sm py-10">Gagal memuat data jemaat.</p>`;
            }
        }

        function adminLogout() {
            sessionStorage.removeItem("admin_gereja");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
