<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - JPO Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

    <!-- Container Admin -->
    <div id="adminApp" class="max-w-6xl mx-auto p-4 min-h-screen flex flex-col">
        
        <!-- HEADER ADMIN -->
        <header class="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center shadow-md mb-6">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg text-xs transition" title="Kembali ke Aplikasi Jemaat">← Jemaat</a>
                <div>
                    <h1 class="font-bold text-sm">Panel Admin & Tim Multimedia</h1>
                    <p id="adminInfo" class="text-[10px] text-slate-400">Silakan login</p>
                </div>
            </div>
            <button id="logoutBtn" onclick="adminLogout()" class="hidden bg-rose-600 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-rose-700 transition">Keluar</button>
        </header>

        <!-- KONTEN UTAMA ADMIN -->
        <main class="flex-1 flex flex-col">
            <!-- Konten dinamis dimuat di sini -->
        </main>

    </div>

    <script>
        // --- URL WEB APP GOOGLE SCRIPT ANDA ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLTEI5pSm4gjnBQHcqCwFMS7vcIzpWt6sfXtdjpEk1QlnndTlSA6nZYlQwfWFY_oLHzA/exec";

        document.addEventListener("DOMContentLoaded", () => {
            const savedAdmin = sessionStorage.getItem("admin_gereja");
            if (savedAdmin) {
                renderAdminDashboard(JSON.parse(savedAdmin));
            } else {
                renderAdminLogin();
            }
        });

        // --- 1. HALAMAN LOGIN ADMIN ---
        function renderAdminLogin() {
            const main = document.querySelector("main");
            main.innerHTML = `
                <div class="max-w-md w-full mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-10">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 text-center">Login Khusus Pengurus</h2>
                    <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Username Admin</label>
                            <input type="text" id="adminUser" required class="w-full p-3 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-900">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                            <input type="password" id="adminPass" required class="w-full p-3 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-900">
                        </div>
                        <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-lg font-semibold text-sm hover:bg-slate-800 transition">Masuk Panel</button>
                    </form>
                </div>
            `;
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById("adminUser").value;
            const password = document.getElementById("adminPass").value;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "adminLogin", username, password })
                });
                const result = await response.json();

                if (result.status === "success") {
                    sessionStorage.setItem("admin_gereja", JSON.stringify(result.admin));
                    renderAdminDashboard(result.admin);
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Kesalahan koneksi: " + err);
            }
        }

        // --- 2. DASHBOARD ADMIN ---
        function renderAdminDashboard(admin) {
            document.getElementById("adminInfo").innerText = `Login: ${admin.nama} (${admin.role})`;
            document.getElementById("logoutBtn").classList.remove("hidden");
            
            // Cek apakah Super Admin untuk menentukan jumlah kolom grid menu
            const isSuper = admin.role === "Super Admin";

            const main = document.querySelector("main");
            main.innerHTML = `
                <div class="space-y-6">
                    <!-- Menu Grid Admin (Dinamis berdasarkan Role) -->
                    <div class="grid grid-cols-2 md:grid-cols-${isSuper ? '6' : '5'} gap-3">
                        <button onclick="loadSensusData()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">👥 Data Jemaat</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Daftar sensus & verifikasi.</p>
                        </button>
                        <button onclick="loadPrayerData()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">🙏 Moderasi Doa</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Approval kotak doa.</p>
                        </button>
                        <button onclick="loadDonationAdmin()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">🎁 Kelola Donasi</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Verifikasi persembahan.</p>
                        </button>
                        <button onclick="loadEventForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📅 Kelola Kegiatan</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Tambah jadwal acara.</p>
                        </button>
                        <button onclick="loadNotificationAdmin()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📢 Push Notif</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Kelola popup peringatan.</p>
                        </button>
                        <!-- Tombol Menu di Dashboard Admin -->
                        <button onclick="showRenunganForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📖 Input Renungan Baru</h3>
                             <p class="text-[11px] text-slate-500 mt-1">Tambah ayat harian dan renungan.</p>
                        </button>
                        <!-- Tombol Menu Kirim Laporan Manual di Dashboard Admin -->
                        <button onclick="openManualReportMenu()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📤 Kirim Laporan Manual</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Export dan kirim file Excel sheet pilihan ke email.</p>
                        </button>
                        ${isSuper ? `
                        <button onclick="loadAdminManagement()" class="bg-purple-50 border border-purple-200 p-4 rounded-xl shadow-sm text-left hover:border-purple-400 transition">
                            <h3 class="font-bold text-xs text-purple-900">⚙️ Kelola Admin</h3>
                            <p class="text-[11px] text-purple-600 mt-1">Tambah/hapus operator.</p>
                        </button>` : ''}
                    </div>

                    <div id="adminContentArea" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm min-h-[350px]">
                        <p class="text-center text-slate-400 text-sm py-10">Silakan pilih menu di atas untuk mengelola data gereja.</p>
                    </div>
                </div>
            `;
            loadSensusData();
        }

// --- KELOLA ADMIN (KHUSUS SUPER ADMIN) ---
        async function loadAdminManagement() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat daftar pengurus...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdmins`);
                const result = await res.json();
                const admins = result.admins || [];

                area.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Form Tambah Admin / Pengurus Baru -->
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 h-fit">
                            <h3 class="font-bold text-xs text-slate-900 mb-2">➕ Tambah Pengurus Baru</h3>
                            <p class="text-[11px] text-slate-500 mb-4">Pilih hak akses role untuk akun pengurus yang akan dibuat.</p>
                            <form onsubmit="handleSaveNewAdmin(event)" class="space-y-3">
                                <div>
                                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                                    <input type="text" id="newAdminNama" required placeholder="Cth: Penatua John" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs outline-none">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Role / Hak Akses</label>
                                    <select id="newAdminRole" required class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs outline-none">
                                        <option value="Admin Operator">Admin Operator</option>
                                        <option value="Sekretariat">Sekretariat</option>
                                        <option value="Petugas Sensus">Petugas Sensus</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Username Login</label>
                                    <input type="text" id="newAdminUser" required placeholder="Cth: sekretariat1" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs outline-none">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Password</label>
                                    <input type="password" id="newAdminPass" required placeholder="******" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs outline-none">
                                </div>
                                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-lg text-xs font-semibold transition shadow-sm">Simpan Pengurus Baru</button>
                            </form>
                        </div>

                        <!-- Daftar Pengurus Aktif -->
                        <div class="md:col-span-2 space-y-3">
                            <h3 class="font-bold text-xs text-slate-900">Daftar Pengurus Gereja (${admins.length} Akun)</h3>
                            <div class="space-y-2">
                                ${admins.map(a => `
                                    <div class="bg-white border border-slate-200 p-3.5 rounded-xl flex justify-between items-center shadow-sm">
                                        <div>
                                            <div class="flex items-center gap-2">
                                                <h4 class="text-xs font-bold text-slate-900">${a.nama}</h4>
                                                <span class="text-[9px] px-2 py-0.5 rounded font-semibold ${a.role === 'Super Admin' ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-700'}">${a.role}</span>
                                            </div>
                                            <p class="text-[11px] text-slate-500 font-mono mt-0.5">Username: ${a.username}</p>
                                        </div>
                                        <div>
                                            ${a.role !== 'Super Admin' ? `
                                                <button onclick="deleteAdminItem('${a.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-2.5 py-1.5 rounded-lg text-[10px] font-semibold transition">Hapus Akses</button>
                                            ` : `<span class="text-[10px] text-slate-400 italic">Utama</span>`}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                area.innerHTML = `<p class="text-center text-rose-500 text-sm py-10">Gagal memuat daftar pengurus.</p>`;
            }
        }

        async function handleSaveNewAdmin(e) {
            e.preventDefault();
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            const data = {
                action: "addAdmin",
                admin_id: admin.id,
                nama: document.getElementById("newAdminNama").value,
                role: document.getElementById("newAdminRole").value, // Mengambil nilai dari dropdown role baru
                username: document.getElementById("newAdminUser").value,
                password: document.getElementById("newAdminPass").value
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                if (result.status === "success") {
                    loadAdminManagement(); // Refresh daftar
                }
            } catch (err) {
                alert("Gagal menambahkan pengurus: " + err);
            }
        }
        async function deleteAdminItem(targetId) {
            if (!confirm("Yakin ingin mencabut akses pengurus ini?")) return;
            
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "deleteAdmin", admin_id: admin.id, target_id: targetId })
                });
                const result = await res.json();
                alert(result.message);
                loadAdminManagement(); // Refresh daftar
            } catch (err) {
                alert("Gagal menghapus admin: " + err);
            }
        }

        // --- 3. AMBIL & TAMPILKAN DATA SENSUS JEMAAT (DENGAN USERNAME & VERIFIKASI) ---
        async function loadSensusData() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data jemaat...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAllUsers`);
                const result = await res.json();
                const users = result.users || [];

                if (users.length === 0) {
                    area.innerHTML = `<p class="text-center text-slate-500 text-sm py-10">Belum ada data jemaat terdaftar.</p>`;
                    return;
                }

                area.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="font-bold text-sm">Daftar Sensus Jemaat (${users.length} Jiwa)</h3>
                            <p class="text-xs text-slate-500">Data lengkap, username unik, dan verifikasi centang biru jemaat.</p>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="bg-slate-100 border-b border-slate-200 text-slate-600">
                                    <th class="p-2.5">Nama & Username Unik</th>
                                    <th class="p-2.5">Gender / Status</th>
                                    <th class="p-2.5">Ling / Rayon</th>
                                    <th class="p-2.5">No. WhatsApp</th>
                                    <th class="p-2.5">Alamat & Pekerjaan</th>
                                    <th class="p-2.5 text-center">Status Verifikasi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${users.map(u => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-2.5">
                                            <div class="font-bold text-slate-900">${u.nama_lengkap}</div>
                                            <div class="font-mono text-[11px] text-purple-600">${u.username || '-'}</div>
                                        </td>
                                        <td class="p-2.5">
                                            <div class="text-slate-700">${u.jenis_kelamin || '-'}</div>
                                            <div class="text-[10px] text-purple-700 font-medium">${u.status_pelayanan || 'Jemaat'}</div>
                                        </td>
                                        <td class="p-2.5">Ling. ${u.lingkungan || '-'} <br>Rayon ${u.rayon || '-'}</td>
                                        <td class="p-2.5">${u.no_whatsapp || '-'}</td>
                                        <td class="p-2.5 text-slate-500 text-[11px]">
                                            <div>${u.alamat || '<span class="italic text-amber-600">Belum diisi</span>'}</div>
                                            <div class="text-[10px] text-slate-400">${u.pekerjaan || ''}</div>
                                        </td>
                                        <td class="p-2.5 text-center">
                                            ${u.is_verified ? 
                                                `<span class="bg-blue-100 text-blue-700 font-semibold px-2 py-1 rounded text-[10px] inline-block">☑️ Terverifikasi</span>` : 
                                                `<button onclick="verifyUser('${u.id}')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-semibold px-2.5 py-1 rounded text-[10px] transition">Verifikasi</button>`
                                            }
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (err) {
                area.innerHTML = `<p class="text-center text-rose-500 text-sm py-10">Gagal memuat data jemaat: ${err}</p>`;
            }
        }

        async function verifyUser(userId) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "verifyUser", user_id: userId, admin_id: admin.id })
                });
                const result = await res.json();
                alert(result.message);
                loadSensusData(); 
            } catch (err) {
                alert("Gagal memverifikasi user: " + err);
            }
        }

        // --- 4. MODERASI & APPROVAL KOTAK DOA ---
        async function loadPrayerData() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data kotak doa...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdminPrayers`);
                const result = await res.json();
                const prayers = result.prayers || [];

                if (prayers.length === 0) {
                    area.innerHTML = `<p class="text-center text-slate-500 text-sm py-10">Belum ada pokok doa dari jemaat.</p>`;
                    return;
                }

                area.innerHTML = `
                    <h3 class="font-bold text-sm mb-1">Moderasi Kotak Doa Jemaat</h3>
                    <p class="text-xs text-slate-500 mb-4">Setujui pokok doa berstatus publik agar tampil otomatis di Dinding Doa jemaat.</p>
                    <div class="space-y-3">
                        ${prayers.map(p => `
                            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                <div class="space-y-1 flex-1">
                                    <div class="flex items-center gap-2">
                                        <span class="bg-purple-100 text-purple-800 text-[10px] px-2 py-0.5 rounded font-semibold">${p.kategori_doa}</span>
                                        <span class="bg-slate-200 text-slate-700 text-[10px] px-2 py-0.5 rounded">${p.status_privasi}</span>
                                        <span class="text-[10px] font-bold ${p.status_approval === 'Approved' ? 'text-emerald-600' : 'text-amber-600'}">Status: ${p.status_approval || 'Pending'}</span>
                                    </div>
                                    <p class="text-xs text-slate-800 font-medium italic">"${p.isi_doa}"</p>
                                    <p class="text-[10px] text-slate-500">Pengirim: <strong>${p.nama_pengirim}</strong> &bull; ${new Date(p.timestamp).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'})}</p>
                                </div>
                                <div>
                                    ${p.status_approval === 'Approved' ? `
                                        <button onclick="takedownPrayer('${p.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">Arsipkan</button>
                                    ` : p.status_privasi === 'Publik' ? `
                                        <button onclick="approvePrayer('${p.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">Setujui Tayang</button>
                                    ` : `<span class="text-[11px] text-slate-400 font-medium">Rahasia</span>`}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (err) {
                area.innerHTML = `<p class="text-center text-rose-500 text-sm py-10">Gagal memuat data doa.</p>`;
            }
        }

        async function approvePrayer(prayerId) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "approvePrayer", prayer_id: prayerId, admin_id: admin.id })
                });
                const result = await res.json();
                alert(result.message);
                loadPrayerData();
            } catch (err) {
                alert("Gagal menyetujui doa: " + err);
            }
        }

        async function takedownPrayer(prayerId) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "takedownPrayer", prayer_id: prayerId, admin_id: admin.id })
                });
                const result = await res.json();
                alert(result.message || "Doa berhasil diarsipkan.");
                loadPrayerData();
            } catch (err) {
                alert("Gagal melakukan takedown doa: " + err);
            }
        }

        // --- 5. KELOLA & APPROVAL DONASI ---
        async function loadDonationAdmin() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data donasi...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdminDonations`);
                const result = await res.json();
                const donations = result.donations || [];

                area.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="font-bold text-sm">Verifikasi & Pencatatan Donasi</h3>
                            <p class="text-xs text-slate-500">Kelola dan setujui persembahan kasih jemaat.</p>
                        </div>
                        <button onclick="loadDonationForm()" class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-semibold transition">➕ Input Donasi Manual</button>
                    </div>
                    <div class="space-y-3">
                        ${donations.length === 0 ? `<p class="text-center text-slate-500 text-sm py-6">Belum ada riwayat donasi.</p>` : 
                            donations.map(d => `
                                <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl flex justify-between items-center">
                                    <div class="space-y-0.5">
                                        <div class="flex items-center gap-2">
                                            <h4 class="text-xs font-bold text-slate-900">${d.nama_donatur}</h4>
                                            <span class="bg-slate-200 text-slate-700 text-[9px] px-2 py-0.5 rounded">${d.jenis_donasi || 'Transfer'}</span>
                                            <span class="text-[10px] font-bold ${d.status_approval === 'Approved' ? 'text-emerald-600' : 'text-amber-600'}">${d.status_approval || 'Pending'}</span>
                                        </div>
                                        <p class="text-[11px] text-slate-600">Peruntukan: <strong class="text-slate-800">${d.keterangan}</strong></p>
                                        <p class="text-[10px] text-slate-400">${new Date(d.tanggal).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'})}</p>
                                    </div>
                                    <div class="text-right flex flex-col items-end gap-1.5">
                                        <span class="text-xs font-bold text-emerald-600">${isNaN(d.nominal) ? d.nominal : 'Rp ' + Number(d.nominal).toLocaleString('id-ID')}</span>
                                        ${d.status_approval === 'Approved' ? `
                                            <button onclick="takedownDonation('${d.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded-lg text-[10px] font-semibold transition">Arsipkan</button>
                                        ` : `

// Fungsi untuk memuat data tabel stok
async function loadRenunganStock() {
    try {
        const res = await fetch(`${SCRIPT_URL}?action=getAdminRenunganList`);
        const result = await res.json();
        const list = result.renunganList || [];
        
        document.getElementById("renunganStockLoading").classList.add("hidden");
        document.getElementById("renunganTableWrapper").classList.remove("hidden");
        
        const tbody = document.getElementById("renunganTableBody");
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">Belum ada stok renungan. Silakan input di atas.</td></tr>`;
            return;
        }

        // Urutkan dari tanggal terbaru ke terlama
        list.reverse();

tbody.innerHTML = list.map(item => {
            // Ubah format YYYY-MM-DD menjadi Tanggal Indonesia (Cth: 26 Agustus 2026)
            let displayDate = item.tanggal;
            if (item.tanggal) {
                let parts = item.tanggal.split("-");
                if (parts.length === 3) {
                    let tahun = parts[0];
                    let bulanIndo = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                    let bulan = bulanIndo[parseInt(parts[1], 10)] || parts[1];
                    let hari = parseInt(parts[2], 10);
                    displayDate = `${hari} ${bulan} ${tahun}`;
                }
            }

            return `
                <tr class="hover:bg-slate-800/50 transition">
                    <td class="p-3 font-bold text-purple-400 whitespace-nowrap">${displayDate}</td>
                    <td class="p-3">
                        <div class="font-semibold text-slate-200">${item.ayat_harian}</div>
                        <div class="text-[10px] text-slate-400 italic truncate max-w-xs">"${item.isi_ayat}"</div>
                    </td>
                    <td class="p-3 text-slate-400 text-[11px] truncate max-w-xs">${item.renungan}</td>
                    <td class="p-3 text-center whitespace-nowrap">
                        <button onclick="makeActiveRenungan(${item.row_index}, '${displayDate}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-md">
                            🚀 Tayangkan
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    } catch (err) {
        document.getElementById("renunganStockLoading").innerText = "Gagal memuat daftar stok renungan.";
    }
}

    e.preventDefault();
    const email = document.getElementById("reportEmail").value;
    
    const checkboxes = document.querySelectorAll('input[name="sheetOption"]:checked');
    const selectedSheets = Array.from(checkboxes).map(cb => cb.value);

    if (selectedSheets.length === 0) {
        alert("Pilih minimal satu sheet untuk dikirim!");
        return;
    }

    const adminSession = JSON.parse(sessionStorage.getItem("admin_gereja") || "{}");
    const btn = document.getElementById("btnSendReport");
    
    btn.disabled = true;
    btn.innerText = "Sedang meracik file Excel & mengirim email...";

    try {
        const payload = {
            action: "sendManualReport",
            admin_id: adminSession.id || "SuperAdmin",
            email: email,
            sheets: selectedSheets
        };

        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        });
        const result = await res.json();

        alert(result.message);
        if (result.status === "success") {
            document.getElementById("reportEmail").value = "";
        }
    } catch (err) {
        alert("Terjadi kesalahan koneksi: " + err.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "Kirim Berkas Laporan Sekarang 🚀";
    }
}
    </script>
</body>
</html>
