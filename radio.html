<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Alone Radio Surabaya - Player</title>
    <style>
        /* Desain wadah agar pemutar bawaan tampak rapi di webapp Anda */
        .box-radio {
            font-family: Arial, sans-serif;
            background: #1e272e;
            padding: 20px;
            border-radius: 12px;
            max-width: 360px;
            margin: 40px auto;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .info-title {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .info-sub {
            color: #0be881;
            font-size: 12px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        /* Mengatur ukuran widget iframe resmi */
        .box-radio iframe {
            border: none;
            width: 100%;
            height: 140px; /* Tinggi pas untuk menampilkan tombol play & judul lagu */
            border-radius: 8px;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="box-radio">
    <div class="info-title">Grace Alone Radio</div>
    <div class="info-sub">LIVE STREAMING NONSTOP</div>
    
    <!-- IFRAME PLAYER RESMI DARI SERVER RADIO.CO -->
    <iframe src="https://radio.co" 
            allow="autoplay">
    </iframe>
</div>

</body>
</html>
