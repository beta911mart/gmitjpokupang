<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Rohani Nonstop - GMIT JPO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full mx-auto bg-slate-950 p-6 rounded-3xl border border-slate-800 shadow-2xl space-y-5 text-center">
        
        <!-- Tombol Kembali -->
        <div class="text-left">
            <a href="index.html" class="text-xs text-purple-400 font-semibold hover:underline">← Kembali ke Beranda</a>
        </div>

        <div class="w-20 h-20 bg-pink-950 border border-pink-800 text-pink-300 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
            📻
        </div>

        <div>
            <h2 class="font-bold text-base text-white">Radio Rohani Kristen 24 Jam</h2>
            <p class="text-xs text-slate-400 mt-1">Pujian & Firman Tuhan Nonstop</p>
        </div>

        <!-- Opsi 1: Pemutar Audio Internal yang Stabil -->
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
            <p class="text-[11px] text-slate-300 font-medium">Pemutar Siaran Utama:</p>
            <audio id="audioRadio" preload="none" class="w-full">
                <source src="https://phila.streamguys1.com/live" type="audio/mpeg">
                Browser Anda tidak mendukung audio.
            </audio>
            <button id="btnKontrol" onclick="togglePlay()" class="w-full bg-pink-600 hover:bg-pink-700 text-white py-3 rounded-xl font-semibold text-xs shadow-md transition">
                ▶ PUTAR SIARAN
            </button>
            <p id="statusText" class="text-[10px] text-slate-500">Tekan tombol untuk mendengarkan</p>
        </div>

        <hr class="border-slate-800">

        <!-- Opsi 2: Tautan Langsung ke Radio Kristen Pilihan (Solusi Paling Aman dari Pusing) -->
        <div class="space-y-2">
            <p class="text-[11px] text-slate-400">Atau pilih saluran streaming eksternal:</p>
            <a href="https://www.radiokristen.net/station_detail/13-Grace-Alone-Radio-Surabaya" target="_blank" class="block w-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-purple-300 py-2.5 px-4 rounded-xl text-xs font-semibold transition">
                🌐 Buka Grace Alone Radio Surabaya
            </a>
        </div>

    </div>

<script>
    const audio = document.getElementById('audioRadio');
    const btn = document.getElementById('btnKontrol');
    const statusText = document.getElementById('statusText');
    let isPlaying = false;

    function togglePlay() {
        if (!isPlaying) {
            btn.innerText = "MENYAMBUNGKAN...";
            statusText.innerText = "Menghubungkan ke server...";
            audio.load();
            
            audio.play().then(() => {
                isPlaying = true;
                btn.innerText = "⏸ HENTIKAN SIARAN";
                btn.style.backgroundColor = "#e11d48";
                statusText.innerText = "🟢 Sedang Memutar Live Streaming";
            }).catch(err => {
                console.error(err);
                statusText.innerText = "❌ Gagal memuat siaran langsung.";
                btn.innerText = "▶ PUTAR SIARAN";
                btn.style.backgroundColor = "#db2777";
                isPlaying = false;
            });
        } else {
            audio.pause();
            isPlaying = false;
            btn.innerText = "▶ PUTAR SIARAN";
            btn.style.backgroundColor = "#db2777";
            statusText.innerText = "Siaran dijeda.";
        }
    }
</script>

</body>
</html>
