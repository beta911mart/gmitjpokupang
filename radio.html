<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Rohani Nonstop</title>
</head>
<body>

<div style="font-family: Arial, sans-serif; background: #1e3c72; padding: 20px; border-radius: 12px; max-width: 300px; text-align: center; color: white; margin: 20px auto;">
    <h4>Radio Rohani Kristen</h4>
    <p style="font-size: 12px; color: #ced6e0;">Streaming Nonstop 24 Jam</p>
    
    <!-- MENGGUNAKAN SERVER STREAM DIRECT MP3 YANG ANTI-BLOKIR -->
    <audio id="audioRadio" src="https://heartline.co.id" preload="none" crossorigin="anonymous"></audio>
    
    <button id="btnKontrol" style="background-color: white; color: #1e3c72; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;">
        PUTAR SIARAN
    </button>
</div>

<script>
    const audio = document.getElementById('audioRadio');
    const btn = document.getElementById('btnKontrol');

    btn.addEventListener('click', () => {
        if (audio.paused) {
            btn.innerText = "MEMUAT...";
            audio.load(); 
            
            audio.play()
                .then(() => { 
                    btn.innerText = "BERHENTI"; 
                })
                .catch(err => {
                    console.error(err);
                    alert("Akses diblokir oleh peramban. Coba nonaktifkan AdBlock atau gunakan Google Chrome.");
                    btn.innerText = "PUTAR SIARAN";
                });
        } else {
            audio.pause();
            btn.innerText = "PUTAR SIARAN";
        }
    });
</script>

</body>
</html>
