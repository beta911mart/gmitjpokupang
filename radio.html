<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Alone Radio Surabaya - Player</title>
    <style>
        /* Desain wadah agar pemutar bawaan tampak rapi di webapp Anda */
        .box-radio {
            font-family: Arial, sans-serif;
            background: #1e272e;
            padding: 20px;
            border-radius: 12px;
            max-width: 360px;
            margin: 40px auto;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .info-title {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .info-sub {
            color: #0be881;
            font-size: 12px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div style="font-family: Arial, sans-serif; background: #1e3c72; padding: 20px; border-radius: 12px; max-width: 300px; text-align: center; color: white; margin: 20px auto;">
    <h4>Grace Alone Radio</h4>
    
    <!-- PERBAIKAN: Menggunakan URL IP stream murni berformat MP3 yang langsung mengeluarkan suara -->
    <audio id="audioRadio" src="https://radio.co" preload="none"></audio>
    
    <button id="btnKontrol" style="background-color: white; color: #1e3c72; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer;">
        PUTAR SIARAN
    </button>
</div>

<script>
    const audio = document.getElementById('audioRadio');
    const btn = document.getElementById('btnKontrol');

    // Menghindari blokir pemutaran otomatis dengan interaksi klik pengguna
    btn.addEventListener('click', () => {
        if (audio.paused) {
            // Muat ulang source agar mendapatkan pasokan stream audio terbaru (realtime)
            audio.load(); 
            audio.play()
                .then(() => { btn.innerText = "BERHENTI"; })
                .catch(err => alert("Gagal memuat suara, periksa jaringan Anda atau coba peramban lain."));
        } else {
            audio.pause();
            btn.innerText = "PUTAR SIARAN";
        }
    });
</script>

</body>
</html>
