<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Sekretariat - JPO Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

    <!-- Container Sekretariat -->
    <div id="adminApp" class="max-w-7xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col">
        
        <!-- HEADER SEKRETARIAT -->
        <header class="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center shadow-md mb-6">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="font-bold text-sm">Panel Admin Web/App JPO</h1>
                    <p id="adminInfo" class="text-[10px] text-slate-400">Silakan login</p>
                </div>
            </div>
            <button id="logoutBtn" onclick="adminLogout()" class="hidden bg-rose-600 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-rose-700 transition">Keluar</button>
        </header>

        <!-- KONTEN UTAMA SEKRETARIAT -->
        <main class="flex-1 flex flex-col">
            <!-- Konten dinamis dimuat di sini -->
        </main>

    </div>

    <script>
        // --- URL WEB APP GOOGLE SCRIPT ANDA ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLTEI5pSm4gjnBQHcqCwFMS7vcIzpWt6sfXtdjpEk1QlnndTlSA6nZYlQwfWFY_oLHzA/exec";

        document.addEventListener("DOMContentLoaded", () => {
            const savedAdmin = sessionStorage.getItem("admin_gereja");
            if (savedAdmin) {
                renderAdminDashboard(JSON.parse(savedAdmin));
            } else {
                renderAdminLogin();
            }
        });

        // --- 1. HALAMAN LOGIN SEKRETARIAT ---
        function renderAdminLogin() {
            const main = document.querySelector("main");
            main.innerHTML = `
                <div class="max-w-md w-full mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-10">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 text-center">Login Khusus Sekretariat</h2>
                    <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Username Sekretariat</label>
                            <input type="text" id="adminUser" required class="w-full p-3 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-900">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                            <input type="password" id="adminPass" required class="w-full p-3 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-900">
                        </div>
                        <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-lg font-semibold text-sm hover:bg-slate-800 transition">Masuk Panel</button>
                    </form>
                </div>
            `;
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById("adminUser").value;
            const password = document.getElementById("adminPass").value;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "adminLogin", username, password })
                });
                const result = await response.json();

                if (result.status === "success") {
                    const userRole = result.admin.role.toLowerCase();
                    if (userRole === "sekretariat" || userRole === "sekertariat") {
                        sessionStorage.setItem("admin_gereja", JSON.stringify(result.admin));
                        renderAdminDashboard(result.admin);
                    } else {
                        alert("Akses Ditolak: Halaman ini hanya diperuntukkan bagi role Sekretariat.");
                    }
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Kesalahan koneksi: " + err);
            }
        }

        // --- 2. DASHBOARD SEKRETARIAT ---
        function renderAdminDashboard(admin) {
            document.getElementById("adminInfo").innerText = `Login: ${admin.nama} (${admin.role})`;
            document.getElementById("logoutBtn").classList.remove("hidden");
            
            const main = document.querySelector("main");
            main.innerHTML = `
                <div class="space-y-6">
                    <!-- Menu Grid Sekretariat -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <button onclick="loadSensusData()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">👥 Data Jemaat</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Daftar sensus & verifikasi.</p>
                        </button>
                        <button onclick="loadPrayerData()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">🙏 Moderasi Doa</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Approval kotak doa.</p>
                        </button>
                        <button onclick="loadDonationAdmin()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">🎁 Kelola Donasi</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Verifikasi persembahan.</p>
                        </button>
                        <button onclick="loadEventForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📅 Kelola Kegiatan</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Tambah jadwal acara.</p>
                        </button>
                        
                        <!-- Menu Beralih ke Statistik -->
                        <button onclick="window.location.href='statistik.html'" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📊 Statistik</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Lihat demografi jemaat.</p>
                        </button>
                        
                        <button onclick="showRenunganForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 transition">
                            <h3 class="font-bold text-xs text-slate-900">📖 Input Renungan</h3>
                             <p class="text-[11px] text-slate-500 mt-1">Tambah ayat & renungan.</p>
                        </button>

                        <button onclick="loadSimpleBroadcastForm()" class="bg-purple-900 text-white p-4 rounded-xl border border-purple-800 shadow-sm text-left hover:bg-purple-800 transition">
                            <h3 class="font-bold text-xs">📢 Broadcast informasi</h3>
                            <p class="text-[11px] text-purple-300 mt-1">Kirim pesan siaran cepat ke jemaat.</p>
                        </button>
                        
                        <button onclick="loadActivityLogs()" class="bg-slate-900 text-white p-4 rounded-xl border border-slate-800 shadow-sm text-left hover:bg-slate-800 transition">
                            <h3 class="font-bold text-xs">📋 Log Aktivitas</h3>
                             <p class="text-[11px] text-slate-400 mt-1">Riwayat aksi sekretariat.</p>
                        </button>
                    </div>

                    <!-- Area Konten Dinamis -->
                    <div id="adminContentArea" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm min-h-[350px]">
                        <div class="text-center py-16 space-y-2">
                            <div class="text-3xl">👋</div>
                            <h3 class="font-bold text-sm text-slate-700">Selamat Datang, ${admin.nama}</h3>
                            <p class="text-xs text-slate-400 max-w-sm mx-auto">Silakan pilih salah satu menu di atas untuk mulai melihat atau mengelola data pelayanan gereja.</p>
                        </div>
                    </div>
                </div>
            `;
        }


        // --- 3. AMBIL & TAMPILKAN DATA SENSUS JEMAAT (VERIFIKASI) ---
        async function loadSensusData() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data jemaat...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAllUsers`);
                const result = await res.json();
                const users = result.users || [];

                if (users.length === 0) {
                    area.innerHTML = `<p class="text-center text-slate-500 text-sm py-10">Belum ada data jemaat terdaftar.</p>`;
                    return;
                }

                area.innerHTML = `
                    <div class="space-y-4">
                        <div>
                            <h3 class="font-bold text-sm">Daftar Sensus Jemaat (${users.length} Jiwa)</h3>
                            <p class="text-xs text-slate-500">Data lengkap, username unik, dan verifikasi centang biru jemaat.</p>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-600">
                                        <th class="p-2.5">Nama & Username Unik</th>
                                        <th class="p-2.5">Gender / Status</th>
                                        <th class="p-2.5">Ling / Rayon</th>
                                        <th class="p-2.5">No. WhatsApp</th>
                                        <th class="p-2.5">Alamat & Pekerjaan</th>
                                        <th class="p-2.5 text-center">Status Verifikasi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${users.map(u => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-2.5">
                                                <div class="font-bold text-slate-900">${u.nama_lengkap}</div>
                                                <div class="font-mono text-[11px] text-purple-600">${u.username || '-'}</div>
                                            </td>
                                            <td class="p-2.5">
                                                <div class="text-slate-700">${u.jenis_kelamin || '-'}</div>
                                                <div class="text-[10px] text-purple-700 font-medium">${u.status_pelayanan || 'Jemaat'}</div>
                                            </td>
                                            <td class="p-2.5">Ling. ${u.lingkungan || '-'} <br>Rayon ${u.rayon || '-'}</td>
                                            <td class="p-2.5">${u.no_whatsapp || '-'}</td>
                                            <td class="p-2.5 text-slate-500 text-[11px]">
                                                <div>${u.alamat || '<span class="italic text-amber-600">Belum diisi</span>'}</div>
                                                <div class="text-[10px] text-slate-400">${u.pekerjaan || ''}</div>
                                            </td>
                                            <td class="p-2.5 text-center">
                                                ${u.is_verified ? 
                                                    `<span class="bg-blue-100 text-blue-700 font-semibold px-2 py-1 rounded text-[10px] inline-block">☑️ Terverifikasi</span>` : 
                                                    `<button onclick="verifyUser('${u.id}', '${u.nama_lengkap}')" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-semibold px-2.5 py-1 rounded text-[10px] transition">Verifikasi</button>`
                                                }
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (err) {
                area.innerHTML = `<p class="text-center text-rose-500 text-sm py-10">Gagal memuat data jemaat: ${err}</p>`;
            }
        }

        async function verifyUser(userId, userNama) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "verifyUser", 
                        user_id: userId, 
                        admin_id: admin.id,
                        admin_nama: admin.nama,
                        catatan_log: `Memverifikasi centang biru untuk jemaat: ${userNama}`
                    })
                });
                const result = await res.json();
                alert(result.message);
                loadSensusData(); 
            } catch (err) {
                alert("Gagal memverifikasi user: " + err);
            }
        }

        // --- 4. MODERASI & APPROVAL KOTAK DOA ---
        async function loadPrayerData() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data kotak doa...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdminPrayers`);
                const result = await res.json();
                const prayers = result.prayers || [];

                if (prayers.length === 0) {
                    area.innerHTML = `<p class="text-center text-slate-500 text-sm py-10">Belum ada pokok doa dari jemaat.</p>`;
                    return;
                }

                area.innerHTML = `
                    <div class="space-y-4">
                        <div>
                            <h3 class="font-bold text-sm mb-1">Moderasi Kotak Doa Jemaat</h3>
                            <p class="text-xs text-slate-500">Setujui pokok doa berstatus publik agar tampil otomatis di Dinding Doa jemaat.</p>
                        </div>
                        <div class="space-y-3">
                            ${prayers.map(p => `
                                <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                    <div class="space-y-1 flex-1">
                                        <div class="flex items-center gap-2">
                                            <span class="bg-purple-100 text-purple-800 text-[10px] px-2 py-0.5 rounded font-semibold">${p.kategori_doa}</span>
                                            <span class="bg-slate-200 text-slate-700 text-[10px] px-2 py-0.5 rounded">${p.status_privasi}</span>
                                            <span class="text-[10px] font-bold ${p.status_approval === 'Approved' ? 'text-emerald-600' : 'text-amber-600'}">Status: ${p.status_approval || 'Pending'}</span>
                                        </div>
                                        <p class="text-xs text-slate-800 font-medium italic">"${p.isi_doa}"</p>
                                        <p class="text-[10px] text-slate-500">Pengirim: <strong>${p.nama_pengirim}</strong> &bull; ${new Date(p.timestamp).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'})}</p>
                                    </div>
                                    <div>
                                        ${p.status_approval === 'Approved' ? `
                                            <button onclick="takedownPrayer('${p.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">Arsipkan</button>
                                        ` : p.status_privasi === 'Publik' ? `
                                            <button onclick="approvePrayer('${p.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">Setujui Tayang</button>
                                        ` : `<span class="text-[11px] text-slate-400 font-medium">Rahasia</span>`}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (err) {
                area.innerHTML = `<p class="text-center text-rose-500 text-sm py-10">Gagal memuat data doa.</p>`;
            }
        }

        async function approvePrayer(prayerId) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "approvePrayer", 
                        prayer_id: prayerId, 
                        admin_id: admin.id,
                        admin_nama: admin.nama,
                        catatan_log: "Menyetujui (Approve) kotak doa tayang ke publik."
                    })
                });
                const result = await res.json();
                alert(result.message);
                loadPrayerData();
            } catch (err) {
                alert("Gagal menyetujui doa: " + err);
            }
        }

        async function takedownPrayer(prayerId) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "takedownPrayer", 
                        prayer_id: prayerId, 
                        admin_id: admin.id,
                        admin_nama: admin.nama,
                        catatan_log: "Menurunkan (Takedown) kotak doa dari publik."
                    })
                });
                const result = await res.json();
                alert(result.message || "Doa berhasil diarsipkan.");
                loadPrayerData();
            } catch (err) {
                alert("Gagal melakukan takedown doa: " + err);
            }
        }

        // --- 5. KELOLA & APPROVAL DONASI ---
        async function loadDonationAdmin() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data donasi...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdminDonations`);
                const result = await res.json();
                const donations = result.donations || [];

                area.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-sm">Verifikasi & Pencatatan Donasi</h3>
                                <p class="text-xs text-slate-500">Kelola dan setujui persembahan kasih jemaat.</p>
                            </div>
                            <button onclick="loadDonationForm()" class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-semibold transition">➕ Input Donasi Manual</button>
                        </div>
                        <div class="space-y-3">
                            ${donations.length === 0 ? `<p class="text-center text-slate-500 text-sm py-6">Belum ada riwayat donasi.</p>` : 
                                donations.map(d => `
                                    <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl flex justify-between items-center">
                                        <div class="space-y-0.5">
                                            <div class="flex items-center gap-2">
                                                <h4 class="text-xs font-bold text-slate-900">${d.nama_donatur}</h4>
                                                <span class="bg-slate-200 text-slate-700 text-[9px] px-2 py-0.5 rounded">${d.jenis_donasi || 'Transfer'}</span>
                                                <span class="text-[10px] font-bold ${d.status_approval === 'Approved' ? 'text-emerald-600' : 'text-amber-600'}">${d.status_approval || 'Pending'}</span>
                                            </div>
                                            <p class="text-[11px] text-slate-600">Peruntukan: <strong class="text-slate-800">${d.keterangan}</strong></p>
                                            <p class="text-[10px] text-slate-400">${new Date(d.tanggal).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'})}</p>
                                        </div>
                                        <div class="text-right flex flex-col items-end gap-1.5">
                                            <span class="text-xs font-bold text-emerald-600">${isNaN(d.nominal) ? d.nominal : 'Rp ' + Number(d.nominal).toLocaleString('id-ID')}</span>
                                            ${d.status_approval === 'Approved' ? `
                                                <button onclick="takedownDonation('${d.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded-lg text-[10px] font-semibold transition">Arsipkan</button>
                                            ` : `
                                                <button onclick="approveDonation('${d.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg text-[10px] font-semibold transition">Setujui</button>
                                            `}
                                        </div>
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                `;
            } catch (err) {
                area.innerHTML = `<p class="text-center text-rose-500 text-sm py-10">Gagal memuat data donasi.</p>`;
            }
        }

        async function approveDonation(donationId) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "approveDonation", 
                        donation_id: donationId, 
                        admin_id: admin.id,
                        admin_nama: admin.nama,
                        catatan_log: "Menyetujui (Approve) data donasi masuk."
                    })
                });
                const result = await res.json();
                alert(result.message);
                loadDonationAdmin();
            } catch (err) {
                alert("Gagal menyetujui donasi: " + err);
            }
        }

        async function takedownDonation(donationId) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "takedownDonation", 
                        donation_id: donationId, 
                        admin_id: admin.id,
                        admin_nama: admin.nama,
                        catatan_log: "Menurunkan (Takedown) data donasi."
                    })
                });
                const result = await res.json();
                alert(result.message || "Donasi berhasil diarsipkan.");
                loadDonationAdmin();
            } catch (err) {
                alert("Gagal menurunkan donasi: " + err);
            }
        }

        function loadDonationForm() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `
                <div class="space-y-4">
                    <button onclick="loadDonationAdmin()" class="text-xs text-purple-600 font-semibold block">← Kembali ke Daftar Donasi</button>
                    <div>
                        <h3 class="font-bold text-sm text-slate-900">Pencatatan Donasi Manual oleh Pengurus</h3>
                        <p class="text-xs text-slate-500">Catat persembahan kasih secara langsung dari sekretariat.</p>
                    </div>
                    <form onsubmit="handleSaveDonation(event)" class="space-y-3 max-w-lg">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Donatur</label>
                            <input type="text" id="donNama" required placeholder="Cth: Bpk. Budi / Anonim" class="w-full p-3 border border-slate-300 rounded-xl text-sm outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Donasi</label>
                            <select id="donJenis" class="w-full p-3 border border-slate-300 rounded-xl text-sm outline-none bg-white">
                                <option value="Transfer">Transfer</option>
                                <option value="Setor Tunai">Setor Tunai</option>
                                <option value="Sumbangan Barang">Sumbangan Barang</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Jumlah / Nominal (Angka atau Deskripsi Barang)</label>
                            <input type="text" id="donNominal" required placeholder="Cth: 250000 atau 5 Sak Semen" class="w-full p-3 border border-slate-300 rounded-xl text-sm outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Keterangan / Peruntukan</label>
                            <input type="text" id="donKet" required placeholder="Cth: Pembangunan Gedung / Diakonia" class="w-full p-3 border border-slate-300 rounded-xl text-sm outline-none">
                        </div>
                        <button type="submit" class="bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-slate-800 transition">Simpan & Langsung Setujui Donasi</button>
                    </form>
                </div>
            `;
        }

        async function handleSaveDonation(e) {
            e.preventDefault();
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            const data = {
                action: "addDonation",
                admin_id: admin.id,
                admin_nama: admin.nama,
                catatan_log: "Input manual donasi baru & approve",
                nama_donatur: document.getElementById("donNama").value,
                jenis_donasi: document.getElementById("donJenis").value,
                nominal: document.getElementById("donNominal").value,
                keterangan: document.getElementById("donKet").value,
                tanggal: new Date()
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                loadDonationAdmin();
            } catch (err) {
                alert("Gagal menyimpan data donasi: " + err);

        async function handleSaveEvent(e) {

                lokasi: document.getElementById("evLokasi").value,
                keterangan: document.getElementById("evKet").value
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                loadEventForm();
            } catch (err) {
                alert("Gagal menyimpan kegiatan: " + err);

        // --- 7. INPUT RENUNGAN & AYAT EMAS ---
        async function showRenunganForm() {

            contentArea.innerHTML = `

                                <textarea id="inputIsiAyat" rows="3" placeholder="Tuliskan ayat lengkap di sini..." required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:border-purple-500 focus:outline-none"></textarea>

                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Isi Pesan Renungan</label>
                                <textarea id="inputRenungan" rows="6" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:border-purple-500 focus:outline-none" placeholder="Baris 1: Ketik Judul Renungan
Ketik isi paragraf renungan di baris-baris tengah...
Baris Terakhir: Ketik Quote / Kutipan penutup"></textarea>
                                <div class="mt-1.5 p-2 bg-purple-950/30 border border-purple-900/40 rounded-lg text-[11px] text-purple-300 space-y-0.5">
                                    <p class="font-bold">⚠️ Perhatian Format Pengetikan:</p>
                                    <p>• <b>Baris pertama</b> otomatis akan dibaca dan dicetak sebagai <b>JUDUL RENUNGAN</b>.</p>
                                    <p>• <b>Baris terakhir</b> otomatis akan dibaca dan dicetak sebagai <b>QUOTE RENUNGAN</b> (Miring).</p>
                                </div>
                            </div>
                           <button type="submit" id="btnSubmitRenungan" class="w-full bg-purple-600 hover:bg-purple-700 text-white text-sm font-bold py-2.5 rounded-xl transition shadow-lg shadow-purple-600/30">

                        </form>
                    </div>
     
                    <!-- BAGIAN 2: TABEL STOK & PILIH TANGGAL TAYANG -->
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
                        <h3 class="font-bold text-sm text-slate-100 mb-1">Stok Arsip Renungan & Pilih Tanggal Tayang</h3>
                        <p class="text-xs text-slate-400 mb-4">Pilih salah satu tanggal di bawah ini untuk ditayangkan atau diedit ulang.</p>

                                    <tr class="bg-slate-950 border-b border-slate-800 text-slate-400">

                                        <th class="p-3">Ayat Emas</th>
                                        <th class="p-3">Pratinjau Renungan</th>

                                </tbody>
                            </table>
                       </div>
                    </div>
                </div>
            `;
            
            document.getElementById("inputTanggal").valueAsDate = new Date();
            loadRenunganStock();
        }
      
        async function loadRenunganStock() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdminRenunganList`);
                const result = await res.json();
                const list = result.renunganList || [];
                
                window.renunganCacheList = list;
                
                document.getElementById("renunganStockLoading").classList.add("hidden");
                document.getElementById("renunganTableWrapper").classList.remove("hidden");
                
                const tbody = document.getElementById("renunganTableBody");
                if (list.length === 0) {
                     tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">Belum ada stok renungan. Silakan input di atas.</td></tr>`;
                     return;
                }
      
                let reversedList = [...list].reverse();
      
                tbody.innerHTML = reversedList.map(item => {
                     let displayDate = item.tanggal;
                     if (item.tanggal) {
                         let parts = item.tanggal.split("-");
                         if (parts.length === 3) {
                             let tahun = parts[0];
                             let bulanIndo = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
                             let bulan = bulanIndo[parseInt(parts[1], 10)] || parts[1];
                             let hari = parseInt(parts[2], 10);
                             displayDate = `${hari} ${bulan} ${tahun}`;
                         }
                     }
      
                     return `
                         <tr class="hover:bg-slate-800/50 transition">
                             <td class="p-3 font-bold text-purple-400 whitespace-nowrap">${displayDate}</td>
                             <td class="p-3">
                                 <div class="font-semibold text-slate-200">${item.ayat_harian}</div>
                                 <div class="text-[10px] text-slate-400 italic truncate max-w-xs">"${item.isi_ayat}"</div>
                             </td>
                             <td class="p-3 text-slate-400 text-[11px] truncate max-w-xs">${item.renungan}</td>
                             <td class="p-3 text-center whitespace-nowrap space-x-1">
                                 <button onclick="prepareEditRenungan(${item.row_index})" class="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition shadow-md" title="Muat ulang ke form input">
                                     ✏️ Edit
                                 </button>
                                 <button onclick="makeActiveRenungan(${item.row_index}, '${displayDate}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-md">
                                     🚀 Tayangkan
                                 </button>
                             </td>
                         </tr>
                     `;
                }).join('');
            } catch (err) {
                document.getElementById("renunganStockLoading").innerText = "Gagal memuat daftar stok renungan.";
            }
        }
      
        function prepareEditRenungan(rowIndex) {
            const target = (window.renunganCacheList || []).find(r => r.row_index === rowIndex);
            if (!target) {
                alert("Data renungan tidak ditemukan di cache.");
                return;
            }

            document.getElementById("editRowIndex").value = target.row_index;
            document.getElementById("inputTanggal").value = target.tanggal || "";
            document.getElementById("inputAyatHarian").value = target.ayat_harian || "";
            document.getElementById("inputIsiAyat").value = target.isi_ayat || "";
            document.getElementById("inputRenungan").value = target.renungan || "";

            document.getElementById("formRenunganTitle").innerText = "Edit / Perbarui Stok Renungan";
            document.getElementById("formRenunganSubtitle").innerText = `Sedang mengedit baris data ke-${rowIndex}. Klik Simpan untuk memperbarui.`;
            document.getElementById("btnSubmitRenungan").innerText = "Perbarui Stok Renungan";
            document.getElementById("btnCancelEdit").classList.remove("hidden");

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetRenunganForm() {
            document.getElementById("formAddRenungan").reset();
            document.getElementById("editRowIndex").value = "";
            document.getElementById("inputTanggal").valueAsDate = new Date();
            
            document.getElementById("formRenunganTitle").innerText = "Input Renungan & Ayat Emas Baru";
            document.getElementById("formRenunganSubtitle").innerText = "Tambahkan stok renungan baru ke dalam database.";
            document.getElementById("btnSubmitRenungan").innerText = "Simpan ke Stok Renungan";
            document.getElementById("btnCancelEdit").classList.add("hidden");
        }
      
        async function makeActiveRenungan(rowIndex, tanggal) {
            if (!confirm(`Yakin ingin menayangkan renungan untuk tanggal ${tanggal} ke aplikasi jemaat?`)) return;
      
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                     method: "POST",
                     body: JSON.stringify({
                         action: "setActiveRenungan",
                         admin_id: admin ? admin.id : "ADMIN",
                         admin_nama: admin ? admin.nama : "Admin",
                         catatan_log: `Menayangkan renungan untuk tanggal ${tanggal}`,
                         row_index: rowIndex
                     })
                });
                const result = await res.json();
                alert(result.message);
                loadRenunganStock();
            } catch (err) {
                alert("Gagal mengubah status tayang: " + err);
            }
        }
      
        async function submitNewRenungan(event) {
            event.preventDefault();
            const btn = document.getElementById("btnSubmitRenungan");
            const originalBtnText = btn.innerText;
            btn.innerText = "Menyimpan...";
            btn.disabled = true;
      
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            const editIndex = document.getElementById("editRowIndex").value;
            
            const payload = {
                action: "addRenungan",
                admin_id: admin ? admin.id : "ADMIN",
                admin_nama: admin ? admin.nama : "Admin",
                catatan_log: editIndex ? `Memperbarui stok renungan baris ${editIndex}` : "Input renungan dan ayat emas baru",
                tanggal: document.getElementById("inputTanggal").value,
                ayat_harian: document.getElementById("inputAyatHarian").value,
                isi_ayat: document.getElementById("inputIsiAyat").value,
                renungan: document.getElementById("inputRenungan").value
            };
      
            try {
                let res = await fetch(SCRIPT_URL, {
                     method: "POST",
                     body: JSON.stringify(payload)
                });
                let json = await res.json();
                alert(json.message || "Renungan berhasil disimpan ke stok!");
                
                resetRenunganForm();
                loadRenunganStock();
            } catch (err) {
                alert("Gagal mengirim data: " + err);
            } finally {
                btn.innerText = originalBtnText;
                btn.disabled = false;
            }
        }
         
        // --- 8. LOG AKTIVITAS ---

            const area = document.getElementById("adminContentArea");

            try {

                if (logs.length === 0) {
                    area.innerHTML = `<p class="text-center text-slate-500 text-sm py-10">Belum ada riwayat catatan log aktivitas.</p>`;
                    return;

                        <div class="overflow-x-auto bg-slate-50 border border-slate-200 rounded-xl max-h-[500px] overflow-y-auto">

                                            <td class="p-3 font-semibold text-slate-800">${l.admin_nama || '-'}</td>

                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (err) {
                area.innerHTML = `
                    <div class="text-center py-10 space-y-2">
                        <p class="text-rose-500 text-sm font-semibold">Gagal memuat log aktivitas.</p>
                        <p class="text-xs text-slate-400">Pastikan endpoint <code class="bg-slate-200 px-1 rounded">getActivityLogs</code> sudah ditambahkan pada Google Apps Script Anda.</p>
                    </div>
                `;

        // --- 9. LOGOUT ---
        function adminLogout() {
            sessionStorage.removeItem("admin_gereja");
            window.location.reload();
        }
        // --- 10. MESS BROADCAST SEDERHANA (TARGET GLOBAL / SEKRETARIAT) ---
        function loadSimpleBroadcastForm() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `
                <div class="space-y-4 max-w-xl">
                    <div>
                        <h3 class="font-bold text-sm text-slate-900">Kirim Mess Broadcast</h3>
                        <p class="text-xs text-slate-500">Pesan siaran langsung dikirim ke seluruh jemaat secara global.</p>
                    </div>

                    <div class="bg-amber-50 border border-amber-200 p-3.5 rounded-xl text-xs text-amber-800 space-y-1">
                        <p class="font-bold">ℹ️ Informasi Sistem:</p>
                        <p>• Kategori Target: <b>Global (Semua Jemaat)</b></p>
                        <p>• Pengirim / Pilihan Cepat: <b>Sekretariat</b></p>
                    </div>

                    <form onsubmit="handleSendSimpleBroadcast(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Ketik Pesan Broadcast</label>
                            <textarea id="broadcastMessage" rows="5" required placeholder="Tuliskan isi pengumuman atau pesan siaran di sini..." class="w-full p-3 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-slate-900"></textarea>
                        </div>
                        <button type="submit" id="btnSendBroadcast" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-semibold text-xs transition shadow-md">
                            🚀 Kirim Broadcast Sekarang
                        </button>
                    </form>
                </div>
            `;
        }

        async function handleSendSimpleBroadcast(e) {
            e.preventDefault();
            const btn = document.getElementById("btnSendBroadcast");
            const pesan = document.getElementById("broadcastMessage").value.trim();
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));

            if (!pesan) return alert("Pesan tidak boleh kosong!");

            btn.disabled = true;
            btn.innerText = "Mengirim Broadcast...";

            // Payload disesuaikan dengan parameter fungsi sendBroadcast(data) di backend
            const payload = {
                action: "sendBroadcast",
                target_type: "global",       // Sesuai dengan backend: targetType = data.target_type
                category: "Sekretariat",     // Sesuai dengan backend: category = data.category
                message: pesan,              // Sesuai dengan backend: message = data.message
                visibility: "Global",
                admin_id: admin ? admin.id : "SEKRETARIAT"
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                
                alert(result.message || "Mess Broadcast berhasil dikirim!");
                document.getElementById("broadcastMessage").value = "";
            } catch (err) {
                alert("Gagal mengirim broadcast: " + err);
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 Kirim Broadcast Sekarang";
            }
        }
    </script>
