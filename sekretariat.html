<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Sekretariat - JPO Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulseRed {
            0%, 100% { background-color: rgb(239 68 68); color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.8); }
            50% { background-color: rgb(185 28 28); color: white; box-shadow: 0 0 5px rgba(185, 28, 28, 0.4); }
        }
        .animate-blink-red {
            animation: pulseRed 1s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">

    <!-- Container Sekretariat -->
    <div id="adminApp" class="max-w-7xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col">
        
        <!-- HEADER SEKRETARIAT -->
        <header class="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center shadow-md mb-6">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="font-bold text-sm">Panel Admin Web/App JPO</h1>
                    <p id="adminInfo" class="text-[10px] text-slate-400">Silakan login</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="audioStatusBadge" class="hidden text-[10px] bg-emerald-800 text-emerald-100 px-2 py-1 rounded-md font-medium">🔊 Notifikasi Audio Aktif</div>
                <button id="logoutBtn" onclick="adminLogout()" class="hidden bg-rose-600 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-rose-700 transition">Keluar</button>
            </div>
        </header>

        <!-- KONTEN UTAMA SEKRETARIAT -->
        <main class="flex-1 flex flex-col">
            <!-- Konten dinamis dimuat di sini -->
        </main>
    </div>

    <!-- AUDIO NOTIFIKASI DI-EMBED SECARA PROGRAMATIK -->
    <audio id="notifAudio" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- URL WEB APP GOOGLE SCRIPT ANDA ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLTEI5pSm4gjnBQHcqCwFMS7vcIzpWt6sfXtdjpEk1QlnndTlSA6nZYlQwfWFY_oLHzA/exec";
        
        let allJemaatCache = []; // Tambahkan ini untuk menyimpan cache daftar jemaat
        let lastPrayerCount = null;
        let lastDonationCount = null;
        let pollInterval = null;
        let audioUnlocked = false;

        document.addEventListener("click", () => {
            if (!audioUnlocked) {
                const audio = document.getElementById("notifAudio");
                if (audio) {
                    audio.play().then(() => {
                        audio.pause();
                        audio.currentTime = 0;
                        audioUnlocked = true;
                        const badge = document.getElementById("audioStatusBadge");
                        if (badge) badge.classList.remove("hidden");
                    }).catch(e => {});
                }
            }
        }, { once: true });

        document.addEventListener("DOMContentLoaded", () => {
            const sessionData = sessionStorage.getItem("user_gereja") || localStorage.getItem("user_gereja");
            
            if (sessionData) {
                try {
                    const user = JSON.parse(sessionData);
                    const role = (user.role || user.status_pelayanan || user.adminRole || "").toLowerCase();
                    
                    if (user.isAdmin || role.includes("sekretariat") || role.includes("sekertariat") || role.includes("super")) {
                        const adminObj = {
                            id: user.id,
                            nama: user.nama_lengkap || user.nama,
                            role: user.adminRole || user.role || "Sekretariat"
                        };
                        renderAdminDashboard(adminObj);
                        startRealtimePolling();
                        return;
                    }
                } catch (e) {
                    console.error("Gagal parse data sesi:", e);
                }
            }
            
            renderAdminLogin();
        });

        // --- 1. HALAMAN LOGIN SEKRETARIAT ---
        function renderAdminLogin() {
            const main = document.querySelector("main");
            main.innerHTML = `
                <div class="max-w-md w-full mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-10">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 text-center">Login Khusus Sekretariat</h2>
                    <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Username Sekretariat</label>
                            <input type="text" id="adminUser" required class="w-full p-3 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-900">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                            <input type="password" id="adminPass" required class="w-full p-3 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-900">
                        </div>
                        <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-lg font-semibold text-sm hover:bg-slate-800 transition">Masuk Panel</button>
                    </form>
                </div>
            `;
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById("adminUser").value;
            const password = document.getElementById("adminPass").value;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "adminLogin", username, password })
                });
                const result = await response.json();

                if (result.status === "success") {
                    const userRole = result.admin.role.toLowerCase();
                    if (userRole === "sekretariat" || userRole === "sekertariat") {
                        sessionStorage.setItem("admin_gereja", JSON.stringify(result.admin));
                        renderAdminDashboard(result.admin);
                        startRealtimePolling();
                    } else {
                        alert("Akses Ditolak: Halaman ini hanya diperuntukkan bagi role Sekretariat.");
                    }
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Kesalahan koneksi: " + err);
            }
        }

        // --- 2. DASHBOARD SEKRETARIAT ---
        function renderAdminDashboard(admin) {
            document.getElementById("adminInfo").innerText = `Login: ${admin.nama} (${admin.role})`;
            document.getElementById("logoutBtn").classList.remove("hidden");
            
            const main = document.querySelector("main");
            main.innerHTML = `
                <div class="space-y-6">
                    <!-- Menu Grid Sekretariat -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <button onclick="loadSensusData()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
                            <h3 class="font-bold text-xs text-slate-900">👥 Data Jemaat</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Daftar sensus & verifikasi.</p>
                        </button>
                        
                        <button id="btnNavPrayer" onclick="loadPrayerData(); clearPrayerBlink();" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
                            <h3 class="font-bold text-xs text-slate-900">🙏 Moderasi Doa</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Approval kotak doa.</p>
                        </button>
                        
                        <button id="btnNavDonation" onclick="loadDonationAdmin(); clearDonationBlink();" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
                            <h3 class="font-bold text-xs text-slate-900">🎁 Kelola Donasi</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Verifikasi persembahan.</p>
                        </button>

                        <button onclick="loadEventForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
                            <h3 class="font-bold text-xs text-slate-900">📅 Kelola Kegiatan</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Tambah jadwal acara.</p>
                        </button>
                        
                        <button onclick="window.location.href='statistik.html'" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
                            <h3 class="font-bold text-xs text-slate-900">📊 Statistik</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Lihat demografi jemaat.</p>
                        </button>
                        
                        <button onclick="showRenunganForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
                            <h3 class="font-bold text-xs text-slate-900">📖 Kelola Renungan</h3>
                             <p class="text-[11px] text-slate-500 mt-1">Tambah ayat & renungan.</p>
                        </button>

                        <button onclick="loadSimpleBroadcastForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
                            <h3 class="font-bold text-xs text-slate-900">📢 Broadcast Informasi</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Kirim pesan siaran cepat ke jemaat.</p>
                        </button>

                        <button onclick="loadUploadDokumenForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
                            <h3 class="font-bold text-xs text-slate-900">📤 Kelola Warta/Liturgi/Berkas</h3>
                            <p class="text-[11px] text-slate-500 mt-1">Update file PDF (Link tetap sama).</p>
                        </button>

	<button onclick="loadRosterForm()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
	    <h3 class="font-bold text-xs text-slate-900">📋 Input Roster</h3>
	    <p class="text-[11px] text-slate-500 mt-1">Jadwal tugas pelayanan.</p>
	</button>

                        <button onclick="loadActivityLogs()" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-left hover:border-slate-400 hover:bg-slate-50 transition">
                            <h3 class="font-bold text-xs text-slate-900">📋 Log Aktivitas Pengurus</h3>
                             <p class="text-[11px] text-slate-500 mt-1">Riwayat aksi sekretariat dan pengurus.</p>
                        </button>
                    </div>

                    <!-- Area Konten Dinamis -->
                    <div id="adminContentArea" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm w-full min-h-[350px]">
                        <div class="text-center py-16 space-y-2">
                            <div class="text-3xl">👋</div>
                            <h3 class="font-bold text-sm text-slate-700">Selamat Datang, ${admin.nama}</h3>
                            <p class="text-xs text-slate-400 max-w-sm mx-auto">Silakan pilih salah satu menu di atas untuk mulai melihat atau mengelola data pelayanan gereja.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- REAL-TIME POLLING & AUDIO ALERTS ---
        function startRealtimePolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(checkNewPostings, 15000);
        }

        async function checkNewPostings() {
            try {
                const resPrayer = await fetch(`${SCRIPT_URL}?action=getAdminPrayers`);
                const jsonPrayer = await resPrayer.json();
                const prayers = jsonPrayer.prayers || [];
                
                if (lastPrayerCount !== null && prayers.length > lastPrayerCount) {
                    triggerNewPostAlert("🙏 Ada Pokok Doa Baru dari Jemaat!", "btnNavPrayer");
                }
                lastPrayerCount = prayers.length;

                const resDonation = await fetch(`${SCRIPT_URL}?action=getAdminDonations`);
                const jsonDonation = await resDonation.json();
                const donations = jsonDonation.donations || [];

                if (lastDonationCount !== null && donations.length > lastDonationCount) {
                    triggerNewPostAlert("🎁 Ada Konfirmasi Donasi Baru!", "btnNavDonation");
                }
                lastDonationCount = donations.length;

            } catch (err) {
                console.log("Gagal melakukan background polling:", err);
            }
        }

        function triggerNewPostAlert(message, buttonId) {
            const audio = document.getElementById("notifAudio");
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio play blocked:", e));
            }

            const btn = document.getElementById(buttonId);
            if (btn) btn.classList.add("animate-blink-red");

            showToastBanner(message);
        }

        function showToastBanner(text) {
            let existing = document.getElementById("realtimeToastBanner");
            if (existing) existing.remove();

            const toast = document.createElement("div");
            toast.id = "realtimeToastBanner";
            toast.className = "fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 z-50 text-xs flex items-center gap-3 animate-bounce";
            toast.innerHTML = `
                <span>🔔</span>
                <div>
                    <p class="font-bold text-amber-400">Notifikasi Sekretariat</p>
                    <p class="text-[11px] text-slate-200">${text}</p>
                </div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => { if (toast) toast.remove(); }, 6000);
        }

        function clearPrayerBlink() {
            const btn = document.getElementById("btnNavPrayer");
            if (btn) btn.classList.remove("animate-blink-red");
        }

        function clearDonationBlink() {
            const btn = document.getElementById("btnNavDonation");
            if (btn) btn.classList.remove("animate-blink-red");
        }

        // --- 3. DATA SENSUS JEMAAT ---
        async function loadSensusData() {
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data jemaat...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAllUsers`);
                const result = await res.json();
                const users = result.users || [];
				const adminData = JSON.parse(sessionStorage.getItem("admin_gereja") || "{}");
				const adminRole = (adminData.role || "").toLowerCase();
				const isPetugasSensus = adminRole.includes("sensus");
				
                if (users.length === 0) {
                    area.innerHTML = `<p class="text-center text-slate-500 text-sm py-10">Belum ada data jemaat terdaftar.</p>`;
                    return;
                }

                area.innerHTML = `
                    <div class="space-y-4 w-full">
                        <div>
                            <h3 class="font-bold text-sm">Daftar Sensus Jemaat (${users.length} Jiwa)</h3>
                            <p class="text-xs text-slate-500">Data lengkap, username unik, dan verifikasi centang biru jemaat.</p>
                        </div>
                        <div class="overflow-x-auto w-full">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-600">
                                        <th class="p-2.5">Nama & Username Unik</th>
                                        <th class="p-2.5">Gender / Status</th>
                                        <th class="p-2.5">Ling / Rayon</th>
                                        <th class="p-2.5">No. WhatsApp</th>
                                        <th class="p-2.5">Alamat & Pekerjaan</th>
                                        <th class="p-2.5 text-center">Status Verifikasi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${users.map(u => `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-2.5">
                                                <div class="font-bold text-slate-900">${u.nama_lengkap}</div>
                                                <div class="font-mono text-[11px] text-purple-600">${u.username || '-'}</div>
                                            </td>
                                            <td class="p-2.5">
                                                <div class="text-slate-700">${u.jenis_kelamin || '-'}</div>
                                                <div class="text-[10px] text-purple-700 font-medium">${u.status_pelayanan || 'Jemaat'}</div>
                                            </td>
                                            <td class="p-2.5">Ling. ${u.lingkungan || '-'} <br>Rayon ${u.rayon || '-'}</td>
                                            <td class="p-2.5">${u.no_whatsapp || '-'}</td>
                                            <td class="p-2.5 text-slate-500 text-[11px]">
                                                <div>${u.alamat || '<span class="italic text-amber-600">Belum diisi</span>'}</div>
                                                <div class="text-[10px] text-slate-400">${u.pekerjaan || ''}</div>
                                            </td>
											<td class="p-2.5 text-center">
											    ${u.is_verified ? 
											        `<span class="bg-blue-100 text-blue-700 font-semibold px-2 py-1 rounded text-[10px] inline-block">☑️ Terverifikasi</span>` : 
											        `<button ${isPetugasSensus ? `onclick="verifyUser('${u.id}', '${u.nama_lengkap}')"` : `disabled title="Akses Khusus Petugas Sensus"`} 
											            class="bg-amber-100 ${isPetugasSensus ? 'hover:bg-amber-200' : 'opacity-50 cursor-not-allowed'} text-amber-800 font-semibold px-2.5 py-1 rounded text-[10px] transition">
											            Verifikasi
											        </button>`
											    }
											</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (err) {
                area.innerHTML = `<p class="text-center text-rose-500 text-sm py-10">Gagal memuat data jemaat: ${err}</p>`;
            }
        }

        async function verifyUser(userId, userNama) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "verifyUser", 
                        user_id: userId, 
                        admin_id: admin.id,
                        admin_nama: admin.nama,
                        catatan_log: `Memverifikasi centang biru untuk jemaat: ${userNama}`
                    })
                });
                const result = await res.json();
                alert(result.message);
                loadSensusData(); 
            } catch (err) {
                alert("Gagal memverifikasi user: " + err);
            }
        }

        // --- 4. MODERASI KOTAK DOA ---
        async function loadPrayerData() {
            clearPrayerBlink();
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data kotak doa...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdminPrayers`);
                const result = await res.json();
                const prayers = result.prayers || [];
                lastPrayerCount = prayers.length;

                if (prayers.length === 0) {
                    area.innerHTML = `<p class="text-center text-slate-500 text-sm py-10">Belum ada pokok doa dari jemaat.</p>`;
                    return;
                }

                area.innerHTML = `
                    <div class="space-y-4 w-full">
                        <div>
                            <h3 class="font-bold text-sm mb-1">Moderasi Kotak Doa Jemaat</h3>
                            <p class="text-xs text-slate-500">Setujui pokok doa berstatus publik agar tampil otomatis di Dinding Doa jemaat.</p>
                        </div>
                        <div class="space-y-3 w-full">
                            ${prayers.map(p => `
                                <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3 w-full">
                                    <div class="space-y-1 flex-1">
                                        <div class="flex items-center gap-2">
                                            <span class="bg-purple-100 text-purple-800 text-[10px] px-2 py-0.5 rounded font-semibold">${p.kategori_doa}</span>
                                            <span class="bg-slate-200 text-slate-700 text-[10px] px-2 py-0.5 rounded">${p.status_privasi}</span>
                                            <span class="text-[10px] font-bold ${p.status_approval === 'Approved' ? 'text-emerald-600' : 'text-amber-600'}">Status: ${p.status_approval || 'Pending'}</span>
                                        </div>
                                        <p class="text-xs text-slate-800 font-medium italic">"${p.isi_doa}"</p>
                                        <p class="text-[10px] text-slate-500">Pengirim: <strong>${p.nama_pengirim}</strong> &bull; ${new Date(p.timestamp).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'})}</p>
                                    </div>
                                    <div>
                                        ${p.status_approval === 'Approved' ? `
                                            <button onclick="takedownPrayer('${p.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">Arsipkan</button>
                                        ` : p.status_privasi === 'Publik' ? `
                                            <button onclick="approvePrayer('${p.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">Setujui Tayang</button>
                                        ` : `<span class="text-[11px] text-slate-400 font-medium">Rahasia</span>`}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (err) {
                area.innerHTML = `<p class="text-center text-rose-500 text-sm py-10">Gagal memuat data doa.</p>`;
            }
        }

        async function approvePrayer(prayerId) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "approvePrayer", 
                        prayer_id: prayerId, 
                        admin_id: admin.id,
                        admin_nama: admin.nama,
                        catatan_log: "Menyetujui (Approve) kotak doa tayang ke publik."
                    })
                });
                const result = await res.json();
                alert(result.message);
                loadPrayerData();
            } catch (err) {
                alert("Gagal menyetujui doa: " + err);
            }
        }

        async function takedownPrayer(prayerId) {
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja"));
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ 
                        action: "takedownPrayer", 
                        prayer_id: prayerId, 
                        admin_id: admin.id,
                        admin_nama: admin.nama,
                        catatan_log: "Menurunkan (Takedown) kotak doa dari publik."
                    })
                });
                const result = await res.json();
                alert(result.message || "Doa berhasil diarsipkan.");
                loadPrayerData();
            } catch (err) {
                alert("Gagal melakukan takedown doa: " + err);
            }
        }

        // --- 5. KELOLA DONASI ---
        async function loadDonationAdmin() {
            clearDonationBlink();
            const area = document.getElementById("adminContentArea");
            area.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">Memuat data donasi...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAdminDonations`);
                const result = await res.json();
                const donations = result.donations || [];
                lastDonationCount = donations.length;

                area.innerHTML = `
                    <div class="space-y-4 w-full">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-sm">Verifikasi & Pencatatan Donasi</h3>
                                <p class="text-xs text-slate-500">Kelola dan setujui persembahan kasih jemaat.</p>
                            </div>
                            <button onclick="loadDonationForm()" class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-semibold transition">➕ Input Donasi Manual</button>
                        </div>
                        <div class="space-y-3 w-full">
                            ${donations.length === 0 ? `<p class="text-center text-slate-500 text-sm py-6">Belum ada riwayat donasi.</p>` : 
                                donations.map(d => `

        async function fetchEventsForAdmin() {

                const events = result.events || [];
                window.eventsCacheList = events;

                document.getElementById("eventsListLoading").classList.add("hidden");
                const wrapper = document.getElementById("eventsListWrapper");
                wrapper.classList.remove("hidden");

                if (events.length === 0) {
                    wrapper.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Belum ada agenda kegiatan tersimpan.</p>`;
                    return;
                }

                wrapper.innerHTML = events.map(ev => `
                    <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl flex justify-between items-center gap-3">
                        <div class="space-y-0.5 flex-1">
                            <h4 class="text-xs font-bold text-slate-900">${ev.nama_kegiatan}</h4>
                            <p class="text-[11px] text-slate-600">📅 ${ev.tanggal || '-'} ${ev.waktu ? '• ⏰ ' + ev.waktu : ''} • 📍 ${ev.lokasi || '-'}</p>
                            ${ev.keterangan ? `<p class="text-[10px] text-slate-500 italic">"${ev.keterangan}"</p>` : ''}

                        <div class="flex items-center gap-1.5 shrink-0">

                document.getElementById("eventsListLoading").innerText = "Gagal memuat daftar kegiatan.";

            document.getElementById("evWaktu").value = target.waktu || "";

            document.getElementById("evKet").value = target.keterangan || "";

        async function deleteDokumen(docIdOrTitle) {
            if (!confirm("Yakin ingin menghapus dokumen arsip ini?")) return;
            const admin = JSON.parse(sessionStorage.getItem("admin_gereja") || "{}");
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "deleteDokumen",
                        doc_id: docIdOrTitle,
                        admin_id: admin.id || "SEKRETARIAT",
                        admin_nama: admin.nama || "Sekretariat",
                        catatan_log: "Menghapus dokumen arsip: " + docIdOrTitle
                    })
                });
                const result = await res.json();
                alert(result.message || "Dokumen berhasil dihapus.");
                fetchDocumentsForAdmin();
            } catch (err) {
                alert("Gagal menghapus dokumen: " + err);
            }
        }

        function cekPilihanJudul(val) {
            const w = document.getElementById("wrapperJudulManual");
            const katSelect = document.getElementById("upPilihanKategori");
            const katManualWrapper = document.getElementById("wrapperKategoriManual");

            if (val === "Warta Minggu Ini") {
                w.classList.add("hidden");
                katSelect.value = "Warta Jemaat";
                katSelect.disabled = true;
                katManualWrapper.classList.add("hidden");
            } else if (val === "Liturgi Minggu Ini") {
                w.classList.add("hidden");
                katSelect.value = "Liturgi Ibadah";
                katSelect.disabled = true;
                katManualWrapper.classList.add("hidden");
            } else if (val === "Lainnya") {
                w.classList.remove("hidden");
                katSelect.disabled = false;
            } else {
                w.classList.add("hidden");
                katSelect.disabled = false;
            }
        }

        function cekPilihanKategori(val) {
            const w = document.getElementById("wrapperKategoriManual");
            if (val === "Lainnya") w.classList.remove("hidden");
            else w.classList.add("hidden");
        }

        async function handleUploadDokumen(e) {
            e.preventDefault();
            const btn = document.getElementById("btnUpload");
            const file = document.getElementById("upFile").files[0];
            if (!file) return alert("Pilih file!");

            const judul = document.getElementById("upPilihanJudul").value === "Lainnya" 
                ? document.getElementById("upJudulManual").value 
                : document.getElementById("upPilihanJudul").value;

            const katSelect = document.getElementById("upPilihanKategori");
            katSelect.disabled = false; // Aktifkan sebentar untuk mengambil nilainya
            const kategori = katSelect.value === "Lainnya" 
                ? document.getElementById("upKategoriManual").value 
                : katSelect.value;

            btn.disabled = true;
            btn.innerText = "Mengunggah...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function() {
                try {
                    const admin = JSON.parse(sessionStorage.getItem("admin_gereja") || "{}");
                    const res = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "uploadDokumen",
                            kategori, judul,
                            fileName: file.name,
                            mimeType: file.type,
                            fileData: reader.result.split(',')[1],
                            admin_id: admin.id || "SEKRETARIAT",
                            admin_nama: admin.nama || "Sekretariat"
                        })
                    });
                    const result = await res.json();
                    alert(result.message || "Berhasil!");
                    loadUploadDokumenForm();
                } catch (err) {
                    alert("Gagal: " + err);
                } finally {
                    btn.disabled = false;
                    btn.innerText = "🚀 Unggah ke GitHub Sekarang";
                }
            };
        }

        </div>
    `;
    fetchRosterForAdmin();
}

// Logika Tampilan Dropdown "Lainnya"
function cekPilihanWaktu(val) {
    const inputManual = document.getElementById("rosWaktuManual");
    if (val === "Lainnya") {
        inputManual.classList.remove("hidden");
        inputManual.required = true;
    } else {
        inputManual.classList.add("hidden");
        inputManual.required = false;
        inputManual.value = "";
    }
}

function cekPilihanIbadah(val) {
    const inputManual = document.getElementById("rosIbadahManual");
    if (val === "Lainnya") {
        inputManual.classList.remove("hidden");
        inputManual.required = true;
    } else {
        inputManual.classList.add("hidden");
        inputManual.required = false;
        inputManual.value = "";
    }
}

function toggleRosterForm() {
    const form = document.getElementById("rosterFormContainer");
    if (form.classList.contains("hidden")) {
        form.classList.remove("hidden");
        form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        // Panggil fungsi pengambilan data jemaat
        fetchAllJemaatForSuggestions(); 
    } else {
        form.classList.add("hidden");
        resetRosterForm();
    }
}

async function fetchRosterForAdmin() {
    document.getElementById("rosterListLoading").classList.remove("hidden");
    document.getElementById("rosterListWrapper").classList.add("hidden");

    try {
        const res = await fetch(`${SCRIPT_URL}?action=getDutyRoster`);
        const result = await res.json();
        window.rosterCacheList = result.data || [];
        applyRosterFilter();
    } catch (err) {
        document.getElementById("rosterListLoading").innerText = "Gagal memuat daftar roster.";
    }
}

function applyRosterFilter() {
    const filterVal = document.getElementById("filterKategori").value;
    const wrapper = document.getElementById("rosterListWrapper");
    
    document.getElementById("rosterListLoading").classList.add("hidden");
    wrapper.classList.remove("hidden");

    let filteredData = window.rosterCacheList || [];
    
    if (filterVal !== "Semua") {
        filteredData = filteredData.filter(r => r.kategori_tugas === filterVal);
    }

    if (filteredData.length === 0) {
        wrapper.innerHTML = `<p class="text-xs text-slate-400 text-center py-8 bg-slate-50 rounded-xl border border-dashed border-slate-300">Tidak ada jadwal petugas untuk kategori <b class="text-slate-600">${filterVal}</b>.</p>`;
        return;
    }

    wrapper.innerHTML = filteredData.map(r => {
        // Konversi Format Tanggal menjadi "01 Januari 2026"
        const dateObj = new Date(r.tanggal);
        const formatTgl = !isNaN(dateObj) 
            ? dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })
            : r.tanggal;

        return `
        <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl flex justify-between items-center gap-3 hover:border-purple-300 transition">
            <div class="space-y-0.5 flex-1">
                <h4 class="text-xs font-bold text-slate-900">${r.jenis_ibadah}</h4>
                <p class="text-[11px] text-slate-600">📅 ${formatTgl} • ⏰ ${r.waktu}</p>
                <p class="text-[11px] text-slate-800 mt-1.5">
                    <span class="bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded mr-1 font-semibold">${r.kategori_tugas}</span> 
                    <span class="font-medium">${r.nama_petugas}</span>
                </p>
            </div>
            <div class="shrink-0">
                <button onclick="prepareEditRoster('${r.id}')" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-[10px] font-semibold transition flex items-center gap-1 shadow-sm">
                    ✏️ Edit
                </button>
            </div>
        </div>
        `;
    }).join('');
}

// Utilitas untuk mencocokkan nilai dengan pilihan dropdown atau mengisi input manual
function setDropdownOrManual(selectId, manualId, value) {
    const select = document.getElementById(selectId);
    const manual = document.getElementById(manualId);
    let matchFound = false;

    for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].value === value && value !== "Lainnya") {
            matchFound = true;
            break;
        }
    }

    if (matchFound) {
        select.value = value;
        manual.classList.add("hidden");
        manual.value = "";
    } else {
        select.value = "Lainnya";
        manual.classList.remove("hidden");
        manual.value = value;
    }
}

function prepareEditRoster(rosterId) {
    const target = (window.rosterCacheList || []).find(r => r.id === rosterId);
    if (!target) return alert("Data jadwal tidak ditemukan.");

    const formContainer = document.getElementById("rosterFormContainer");
    formContainer.classList.remove("hidden");
    
    document.getElementById("editRosterId").value = target.id;
    document.getElementById("rosTanggal").value = target.tanggal || "";
    document.getElementById("rosKategori").value = target.kategori_tugas || "Presbiter";
    document.getElementById("rosPetugas").value = target.nama_petugas || "";

    // Set dropdown atau field manual untuk Waktu dan Jenis Ibadah
    setDropdownOrManual("rosWaktuPilihan", "rosWaktuManual", target.waktu || "");
    setDropdownOrManual("rosIbadahPilihan", "rosIbadahManual", target.jenis_ibadah || "");

    document.getElementById("formRosterTitle").innerText = "Edit Jadwal Petugas";
    document.getElementById("formRosterSubtitle").innerText = "Perbarui detail jadwal yang sudah ada.";
    document.getElementById("btnSubmitRoster").innerText = "Perbarui Jadwal";
    document.getElementById("btnCancelEditRoster").classList.remove("hidden");
    
    formContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetRosterForm() {
    document.getElementById("formAddRoster").reset();
    document.getElementById("editRosterId").value = "";
    
    // Reset state dropdown manual
    cekPilihanWaktu(""); 
    cekPilihanIbadah("");

    document.getElementById("formRosterTitle").innerText = "Input Roster Pelayanan";
    document.getElementById("formRosterSubtitle").innerText = "Tambahkan jadwal tugas jemaat ke dalam Sheet Roster.";
    document.getElementById("btnSubmitRoster").innerText = "Simpan ke Data Roster";
    document.getElementById("btnCancelEditRoster").classList.add("hidden");
}

async function handleSaveRoster(e) {
    e.preventDefault();
    const admin = JSON.parse(sessionStorage.getItem("admin_gereja") || "{}");
    const btn = document.getElementById("btnSubmitRoster");
    const editId = document.getElementById("editRosterId").value;

    // Ambil nilai akhir (dari dropdown atau input manual)
    const finalWaktu = document.getElementById("rosWaktuPilihan").value === "Lainnya" 
        ? document.getElementById("rosWaktuManual").value 
        : document.getElementById("rosWaktuPilihan").value;
        
    const finalIbadah = document.getElementById("rosIbadahPilihan").value === "Lainnya" 
        ? document.getElementById("rosIbadahManual").value 
        : document.getElementById("rosIbadahPilihan").value;
    
    btn.disabled = true;
    btn.innerText = "Menyimpan ke Database...";

    const payload = {
        action: editId ? "updateRoster" : "addRoster",
        roster_id: editId,
        admin_id: admin.id || "SEKRETARIAT",
        admin_nama: admin.nama || "Sekretariat",
        catatan_log: editId ? `Mengedit roster: ${document.getElementById("rosPetugas").value}` : `Menginput roster baru`,
        tanggal: document.getElementById("rosTanggal").value,
        waktu: finalWaktu,
        jenis_ibadah: finalIbadah,
        kategori_tugas: document.getElementById("rosKategori").value,
        nama_petugas: document.getElementById("rosPetugas").value
    };

    try {
        const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        alert(result.message || "Data berhasil disimpan!");
        
        toggleRosterForm();
        fetchRosterForAdmin();
    } catch (err) {
        alert("Gagal menyimpan roster: " + err);
    } finally {
        btn.disabled = false;
        btn.innerText = "Simpan ke Data Roster";
    }
}

// Memanggil API untuk mendapatkan semua nama jemaat, hanya sekali di awal
async function fetchAllJemaatForSuggestions() {
    if (allJemaatCache.length > 0) return; // Gunakan cache jika sudah ada
    try {
        const res = await fetch(`${SCRIPT_URL}?action=getAllUsers`);
        const result = await res.json();
        if (result.status === "success") {
            // Ambil hanya nama_lengkap
            allJemaatCache = result.users.map(u => u.nama_lengkap); 
        }
    } catch (err) {
        console.error("Gagal memuat data jemaat untuk sugesti:", err);
    }
}

// Menampilkan kotak sugesti saat pengguna mengetik
function showPetugasSuggestions(query) {
    const suggestionBox = document.getElementById("petugasSuggestionBox");
    
    // Jika input kosong, sembunyikan kotak sugesti
    if (!query.trim()) {
        suggestionBox.classList.add("hidden");
        return;
    }

    // Filter nama dari cache yang mengandung query pencarian (case-insensitive)
    const matches = allJemaatCache.filter(nama => 
        nama.toLowerCase().includes(query.toLowerCase())
    );

    // Jika ada hasil yang cocok
    if (matches.length > 0) {
        suggestionBox.innerHTML = matches.map(nama => `
            <div onclick="selectPetugasSuggestion('${nama}')" class="px-3 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white cursor-pointer border-b border-slate-700/50 last:border-0 transition-colors">
                ${nama}
            </div>
        `).join('');
        suggestionBox.classList.remove("hidden");
    } else {
        // Jika tidak ada hasil, sembunyikan (biarkan user mengetik manual)
        suggestionBox.classList.add("hidden");
    }
}

// Memasukkan nama yang diklik dari sugesti ke dalam input box
function selectPetugasSuggestion(nama) {
    const input = document.getElementById("rosPetugas");
    input.value = nama;
    document.getElementById("petugasSuggestionBox").classList.add("hidden");
}

// Menutup dropdown sugesti jika user mengklik area lain di luar form
document.addEventListener("click", function(e) {
    const suggestionBox = document.getElementById("petugasSuggestionBox");
    const inputField = document.getElementById("rosPetugas");
    if (suggestionBox && !suggestionBox.contains(e.target) && e.target !== inputField) {
        suggestionBox.classList.add("hidden");
    }
});
    </script>
